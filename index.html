<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>Tasks Dashboard</title>

<script src="https://accounts.google.com/gsi/client"></script>

<style>
/* =========================================================
   基本設定
========================================================= */

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #121212;
    color: #ffffff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;
}

body {
    min-height: 100vh;
}

button {
    font-family: inherit;
}


/* =========================================================
   App
========================================================= */

.app {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;

    background: #121212;
}


/* =========================================================
   Header
========================================================= */

.header {
    flex: 0 0 auto;

    width: 100%;

    padding: 10px 18px 9px;

    background: #121212;

    border-bottom: 1px solid #292929;

    z-index: 100;
}

.header-main {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;
}

.header-left {
    min-width: 0;

    display: flex;
    align-items: center;

    gap: 14px;
}

.title {
    font-size: 1.35rem;
    font-weight: 700;

    white-space: nowrap;
}

.clock {
    font-size: 1.25rem;
    font-weight: 600;

    color: #bbbbbb;

    font-variant-numeric: tabular-nums;

    white-space: nowrap;
}

.header-right {
    display: flex;
    align-items: center;

    gap: 6px;
}

.header-button {
    min-height: 34px;

    padding: 0 11px;

    border: 0;
    border-radius: 9px;

    background: #292929;

    color: #ffffff;

    font-size: 0.78rem;

    cursor: pointer;
}

.header-button:active {
    background: #3a3a3a;
}

.logout-button {
    display: none;
}


/* =========================================================
   Weather bar
========================================================= */

.weather-bar {
    margin-top: 7px;

    display: flex;
    align-items: center;

    gap: 18px;

    overflow-x: auto;

    white-space: nowrap;

    scrollbar-width: none;
}

.weather-bar::-webkit-scrollbar {
    display: none;
}

.weather-item {
    display: flex;
    align-items: center;

    gap: 5px;

    font-size: 0.83rem;

    color: #bbbbbb;
}

.weather-value {
    color: #ffffff;

    font-weight: 600;
}

.weather-location {
    color: #666666;

    font-size: 0.7rem;
}

.weather-status {
    color: #666666;

    font-size: 0.68rem;
}

.aqhi-value {
    font-weight: 700;
}

.aqhi-low {
    color: #81c784;
}

.aqhi-moderate {
    color: #ffca5c;
}

.aqhi-high {
    color: #ff9b6b;
}

.aqhi-very-high {
    color: #ff7373;
}

.aqhi-serious {
    color: #ff4f81;
}


/* =========================================================
   Dashboard
========================================================= */

.dashboard {
    flex: 1 1 auto;

    min-height: 0;

    padding: 12px;

    display: grid;

    grid-template-columns:
        minmax(0, 1.8fr)
        minmax(230px, 1fr)
        minmax(280px, 1.15fr);

    gap: 12px;
}


/* =========================================================
   Card
========================================================= */

.panel {
    min-width: 0;
    min-height: 0;

    display: flex;
    flex-direction: column;

    background: #181818;

    border: 1px solid #282828;

    border-radius: 14px;

    overflow: hidden;
}

.panel-header {
    flex: 0 0 auto;

    min-height: 50px;

    padding: 12px 15px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid #282828;

    background: #1b1b1b;
}

.panel-title {
    font-size: 1rem;

    font-weight: 700;
}

.panel-subtitle {
    color: #666666;

    font-size: 0.68rem;
}


/* =========================================================
   Tasks
========================================================= */

.task-area {
    flex: 1 1 auto;

    min-height: 0;

    overflow-y: auto;

    padding: 10px;

    -webkit-overflow-scrolling: touch;
}

#tasks {
    display: flex;
    flex-direction: column;

    gap: 8px;
}

.task {
    width: 100%;

    min-height: 66px;

    padding: 9px 11px;

    display: flex;
    align-items: center;

    border-radius: 11px;

    background: #222222;

    transition:
        opacity 0.25s ease,
        transform 0.25s ease,
        background 0.15s ease;
}

.task:active {
    background: #292929;
}

.task.fading {
    opacity: 0;

    transform: translateX(35px);
}


/* Checkbox */

.task-checkbox {
    flex: 0 0 auto;

    width: 28px;
    height: 28px;

    margin-right: 12px;

    border: 2px solid #888888;

    border-radius: 50%;

    background: transparent;

    position: relative;

    cursor: pointer;
}

.task-checkbox.done {
    border-color: #777777;

    background: #777777;
}

.task-checkbox.done::after {
    content: "";

    position: absolute;

    left: 7px;
    top: 3px;

    width: 7px;
    height: 13px;

    border-right: 2px solid #ffffff;
    border-bottom: 2px solid #ffffff;

    transform: rotate(45deg);
}


/* Task content */

.task-content {
    min-width: 0;

    flex: 1;
}

.task-title {
    font-size: 1.08rem;

    line-height: 1.35;

    font-weight: 500;

    word-break: break-word;
}

.task-date {
    margin-top: 3px;

    font-size: 0.76rem;

    color: #888888;
}

.task-date.overdue {
    color: #ff7777;
}

.task-date.today {
    color: #ffb74d;
}

.task-date.tomorrow {
    color: #81c784;
}

.empty {
    padding: 45px 20px;

    text-align: center;

    color: #666666;

    font-size: 0.95rem;
}

.status {
    padding: 5px 5px 2px;

    min-height: 20px;

    text-align: center;

    color: #555555;

    font-size: 0.65rem;
}


/* =========================================================
   Weather panel
========================================================= */

.weather-panel-body {
    flex: 1 1 auto;

    min-height: 0;

    overflow-y: auto;

    padding: 14px;
}

.current-weather {
    padding: 4px 2px 15px;

    text-align: center;

    border-bottom: 1px solid #292929;
}

.current-icon {
    font-size: 3.1rem;

    line-height: 1;

    margin-bottom: 6px;
}

.current-temp {
    font-size: 2.7rem;

    line-height: 1;

    font-weight: 700;
}

.current-description {
    margin-top: 7px;

    color: #bbbbbb;

    font-size: 0.9rem;
}

.weather-extra {
    margin-top: 12px;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 7px;
}

.weather-stat {
    padding: 8px;

    border-radius: 8px;

    background: #222222;

    text-align: center;
}

.weather-stat-label {
    font-size: 0.65rem;

    color: #777777;
}

.weather-stat-value {
    margin-top: 3px;

    font-size: 0.85rem;

    font-weight: 600;
}

.forecast-title {
    margin-top: 15px;
    margin-bottom: 7px;

    color: #888888;

    font-size: 0.72rem;

    font-weight: 600;
}

.forecast-list {
    display: flex;

    flex-direction: column;

    gap: 5px;
}

.forecast-row {
    padding: 7px 8px;

    display: grid;

    grid-template-columns: 55px 30px 1fr 65px;

    align-items: center;

    gap: 5px;

    border-radius: 8px;

    background: #222222;
}

.forecast-day {
    font-size: 0.73rem;

    color: #aaaaaa;
}

.forecast-icon {
    font-size: 1rem;

    text-align: center;
}

.forecast-weather {
    min-width: 0;

    font-size: 0.72rem;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    color: #cccccc;
}

.forecast-temp {
    font-size: 0.68rem;

    color: #888888;

    text-align: right;
}


/* =========================================================
   Gmail
========================================================= */

.mail-area {
    flex: 1 1 auto;

    min-height: 0;

    overflow-y: auto;

    padding: 9px;

    -webkit-overflow-scrolling: touch;
}

.mail-list {
    display: flex;

    flex-direction: column;

    gap: 7px;
}

.mail-item {
    width: 100%;

    padding: 11px 12px;

    border: 0;

    border-radius: 10px;

    background: #222222;

    color: #ffffff;

    text-align: left;

    cursor: pointer;

    transition: background 0.15s ease;
}

.mail-item:active {
    background: #2d2d2d;
}

.mail-item.unread {
    border-left: 3px solid #ffffff;

    padding-left: 9px;
}

.mail-top {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 8px;
}

.mail-sender {
    min-width: 0;

    flex: 1;

    font-size: 0.83rem;

    font-weight: 600;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.mail-time {
    flex: 0 0 auto;

    color: #666666;

    font-size: 0.64rem;
}

.mail-subject {
    margin-top: 5px;

    font-size: 0.82rem;

    line-height: 1.35;

    color: #cccccc;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.mail-snippet {
    margin-top: 4px;

    font-size: 0.68rem;

    line-height: 1.35;

    color: #777777;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.mail-empty {
    padding: 50px 15px;

    text-align: center;

    color: #666666;

    font-size: 0.9rem;
}

.mail-error {
    padding: 30px 15px;

    text-align: center;

    color: #777777;

    font-size: 0.78rem;

    line-height: 1.6;
}


/* =========================================================
   Login
========================================================= */

.overlay {
    position: fixed;

    inset: 0;

    z-index: 1000;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: #121212;
}

.login-box {
    width: min(420px, 100%);

    padding: 30px;

    border-radius: 18px;

    background: #1e1e1e;

    text-align: center;
}

.login-title {
    margin-bottom: 10px;

    font-size: 1.5rem;

    font-weight: 700;
}

.login-description {
    margin-bottom: 24px;

    color: #999999;

    line-height: 1.6;

    font-size: 0.9rem;
}

.login-button {
    width: 100%;

    min-height: 50px;

    border: 0;

    border-radius: 12px;

    background: #ffffff;

    color: #111111;

    font-size: 1rem;

    font-weight: 600;

    cursor: pointer;
}

.login-note {
    margin-top: 14px;

    color: #666666;

    font-size: 0.7rem;

    line-height: 1.5;
}


/* =========================================================
   Responsive
========================================================= */

@media (max-width: 850px) {

    .dashboard {
        grid-template-columns:
            minmax(0, 1.55fr)
            minmax(210px, 0.9fr)
            minmax(240px, 1fr);
    }

    .task-title {
        font-size: 1rem;
    }

    .current-temp {
        font-size: 2.3rem;
    }

    .forecast-row {
        grid-template-columns: 45px 25px 1fr;
    }

    .forecast-temp {
        display: none;
    }
}

@media (max-width: 680px) {

    .dashboard {
        grid-template-columns: 1fr;
        overflow-y: auto;
    }

    .panel {
        min-height: 350px;
    }
}
</style>
</head>

<script>
/* =========================================================
   CONFIG
========================================================= */

const CLIENT_ID =
    "710651032876-n8m8m7g3rhne9f2r3m0b78vkoqh18lhl.apps.googleusercontent.com";


/*
 * Tasks + Gmail
 *
 * Gmail scope 是新增的。
 *
 * 第一次登入時 Google 會要求 Gmail 權限。
 */

const GOOGLE_SCOPE =
    "https://www.googleapis.com/auth/tasks " +
    "https://www.googleapis.com/auth/gmail.readonly";


const GOOGLE_API =
    "https://tasks.googleapis.com/tasks/v1";


const GMAIL_API =
    "https://gmail.googleapis.com/gmail/v1";


const HKO_API =
    "https://data.weather.gov.hk/weatherAPI/opendata/weather.php";


const AQHI_API =
    "https://dashboard.data.gov.hk/api/aqhi-individual?format=json";


/* 更新時間 */

const TASK_SYNC_INTERVAL =
    5000;

const GMAIL_SYNC_INTERVAL =
    60000;

const WEATHER_INTERVAL =
    10 * 60 * 1000;


/* =========================================================
   STATE
========================================================= */

let accessToken = null;

let tokenClient = null;

let taskListId = null;

let tasksData = [];

let gmailData = [];

let weatherData = null;

let forecastData = null;


/* =========================================================
   DOM
========================================================= */

const loginOverlay =
    document.getElementById("loginOverlay");

const loginButton =
    document.getElementById("loginButton");

const logoutButton =
    document.getElementById("logoutButton");

const syncButton =
    document.getElementById("syncButton");

const fullscreenButton =
    document.getElementById("fullscreenButton");

const tasksContainer =
    document.getElementById("tasks");

const statusElement =
    document.getElementById("status");

const taskCountElement =
    document.getElementById("taskCount");

const mailList =
    document.getElementById("mailList");

const mailCountElement =
    document.getElementById("mailCount");


/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    const now = new Date();

    const hh =
        String(now.getHours()).padStart(2, "0");

    const mm =
        String(now.getMinutes()).padStart(2, "0");

    document.getElementById("clock").textContent =
        `${hh}:${mm}`;
}

updateClock();

setInterval(updateClock, 1000);


/* =========================================================
   DATE HELPERS
========================================================= */

function getDateOnly(date) {

    return new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
    );
}


function getToday() {

    return getDateOnly(new Date());
}


function getTomorrow() {

    const tomorrow = getToday();

    tomorrow.setDate(
        tomorrow.getDate() + 1
    );

    return tomorrow;
}


function formatDate(date) {

    return `${date.getMonth() + 1}/${date.getDate()}`;
}


function getTaskDateInfo(dateString) {

    if (!dateString) {
        return null;
    }

    const date =
        new Date(dateString);

    if (isNaN(date.getTime())) {
        return null;
    }

    const dateOnly =
        getDateOnly(date);

    const today =
        getToday();

    const tomorrow =
        getTomorrow();


    if (dateOnly < today) {

        return {
            text:
                `逾期 · ${formatDate(dateOnly)}`,
            type:
                "overdue"
        };

    }


    if (
        dateOnly.getTime() ===
        today.getTime()
    ) {

        return {
            text:
                "今日",
            type:
                "today"
        };

    }


    if (
        dateOnly.getTime() ===
        tomorrow.getTime()
    ) {

        return {
            text:
                "明日",
            type:
                "tomorrow"
        };

    }


    return {
        text:
            `${dateOnly.getMonth() + 1}月${dateOnly.getDate()}日`,
        type:
            ""
    };
}


/* =========================================================
   GOOGLE TASKS
========================================================= */

async function getDefaultTaskList() {

    const response =
        await fetch(
            `${GOOGLE_API}/users/@me/lists`,
            {
                headers: {
                    Authorization:
                        `Bearer ${accessToken}`
                }
            }
        );


    if (!response.ok) {

        throw new Error(
            "無法取得 Task List"
        );

    }


    const data =
        await response.json();


    /*
     * 優先尋找 @default
     */

    const defaultList =
        data.items?.find(
            item =>
                item.id === "@default"
        );


    if (defaultList) {
        return defaultList.id;
    }


    /*
     * 如果 API 沒有直接回 @default，
     * 就使用第一個 Task List。
     */

    if (
        data.items &&
        data.items.length > 0
    ) {

        return data.items[0].id;

    }


    throw new Error(
        "找不到 Google Tasks List"
    );
}


/* =========================================================
   LOAD TASKS
========================================================= */

async function loadTasks() {

    if (!accessToken) {
        return;
    }


    try {

        if (!taskListId) {

            taskListId =
                await getDefaultTaskList();

        }


        const url =
            `${GOOGLE_API}/lists/` +
            `${encodeURIComponent(taskListId)}` +
            `/tasks` +
            `?showCompleted=false` +
            `&showDeleted=false` +
            `&maxResults=100`;


        const response =
            await fetch(
                url,
                {
                    headers: {

                            `Bearer ${accessToken}`
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "無法取得 Tasks"
            );

        }


        const data =
            await response.json();


        tasksData =
            data.items || [];


        renderTasks();

            `Tasks ${formatTime(new Date())}`
        );

    }
    catch (error) {

        console.error(
            "Tasks error:",
            error
        );

        setStatus(
            "Tasks 同步失敗"
        );

    }
}


/* =========================================================
   SORT TASKS
========================================================= */

function sortTasks(tasks) {

    return [...tasks].sort(
        (a, b) => {

            /*
             * 沒日期永遠放最後
             */

            if (!a.due && !b.due) {
                return 0;
            }

            if (!a.due) {
                return 1;
            }

            if (!b.due) {
                return -1;
            }


            /*
             * 同日期保持原 API 順序
             */

            return (
                new Date(a.due) -
                new Date(b.due)
            );

        }
    );
}

========================================================= */

async function completeTask(
    task,
    card,
    checkbox
) {

    if (!accessToken || !taskListId) {
        return;
    }


    /*
     * Optimistic UI
     */

    checkbox.className =
        "task-checkbox done";

    card.className =
        "task fading";


    try {

        const response =
            await fetch(
                `${GOOGLE_API}/lists/` +
                `${encodeURIComponent(taskListId)}` +
                `/tasks/` +
                `${encodeURIComponent(task.id)}`,
                {
                    method: "PATCH",

                    headers: {
                        Authorization:
                            `Bearer ${accessToken}`,

                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        status:
                            "completed"
                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                "完成 Task 失敗"
            );

        }


        setTimeout(
            () => {

                tasksData =
                    tasksData.filter(
                        item =>
                            item.id !== task.id
                    );

            },
            250
        );

    }
    catch (error) {

        console.error(

        );


        /*
         * 失敗就恢復
         */

        checkbox.className =
            "task-checkbox";

        card.className =
            "task";


        setStatus(
            "完成 Task 失敗"
        );

    }
}

/* =========================================================
   GET GMAIL MESSAGE
========================================================= */

async function getGmailMessage(
    messageId
) {

    const url =
        `${GMAIL_API}/users/me/messages/` +
        `${encodeURIComponent(messageId)}` +
        `?format=metadata` +
        `&metadataHeaders=From` +
        `&metadataHeaders=Subject`;


    const response =
        await fetch(
            url,
            {
                headers: {
                    Authorization:
                        `Bearer ${accessToken}`
                }
            }
        );


    if (!response.ok) {
        return null;
    }


    const data =
        await response.json();


    const headers =
        data.payload?.headers || [];


    const fromHeader =
        headers.find(
            item =>
                item.name.toLowerCase() ===
                "from"
        );


    const subjectHeader =
        headers.find(
            item =>
                item.name.toLowerCase() ===
                "subject"
        );


    return {

        id:
            data.id,

        threadId:
            data.threadId,

        sender:
            cleanSender(
                fromHeader?.value ||
                "未知寄件人"
            ),

        subject:
            decodeHeader(
                subjectHeader?.value ||
                "(沒有主旨)"
            ),

        snippet:
            data.snippet || "",

        timestamp:
            Number(
                data.internalDate ||
                Date.now()
            )

    };
}


/* =========================================================
   GMAIL SENDER
========================================================= */

function cleanSender(value) {

    /*
     * 將：
     *
     * Woody <example@gmail.com>
     *
     * 顯示成：
     *
     * Woody
     */

    const match =
        value.match(
            /^(.+?)\s*<[^>]+>$/
        );


    if (match) {

        return match[1]
            .replace(/^["']|["']$/g, "")
            .trim();

    }


    return value;
}


/* =========================================================
   GMAIL HEADER DECODE
========================================================= */

function decodeHeader(value) {

    /*
     * Gmail metadata 通常已經可以直接顯示。
     *
     * 如果遇到 encoded-word，
     * 嘗試簡單解碼。
     */

    try {

        return value.replace(
            /=\?UTF-8\?B\?([^?]+)\?=/gi,
            function(
                match,
                encoded
            ) {

                try {

                    return decodeURIComponent(
                        escape(
                            atob(encoded)
                        )
                    );

                }
                catch {

                    return match;

                }

            }
        );

    }
    catch {

        return value;

    }
}

/* =========================================================
   MAIL TIME
========================================================= */

function formatMailTime(date) {

    const now =
        new Date();


    const sameDay =
        date.toDateString() ===
        now.toDateString();


    if (sameDay) {

        return (
            String(
                date.getHours()
            ).padStart(2, "0")
            +
            ":"
            +
            String(
                date.getMinutes()
            ).padStart(2, "0")
        );

    }


    return (
        `${date.getMonth() + 1}/` +
        `${date.getDate()}`
    );
}

/* =========================================================
   WEATHER ICON
========================================================= */

function weatherIcon(
    description,
    iconCode
) {

    const text =
        String(
            description || ""
        );


    if (
        text.includes("雷")
    ) {
        return "⛈️";
    }


    if (
        text.includes("雨") ||
        text.includes("驟")
    ) {
        return "🌧️";
    }


    if (
        text.includes("陰")
    ) {
        return "☁️";
    }


    if (
        text.includes("雲")
    ) {
        return "⛅";
    }


    if (
        text.includes("晴")
    ) {
        return "☀️";
    }


    /*
     * HKO icon number fallback
     */

    const code =
        Number(iconCode);


    if (
        [50, 51, 52, 53, 54, 60, 61, 62]
            .includes(code)
    ) {
        return "🌧️";
    }


    if (
        [20, 21, 22, 23, 24]
            .includes(code)
    ) {
        return "☁️";
    }


    return "🌤️";
}

/* =========================================================
   RAIN PROBABILITY
========================================================= */

function getRainProbability() {

    const list =
        forecastData?.weatherForecast;


    if (
        !Array.isArray(list) ||
        list.length === 0
    ) {

        return "--";

    }


    const today =
        list[0];


    const psr =
        String(
            today?.PSR ||
            today?.psr ||
            ""
        );


    /*
     * HKO 官方 PSR 不是精確百分比，
     * 而是 High / Medium High 等級。
     */

    if (
        psr.toLowerCase()
            .includes("high")
    ) {

        return "較高";

    }


    if (
        psr.toLowerCase()
            .includes("medium")
    ) {

        return "中等";

    }


    if (
        psr.toLowerCase()
            .includes("low")
    ) {

        return "較低";

    }


    return psr || "--";
}

/* =========================================================
   FORECAST DATE
========================================================= */

function formatForecastDate(
    dateString
) {

    if (!dateString) {
        return "--";
    }


    const year =
        Number(
            String(dateString).slice(0, 4)
        );

    const month =
        Number(
            String(dateString).slice(4, 6)
        );

    const day =
        Number(
            String(dateString).slice(6, 8)
        );


    const date =
        new Date(
            year,
            month - 1,
            day
        );


    const today =
        getToday();


    const tomorrow =
        getTomorrow();


    if (
        date.getTime() ===
        today.getTime()
    ) {

        return "今日";

    }


    if (
        date.getTime() ===
        tomorrow.getTime()
    ) {

        return "明日";

    }


    const week =
        [
            "日",
            "一",
            "二",
            "三",
            "四",
            "五",
            "六"
        ][
            date.getDay()
        ];


    return `${month}/${day} ${week}`;
}

    if (
        max !== undefined &&
        min !== undefined
    ) {

        return `${min}°-${max}°`;

    }


    return "--";
}

/* =========================================================
   FIND AQHI
========================================================= */

function findAQHIValue(
    data
) {

    /*
     * API 格式可能會因 dataset 更新而不同，
     * 所以用幾種常見結構尋找北區。
     */

    const items =
        Array.isArray(data)
            ? data
            : (
                data?.data ||
                data?.records ||
                data?.results ||
                []
            );


    if (!Array.isArray(items)) {
        return null;
    }


    /*
     * 優先北區
     */

    const north =
        items.find(
            item => {

                const text =
                    JSON.stringify(
                        item
                    );


                return (
                    text.includes("北區") ||
                    text.toLowerCase()
                        .includes("north")
                );

            }
        );


    const target =
        north ||
        items[0];


    if (!target) {
        return null;
    }


    return (
        target.aqhi ??
        target.AQHI ??
        target.value ??
        target.index ??
        target.current ??
        null
    );
}


/* =========================================================
   RENDER AQHI
========================================================= */

function renderAQHI(
    value
) {

    const element =
        document.getElementById(
            "topAQHI"
        );


    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        element.textContent =
            "--";

        element.className =
            "weather-value aqhi-value";

        return;
    }


    const number =
        Number(value);


    element.textContent =
        `AQHI ${value}`;


    let className =
        "weather-value aqhi-value";


    if (number <= 3) {

        className +=
            " aqhi-low";

    }
    else if (number <= 6) {

        className +=
            " aqhi-moderate";

    }
    else if (number <= 7) {

        className +=
            " aqhi-high";

    }
    else if (number <= 10) {

        className +=
            " aqhi-very-high";

    }
    else {

        className +=
            " aqhi-serious";

    }


    element.className =
        className;
}

        +
        ":"
        +
        String(
            date.getMinutes()
        ).padStart(2, "0")
        +
        ":"
        +
        String(
            date.getSeconds()
        ).padStart(2, "0")
    );
}


/* =========================================================
   FULLSCREEN
========================================================= */

fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                    .requestFullscreen();

            }
            else {

                await document.exitFullscreen();

            }

        }
        catch (error) {

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }
);


/* =========================================================
   GOOGLE LOGIN
========================================================= */

function initGoogleLogin() {

    if (
        typeof google === "undefined" ||
        !google.accounts ||
        !google.accounts.oauth2
    ) {

        console.error(
            "Google Identity Services 未載入"
        );

        return;
    }


    tokenClient =
        google.accounts.oauth2.initTokenClient({

            client_id:
                CLIENT_ID,

            scope:
                GOOGLE_SCOPE,

            callback:
                async response => {

                    if (
                        response.error
                    ) {

                        console.error(
                            "OAuth error:",
                            response
                        );

                        return;

                    }


                    accessToken =
                        response.access_token;


                    loginOverlay.style.display =
                        "none";


                    logoutButton.style.display =
                        "block";


                    taskListId =
                        null;


                    await initialLoad();

                }

        });

}


/* =========================================================
   LOGIN
========================================================= */

loginButton.addEventListener(
    "click",
    () => {

        if (!tokenClient) {

            alert(
                "Google 登入元件仍在載入，請稍候再試。"
            );

            return;

        }


        tokenClient.requestAccessToken({
            prompt: "consent"
        });

    }
);


/* =========================================================
   LOGOUT
========================================================= */

logoutButton.addEventListener(
    "click",
    () => {

        if (
            accessToken &&
            google?.accounts?.oauth2
        ) {

            google.accounts.oauth2.revoke(
                accessToken,
                () => {

                    console.log(
                        "Google access revoked"
                    );

                }
            );

        }


        accessToken =
            null;

        taskListId =
            null;

        tasksData =
            [];

        gmailData =
            [];


        logoutButton.style.display =
            "none";


        loginOverlay.style.display =
            "flex";


        tasksContainer.innerHTML =
            `<div class="empty">
                請重新登入
             </div>`;


        mailList.innerHTML =
            `<div class="mail-empty">
                請重新登入
             </div>`;

    }
);


/* =========================================================
   MANUAL SYNC
========================================================= */

syncButton.addEventListener(
    "click",
    async () => {

        if (!accessToken) {

            return;

        }


        syncButton.textContent =
            "同步中…";


        await Promise.all([
            loadTasks(),
            loadGmail(),
            loadWeather(),
            loadAQHI()
        ]);


        syncButton.textContent =
            "↻ 同步";

    }
);


/* =========================================================
   INITIAL LOAD
========================================================= */

async function initialLoad() {

    await Promise.all([
        loadTasks(),
        loadGmail(),
        loadWeather(),
        loadAQHI()
    ]);

}


/* =========================================================
   AUTO REFRESH
========================================================= */


/*
 * Tasks：5 秒
 *
 * 主要用途：
 * 如果你用另一部手機完成 Task，
 * 呢部 Dashboard 會很快更新。
 */

setInterval(
    () => {

        if (accessToken) {
            loadTasks();
        }

    },
    TASK_SYNC_INTERVAL
);


/*
 * Gmail：60 秒
 */

setInterval(
    () => {

        if (accessToken) {
            loadGmail();
        }

    },
    GMAIL_SYNC_INTERVAL
);


/*
 * Weather / AQHI：10 分鐘
 */

setInterval(
    () => {

        loadWeather();

        loadAQHI();

    },
    WEATHER_INTERVAL
);


/* =========================================================
   START
========================================================= */

initGoogleLogin();


/*
 * 天氣不需要登入，
 * 所以一開頁面就先載入。
 */

loadWeather();

loadAQHI();

</script>
