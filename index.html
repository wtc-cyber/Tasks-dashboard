<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black"
    >

    <meta
        name="theme-color"
        content="#121212"
    >

    <title>Task Dashboard</title>

    <!-- Google Identity Services -->
    <script
        src="https://accounts.google.com/gsi/client"
        async
        defer>
    </script>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            background: #121212;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                "Microsoft JhengHei",
                sans-serif;

            color: #ffffff;

            user-select: none;
            -webkit-user-select: none;

            overflow-x: hidden;
        }

        /* =========================
           Main
        ========================= */

        .app {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            flex-direction: column;
        }

        /* =========================
           Header
        ========================= */

        header {
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                max(14px, env(safe-area-inset-top))
                18px
                14px
                18px;

            background: #181818;

            border-bottom: 1px solid #2b2b2b;

            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;

            min-width: 0;
        }

        .title {
            font-size: 1.45rem;
            font-weight: 700;

            white-space: nowrap;
        }

        #clock {
            font-size: 1.35rem;
            font-weight: 600;

            color: #bdbdbd;

            white-space: nowrap;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button {
            border: 0;

            border-radius: 8px;

            padding: 9px 13px;

            background: #2a2a2a;
            color: #ffffff;

            font-size: 0.95rem;

            cursor: pointer;

            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.96);
        }

        button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        #loginBtn {
            background: #ffffff;
            color: #121212;
            font-weight: 600;
        }

        /* =========================
           Status
        ========================= */

        #statusBar {
            flex-shrink: 0;

            min-height: 34px;

            display: flex;
            align-items: center;

            padding: 7px 18px;

            background: #151515;

            color: #888888;

            font-size: 0.82rem;

            border-bottom: 1px solid #242424;
        }

        #statusBar.ok {
            color: #8bc34a;
        }

        #statusBar.error {
            color: #ff6b6b;
        }

        #statusBar.warning {
            color: #ffca28;
        }

        /* =========================
           Task Area
        ========================= */

        main {
            flex: 1;

            width: 100%;

            padding:
                14px
                18px
                max(24px, env(safe-area-inset-bottom))
                18px;

            overflow-y: auto;
        }

        #taskList {
            width: 100%;

            display: flex;
            flex-direction: column;

            gap: 10px;
        }

        /* =========================
           Task Card
        ========================= */

        .task {
            width: 100%;

            min-height: 70px;

            display: flex;
            align-items: center;

            gap: 14px;

            padding: 12px 15px;

            background: #1e1e1e;

            border-radius: 12px;

            border: 1px solid #292929;

            transition:
                opacity 0.25s ease,
                transform 0.25s ease,
                background 0.2s ease;
        }

        .task:hover {
            background: #232323;
        }

        .task.completing {
            opacity: 0;
            transform: translateX(25px);
        }

        /* =========================
           Checkbox
        ========================= */

        .task-checkbox {
            flex-shrink: 0;

            width: 28px;
            height: 28px;

            border: 2px solid #888888;

            border-radius: 7px;

            background: transparent;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            cursor: pointer;
        }

        .task-checkbox.checked {
            background: #ffffff;
            border-color: #ffffff;
        }

        .task-checkbox.checked::after {
            content: "✓";

            color: #121212;

            font-size: 20px;
            font-weight: 800;

            line-height: 1;
        }

        /* =========================
           Task Content
        ========================= */

        .task-content {
            flex: 1;

            min-width: 0;
        }

        .task-title {
            font-size: 1.3rem;

            line-height: 1.35;

            word-break: break-word;
        }

        .task-date {
            margin-top: 4px;

            font-size: 0.9rem;

            color: #8d8d8d;
        }

        .task-date.today {
            color: #ffffff;
            font-weight: 600;
        }

        .task-date.tomorrow {
            color: #bbbbbb;
        }

        .task-date.overdue {
            color: #ff7b7b;
            font-weight: 600;
        }

        /* =========================
           Empty / Loading
        ========================= */

        .message {
            padding: 40px 20px;

            text-align: center;

            color: #777777;

            font-size: 1.1rem;
        }

        /* =========================
           Login Screen
        ========================= */

        #loginScreen {
            position: fixed;

            inset: 0;

            z-index: 100;

            display: none;

            align-items: center;
            justify-content: center;

            background: #121212;

            padding: 20px;
        }

        #loginBox {
            width: min(420px, 100%);

            padding: 30px;

            background: #1e1e1e;

            border-radius: 16px;

            border: 1px solid #303030;

            text-align: center;
        }

        #loginBox h1 {
            margin: 0 0 10px;

            font-size: 1.7rem;
        }

        #loginBox p {
            margin: 0 0 25px;

            color: #999999;

            line-height: 1.6;
        }

        #loginScreenBtn {
            width: 100%;

            min-height: 52px;

            background: #ffffff;
            color: #121212;

            font-size: 1.1rem;

            font-weight: 600;
        }

        /* =========================
           Fullscreen button
        ========================= */

        #fullscreenBtn {
            display: inline-block;
        }

        /* =========================
           Small screens
        ========================= */

        @media (max-width: 600px) {

            header {
                padding-left: 12px;
                padding-right: 12px;
            }

            .title {
                font-size: 1.2rem;
            }

            #clock {
                font-size: 1.15rem;
            }

            .header-right button {
                padding: 8px 9px;
                font-size: 0.85rem;
            }

            main {
                padding-left: 10px;
                padding-right: 10px;
            }

            .task {
                min-height: 74px;

                padding: 12px;

                gap: 12px;
            }

            .task-title {
                font-size: 1.2rem;
            }
        }

    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         Header
    ========================== -->

    <header>

        <div class="header-left">

            <div class="title">
                Task Dashboard
            </div>

            <div id="clock">
                --:--
            </div>

        </div>

        <div class="header-right">

            <button
                id="syncBtn"
                onclick="manualSync()">
                ↻
            </button>

            <button
                id="fullscreenBtn"
                onclick="toggleFullscreen()">
                ⛶
            </button>

            <button
                id="loginBtn"
                onclick="login()">
                登入
            </button>

            <button
                id="logoutBtn"
                onclick="logout()"
                style="display:none;">
                登出
            </button>

        </div>

    </header>


    <!-- =========================
         Status
    ========================== -->

    <div id="statusBar">
        尚未登入
    </div>


    <!-- =========================
         Main
    ========================== -->

    <main>

        <div id="taskList">

            <div class="message">
                請先登入 Google
            </div>

        </div>

    </main>

</div>


<!-- =========================
     Login Screen
========================== -->

<div id="loginScreen">

    <div id="loginBox">

        <h1>
            Task Dashboard
        </h1>

        <p>
            登入 Google 後<br>
            即時顯示你的 Google Tasks
        </p>

        <button
            id="loginScreenBtn"
            onclick="login()">
            使用 Google 登入
        </button>

    </div>

</div>


<script>

/* =========================================================
   Google API 設定
========================================================= */

const CLIENT_ID =
    '710651032876-n8m8m7g3rhne9f2r3m0b78vkoqh18lhl.apps.googleusercontent.com';

const SCOPES =
    'https://www.googleapis.com/auth/tasks';

const TASKS_API =
    'https://tasks.googleapis.com/tasks/v1';

/*
 * 5 秒同步一次
 */
const SYNC_INTERVAL =
    5000;


/* =========================================================
   State
========================================================= */

let tokenClient = null;

let accessToken = '';

let tokenExpiresAt = 0;

let currentTasks = [];

let syncTimer = null;

let isSyncing = false;


/* =========================================================
   DOM
========================================================= */

const taskList =
    document.getElementById('taskList');

const statusBar =
    document.getElementById('statusBar');

const loginBtn =
    document.getElementById('loginBtn');

const logoutBtn =
    document.getElementById('logoutBtn');

const syncBtn =
    document.getElementById('syncBtn');

const loginScreen =
    document.getElementById('loginScreen');


/* =========================================================
   Clock
========================================================= */

function updateClock() {

    const now =
        new Date();

    const hh =
        String(now.getHours()).padStart(2, '0');

    const mm =
        String(now.getMinutes()).padStart(2, '0');

    document.getElementById('clock').textContent =
        `${hh}:${mm}`;
}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =========================================================
   Status
========================================================= */

function setStatus(
    message,
    type = ''
) {

    statusBar.textContent =
        message;

    statusBar.className =
        type;
}


/* =========================================================
   Google GIS 初始化
========================================================= */

function initGoogle() {

    if (
        typeof google === 'undefined' ||
        !google.accounts ||
        !google.accounts.oauth2
    ) {

        setTimeout(
            initGoogle,
            500
        );

        return;
    }

    tokenClient =
        google.accounts.oauth2.initTokenClient({

            client_id:
                CLIENT_ID,

            scope:
                SCOPES,

            callback:
                handleTokenResponse

        });

}

window.addEventListener(
    'load',
    initGoogle
);


/* =========================================================
   Login
========================================================= */

function login() {

    if (!tokenClient) {

        setStatus(
            'Google 登入元件尚未準備好，請稍候。',
            'warning'
        );

        return;
    }

    tokenClient.requestAccessToken({
        prompt: 'consent'
    });
}


/* =========================================================
   OAuth Token Response
========================================================= */

function handleTokenResponse(response) {

    if (response.error) {

        console.error(
            response
        );

        setStatus(
            'Google 登入失敗：' +
            (response.error_description ||
             response.error ||
             '未知錯誤'),
            'error'
        );

        return;
    }

    accessToken =
        response.access_token;

    /*
     * expires_in 通常是秒數
     */
    const expiresIn =
        Number(response.expires_in || 3600);

    tokenExpiresAt =
        Date.now() +
        expiresIn * 1000;

    loginScreen.style.display =
        'none';

    loginBtn.style.display =
        'none';

    logoutBtn.style.display =
        'inline-block';

    setStatus(
        '已登入，正在同步 Google Tasks…',
        'ok'
    );

    startSync();

    syncTasks();

}


/* =========================================================
   Token 是否即將過期
========================================================= */

function tokenIsExpired() {

    if (!accessToken) {
        return true;
    }

    /*
     * 提早 60 秒視為過期
     */
    return Date.now() >
        tokenExpiresAt - 60000;
}


/* =========================================================
   API Fetch
========================================================= */

async function apiFetch(
    url,
    options = {}
) {

    if (tokenIsExpired()) {

        handleTokenExpired();

        throw new Error(
            'TOKEN_EXPIRED'
        );
    }

    const headers = {

        ...(options.headers || {}),

        Authorization:
            'Bearer ' + accessToken

    };

    const response =
        await fetch(
            url,
            {
                ...options,
                headers
            }
        );

    /*
     * Google Token 失效
     */
    if (response.status === 401) {

        handleTokenExpired();

        throw new Error(
            'TOKEN_EXPIRED'
        );
    }

    return response;
}


/* =========================================================
   Token Expired
========================================================= */

function handleTokenExpired() {

    stopSync();

    accessToken = '';

    tokenExpiresAt = 0;

    loginBtn.style.display =
        'inline-block';

    logoutBtn.style.display =
        'none';

    setStatus(
        'Google 登入已過期，請重新登入。',
        'warning'
    );

    loginScreen.style.display =
        'flex';
}


/* =========================================================
   Fetch All Tasks
========================================================= */

async function fetchAllTasks() {

    let allTasks = [];

    let pageToken = '';

    do {

        let url =
            TASKS_API +
            '/lists/@default/tasks' +
            '?showCompleted=false' +
            '&showDeleted=false' +
            '&maxResults=100';

        if (pageToken) {

            url +=
                '&pageToken=' +
                encodeURIComponent(
                    pageToken
                );
        }

        const response =
            await apiFetch(
                url
            );

        if (!response.ok) {

            const text =
                await response.text();

            throw new Error(
                'Google Tasks API ' +
                response.status +
                ': ' +
                text
            );
        }

        const data =
            await response.json();

        if (Array.isArray(data.items)) {

            allTasks.push(
                ...data.items
            );

        }

        pageToken =
            data.nextPageToken ||
            '';

    } while (pageToken);

    return allTasks;
}


/* =========================================================
   Task 比較
========================================================= */

function tasksAreEqual(
    a,
    b
) {

    if (a.length !== b.length) {
        return false;
    }

    for (
        let i = 0;
        i < a.length;
        i++
    ) {

        const x = a[i];
        const y = b[i];

        if (
            x.id !== y.id ||
            x.title !== y.title ||
            x.notes !== y.notes ||
            x.status !== y.status ||
            x.updated !== y.updated ||
            x.due !== y.due ||
            x.position !== y.position
        ) {

            return false;
        }

    }

    return true;
}


/* =========================================================
   Sync
========================================================= */

async function syncTasks() {

    if (!accessToken) {
        return;
    }

    if (isSyncing) {
        return;
    }

    if (tokenIsExpired()) {

        handleTokenExpired();

        return;
    }

    isSyncing = true;

    syncBtn.disabled =
        true;

    try {

        const tasks =
            await fetchAllTasks();

        /*
         * Google Tasks API 回來嘅順序
         * 已經係 Google Tasks 嘅排序
         */

        if (
            !tasksAreEqual(
                currentTasks,
                tasks
            )
        ) {

            currentTasks =
                tasks;

            renderTasks(
                currentTasks
            );

        }

        const now =
            new Date();

        const time =
            now.toLocaleTimeString(
                'zh-HK',
                {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                }
            );

        setStatus(
            `${tasks.length} 個待辦 · 最後同步 ${time}`,
            'ok'
        );

    } catch (error) {

        console.error(
            error
        );

        if (
            error.message !==
            'TOKEN_EXPIRED'
        ) {

            setStatus(
                '同步失敗：' +
                error.message,
                'error'
            );

        }

    } finally {

        isSyncing =
            false;

        syncBtn.disabled =
            false;
    }
}


/* =========================================================
   Render Tasks
========================================================= */

function renderTasks(
    tasks
) {

    taskList.innerHTML =
        '';

    if (!tasks.length) {

        taskList.innerHTML =
            '<div class="message">' +
            '目前沒有未完成 Task' +
            '</div>';

        return;
    }

    tasks.forEach(
        task => {

            const card =
                document.createElement(
                    'div'
                );

            card.className =
                'task';

            card.dataset.id =
                task.id;


            /*
             * Checkbox
             */

            const checkbox =
                document.createElement(
                    'button'
                );

            checkbox.className =
                'task-checkbox';

            checkbox.type =
                'button';

            checkbox.setAttribute(
                'aria-label',
                '完成 Task'
            );

            checkbox.addEventListener(
                'click',
                () => {
                    completeTask(
                        task.id,
                        card
                    );
                }
            );


            /*
             * Content
             */

            const content =
                document.createElement(
                    'div'
                );

            content.className =
                'task-content';


            /*
             * Title
             */

            const title =
                document.createElement(
                    'div'
                );

            title.className =
                'task-title';

            title.textContent =
                task.title ||
                '(沒有標題)';


            /*
             * Date
             */

            const date =
                document.createElement(
                    'div'
                );

            date.className =
                'task-date';

            const dateInfo =
                formatTaskDate(
                    task.due
                );

            if (dateInfo) {

                date.textContent =
                    dateInfo.text;

                date.classList.add(
                    dateInfo.className
                );

            } else {

                date.style.display =
                    'none';

            }


            content.appendChild(
                title
            );

            content.appendChild(
                date
            );


            card.appendChild(
                checkbox
            );

            card.appendChild(
                content
            );

            taskList.appendChild(
                card
            );

        }
    );
}


/* =========================================================
   Format Task Date
========================================================= */

function formatTaskDate(
    due
) {

    if (!due) {
        return null;
    }

    const date =
        new Date(due);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return null;
    }


    /*
     * 只比較年月日
     */

    const now =
        new Date();

    const today =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
        );

    const taskDay =
        new Date(
            date.getFullYear(),
            date.getMonth(),
            date.getDate()
        );


    const difference =
        Math.round(
            (
                taskDay -
                today
            ) /
            86400000
        );


    /*
     * 今日
     */

    if (difference === 0) {

        return {
            text: '今日',
            className: 'today'
        };

    }


    /*
     * 明日
     */

    if (difference === 1) {

        return {
            text: '明日',
            className: 'tomorrow'
        };

    }


    /*
     * 已過期
     */

    if (difference < 0) {

        return {
            text:
                '逾期 · ' +
                date.toLocaleDateString(
                    'zh-HK',
                    {
                        month: 'numeric',
                        day: 'numeric'
                    }
                ),
            className: 'overdue'
        };

    }


    /*
     * 一般日期
     */

    return {

        text:
            date.toLocaleDateString(
                'zh-HK',
                {
                    month: 'numeric',
                    day: 'numeric'
                }
            ),

        className: ''

    };
}


/* =========================================================
   Complete Task
========================================================= */

async function completeTask(
    taskId,
    card
) {

    if (!accessToken) {

        setStatus(
            '請先登入 Google。',
            'warning'
        );

        return;
    }

    if (
        card.classList.contains(
            'completing'
        )
    ) {

        return;
    }


    /*
     * Optimistic UI
     */

    const checkbox =
        card.querySelector(
            '.task-checkbox'
        );

    checkbox.classList.add(
        'checked'
    );

    card.classList.add(
        'completing'
    );


    /*
     * 立即 PATCH Google Tasks
     */

    try {

        await patchCompleteTask(
            taskId
        );

        /*
         * 本地先移除
         * 不需要等下一次 5 秒同步
         */

        currentTasks =
            currentTasks.filter(
                task =>
                    task.id !==
                    taskId
            );

        setTimeout(
            () => {

                renderTasks(
                    currentTasks
                );

            },
            250
        );


        setStatus(
            'Task 已完成 ✓',
            'ok'
        );


    } catch (error) {

        console.error(
            error
        );

        /*
         * API 失敗
         * 還原畫面
         */

        card.classList.remove(
            'completing'
        );

        checkbox.classList.remove(
            'checked'
        );


        if (
            error.message !==
            'TOKEN_EXPIRED'
        ) {

            setStatus(
                '完成 Task 失敗，已還原。',
                'error'
            );

        }

    }
}


/* =========================================================
   PATCH Complete Task
========================================================= */

async function patchCompleteTask(
    taskId
) {

    const url =
        TASKS_API +
        '/lists/@default/tasks/' +
        encodeURIComponent(
            taskId
        );


    const response =
        await apiFetch(
            url,
            {
                method: 'PATCH',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body:
                    JSON.stringify({
                        status:
                            'completed'
                    })
            }
        );


    if (!response.ok) {

        const text =
            await response.text();

        throw new Error(
            'PATCH failed ' +
            response.status +
            ': ' +
            text
        );
    }


    return response.json();
}


/* =========================================================
   Manual Sync
========================================================= */

function manualSync() {

    if (!accessToken) {

        login();

        return;
    }

    syncTasks();
}


/* =========================================================
   Auto Sync
========================================================= */

function startSync() {

    stopSync();

    /*
     * 立即同步一次
     */

    syncTasks();


    /*
     * 每 5 秒同步
     */

    syncTimer =
        setInterval(
            () => {

                if (
                    document.visibilityState ===
                    'visible'
                ) {

                    syncTasks();

                }

            },
            SYNC_INTERVAL
        );
}


function stopSync() {

    if (syncTimer) {

        clearInterval(
            syncTimer
        );

        syncTimer =
            null;
    }
}


/* =========================================================
   Logout
========================================================= */

function logout() {

    stopSync();

    if (
        accessToken &&
        google &&
        google.accounts &&
        google.accounts.oauth2
    ) {

        try {

            google.accounts.oauth2.revoke(
                accessToken,
                () => {}
            );

        } catch (e) {

            console.warn(
                e
            );

        }

    }

    accessToken =
        '';

    tokenExpiresAt =
        0;

    currentTasks =
        [];

    loginBtn.style.display =
        'inline-block';

    logoutBtn.style.display =
        'none';

    taskList.innerHTML =
        '<div class="message">' +
        '請先登入 Google' +
        '</div>';

    setStatus(
        '尚未登入'
    );

}


/* =========================================================
   Visibility
========================================================= */

document.addEventListener(
    'visibilitychange',
    () => {

        if (
            document.visibilityState ===
            'visible'
        ) {

            if (accessToken) {

                syncTasks();

            }

        }

    }
);


/* =========================================================
   Network
========================================================= */

window.addEventListener(
    'online',
    () => {

        if (accessToken) {

            setStatus(
                '網絡已恢復，正在同步…',
                'ok'
            );

            syncTasks();

        }

    }
);


window.addEventListener(
    'offline',
    () => {

        setStatus(
            '網絡中斷，等待恢復…',
            'warning'
        );

    }
);


/* =========================================================
   Fullscreen
========================================================= */

async function toggleFullscreen() {

    try {

        if (!document.fullscreenElement) {

            await document.documentElement.requestFullscreen();

        } else {

            await document.exitFullscreen();

        }

    } catch (error) {

        console.warn(
            'Fullscreen unavailable:',
            error
        );

        setStatus(
            '瀏覽器不支援直接 Full Screen，請使用「加入主畫面」。',
            'warning'
        );

    }
}


/* =========================================================
   Fullscreen Button Text
========================================================= */

document.addEventListener(
    'fullscreenchange',
    () => {

        const button =
            document.getElementById(
                'fullscreenBtn'
            );

        if (
            document.fullscreenElement
        ) {

            button.textContent =
                '⛶';

        } else {

            button.textContent =
                '⛶';

        }

    }
);


/* =========================================================
   Initial State
========================================================= */

setStatus(
    '尚未登入'
);


/*
 * 如果之前沒有登入，
 * 顯示正常 Dashboard，
 * 不強制跳 Login Screen。
 */

</script>
