<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>WTC Work Dashboard</title>

<script src="https://accounts.google.com/gsi/client"></script>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;

  overflow: hidden;

  background: #121212;
  color: #ffffff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    Arial,
    sans-serif;
}

body {
  position: fixed;
  inset: 0;
}

button {
  font-family: inherit;
}


/* =========================================================
   APP
========================================================= */

.app {
  width: 100%;
  height: 100vh;
  height: 100dvh;

  display: flex;
  flex-direction: column;

  overflow: hidden;

  background: #121212;
}


/* =========================================================
   HEADER
========================================================= */

.header {
  flex: 0 0 auto;

  min-height: 78px;

  padding: 8px 14px 7px;

  background: #121212;

  border-bottom: 1px solid #292929;

  overflow: hidden;
}

.header-top {
  height: 34px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;
}

.header-left {
  min-width: 0;

  display: flex;
  align-items: center;

  gap: 14px;
}

.title {
  font-size: 1.25rem;
  font-weight: 700;

  white-space: nowrap;
}

.clock {
  font-size: 1.25rem;
  font-weight: 600;

  color: #bbbbbb;

  font-variant-numeric: tabular-nums;

  white-space: nowrap;
}

.header-buttons {
  display: flex;
  align-items: center;

  gap: 5px;
}

.header-button {
  height: 32px;

  padding: 0 10px;

  border: 0;
  border-radius: 8px;

  background: #292929;
  color: #ffffff;

  font-size: 0.75rem;

  cursor: pointer;

  white-space: nowrap;
}

.header-button:active {
  background: #3a3a3a;
}

.logout-button {
  display: none;
}


/* =========================================================
   WEATHER
========================================================= */

.weather-area {
  margin-top: 5px;

  display: flex;
  align-items: center;

  min-width: 0;

  overflow: hidden;
}

.weather-bar {
  height: 25px;

  display: flex;
  align-items: center;

  gap: 17px;

  min-width: 0;

  overflow: hidden;

  white-space: nowrap;
}

.weather-item {
  display: flex;
  align-items: center;

  gap: 4px;

  color: #999999;

  font-size: 0.77rem;
}

.weather-value {
  color: #ffffff;

  font-weight: 600;
}


/* =========================================================
   WEATHER WARNING
========================================================= */

.warning-bar {
  display: none;

  flex: 1;

  min-width: 0;

  margin-left: 18px;

  height: 25px;

  align-items: center;

  overflow: hidden;

  white-space: nowrap;

  color: #ffca5c;

  font-size: 0.72rem;

  font-weight: 600;
}

.warning-bar.active {
  display: flex;
}

.warning-icon {
  flex: 0 0 auto;

  margin-right: 5px;
}

.warning-text {
  min-width: 0;

  overflow: hidden;

  text-overflow: ellipsis;
}

.warning-normal {
  color: #ffca5c;
}

.warning-high {
  color: #ff8a65;
}

.warning-extreme {
  color: #ff5f6d;
}


/* =========================================================
   DASHBOARD
========================================================= */

.dashboard {
  flex: 1 1 0;

  min-width: 0;
  min-height: 0;

  width: 100%;

  padding: 10px 12px 12px;

  display: grid;

  grid-template-columns:
    45fr
    35fr
    20fr;

  gap: 10px;

  overflow: hidden;
}


/* =========================================================
   PANEL
========================================================= */

.panel {
  min-width: 0;
  min-height: 0;

  height: 100%;

  display: flex;
  flex-direction: column;

  background: #181818;

  border: 1px solid #292929;

  border-radius: 12px;

  overflow: hidden;
}

.panel-header {
  flex: 0 0 42px;

  height: 42px;

  padding: 0 12px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background: #1d1d1d;

  border-bottom: 1px solid #292929;

  gap: 10px;
}

.panel-title {
  font-size: 0.95rem;

  font-weight: 700;

  white-space: nowrap;
}

.panel-meta {
  min-width: 0;

  display: flex;
  align-items: center;

  gap: 8px;

  white-space: nowrap;
}

.panel-count {
  color: #777777;

  font-size: 0.67rem;
}

.panel-updated {
  color: #666666;

  font-size: 0.63rem;

  font-variant-numeric: tabular-nums;
}

.panel-body {
  flex: 1 1 auto;

  min-height: 0;

  overflow: hidden;
}


/* =========================================================
   TASKS
========================================================= */

.task-scroll {
  height: 100%;

  padding: 7px;

  overflow-y: auto;
  overflow-x: hidden;

  scrollbar-width: thin;
}

.task-card {
  width: 100%;

  min-height: 53px;

  margin-bottom: 6px;

  padding: 8px 10px;

  display: flex;
  align-items: center;

  gap: 10px;

  background: #202020;

  border: 1px solid #2b2b2b;

  border-radius: 9px;

  transition:
    opacity 0.2s ease,
    transform 0.2s ease;
}

.task-card:last-child {
  margin-bottom: 0;
}

.task-card.fading {
  opacity: 0;
  transform: translateX(20px);
}

.task-checkbox {
  flex: 0 0 27px;

  width: 27px;
  height: 27px;

  padding: 0;

  border: 2px solid #777777;

  border-radius: 7px;

  background: transparent;

  cursor: pointer;
}

.task-checkbox.done {
  background: #777777;
  border-color: #777777;
}

.task-content {
  min-width: 0;

  flex: 1;
}

.task-title {
  font-size: 0.92rem;

  line-height: 1.3;

  word-break: break-word;
}

.task-date {
  margin-top: 3px;

  font-size: 0.67rem;

  color: #777777;
}

.task-date.overdue {
  color: #ff7373;
}

.task-date.today {
  color: #81c784;
}

.task-date.tomorrow {
  color: #ffca5c;
}

.task-empty,
.schedule-empty,
.mail-empty {
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #666666;

  font-size: 0.82rem;

  text-align: center;
}

.task-error {
  padding: 20px;

  color: #ff7373;

  font-size: 0.78rem;

  line-height: 1.5;
}


/* =========================================================
   SCHEDULE
========================================================= */

.schedule-scroll {
  height: 100%;

  padding: 8px 9px;

  overflow-y: auto;
  overflow-x: hidden;

  scrollbar-width: thin;
}

.schedule-day-label {
  margin: 2px 4px 7px;

  color: #888888;

  font-size: 0.69rem;

  font-weight: 600;
}

.schedule-item {
  position: relative;

  min-height: 49px;

  margin-bottom: 5px;

  display: grid;

  grid-template-columns:
    54px
    10px
    1fr;

  align-items: stretch;

  background: #202020;

  border: 1px solid #292929;

  border-radius: 8px;

  overflow: hidden;
}

.schedule-time {
  padding: 10px 5px;

  display: flex;
  align-items: flex-start;
  justify-content: center;

  color: #999999;

  font-size: 0.72rem;

  font-variant-numeric: tabular-nums;
}

.schedule-line {
  position: relative;

  display: flex;

  justify-content: center;
}

.schedule-line::before {
  content: "";

  width: 2px;

  height: 100%;

  background: #3c3c3c;
}

.schedule-dot {
  position: absolute;

  top: 12px;

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #777777;
}

.schedule-info {
  min-width: 0;

  padding: 8px 9px 8px 4px;
}

.schedule-title {
  font-size: 0.82rem;

  line-height: 1.3;

  word-break: break-word;
}

.schedule-location {
  margin-top: 3px;

  color: #666666;

  font-size: 0.63rem;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.schedule-next {
  margin-top: 4px;

  color: #777777;

  font-size: 0.62rem;
}

.schedule-item.now {
  background: #292929;

  border-color: #666666;

  min-height: 58px;
}

.schedule-item.now .schedule-time {
  color: #ffffff;

  font-weight: 700;

  font-size: 0.76rem;
}

.schedule-item.now .schedule-title {
  font-size: 0.88rem;

  font-weight: 700;
}

.schedule-item.now .schedule-dot {
  background: #ffffff;

  box-shadow:
    0 0 0 3px #444444;
}

.schedule-item.now .schedule-line::before {
  background: #666666;
}

.schedule-item.past {
  opacity: 0.45;
}

.schedule-item.next {
  border-color: #444444;
}

.schedule-all-day {
  color: #aaaaaa;

  font-size: 0.68rem;
}


/* =========================================================
   EMAIL
========================================================= */

.mail-scroll {
  height: 100%;

  padding: 7px;

  overflow-y: auto;
  overflow-x: hidden;

  scrollbar-width: thin;
}

.mail-card {
  width: 100%;

  margin-bottom: 6px;

  padding: 9px 10px;

  background: #202020;

  border: 1px solid #2b2b2b;

  border-radius: 8px;

  cursor: pointer;
}

.mail-card:last-child {
  margin-bottom: 0;
}

.mail-card:active {
  background: #292929;
}

.mail-top {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 7px;
}

.mail-sender {
  min-width: 0;

  flex: 1;

  color: #ffffff;

  font-size: 0.74rem;

  font-weight: 600;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.mail-time {
  flex: 0 0 auto;

  color: #666666;

  font-size: 0.6rem;
}

.mail-subject {
  margin-top: 4px;

  color: #dddddd;

  font-size: 0.76rem;

  font-weight: 600;

  line-height: 1.3;

  word-break: break-word;
}

.mail-snippet {
  margin-top: 4px;

  color: #777777;

  font-size: 0.65rem;

  line-height: 1.3;

  display: -webkit-box;

  -webkit-line-clamp: 2;

  -webkit-box-orient: vertical;

  overflow: hidden;
}


/* =========================================================
   WORK OFF
========================================================= */

.work-off {
  display: none;

  flex: 1 1 auto;

  min-height: 0;

  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 30px;
}

.work-off.active {
  display: flex;
}

.work-off-message {
  color: #dddddd;

  /*
    收工後大字
  */
  font-size: clamp(
    1.8rem,
    4vw,
    3.2rem
  );

  line-height: 1.5;

  font-weight: 500;

  letter-spacing: 0.04em;
}

.continue-button {
  display: none;
}

.continue-button.active {
  display: block;
}


/* =========================================================
   LOGIN
========================================================= */

.login-overlay {
  position: fixed;

  inset: 0;

  z-index: 999;

  display: flex;

  align-items: center;
  justify-content: center;

  background: #121212;
}

.login-box {
  width: min(360px, 85vw);

  padding: 25px;

  text-align: center;

  background: #1c1c1c;

  border: 1px solid #303030;

  border-radius: 14px;
}

.login-title {
  font-size: 1.15rem;

  font-weight: 700;
}

.login-description {
  margin-top: 8px;

  color: #888888;

  font-size: 0.76rem;

  line-height: 1.5;
}

.login-button {
  margin-top: 18px;

  width: 100%;

  height: 42px;

  border: 0;

  border-radius: 9px;

  background: #ffffff;

  color: #111111;

  font-size: 0.85rem;

  font-weight: 700;

  cursor: pointer;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 800px) {

  .title {
    font-size: 1rem;
  }

  .clock {
    font-size: 1rem;
  }

  .header-button {
    padding: 0 7px;

    font-size: 0.67rem;
  }

  .dashboard {
    grid-template-columns:
      44fr
      36fr
      20fr;
  }

  .panel-updated {
    font-size: 0.58rem;
  }

}

</style>
</head>


<body>

</div>


<!-- =======================================================

======================================================= -->

<div class="app">


  <!-- =====================================================

        <div class="weather-item">

          <span

        </div>


        <div class="weather-item">

          <span>AQHI</span>

            id="aqhi"

            --

      </div>


      <!-- WARNING -->

      <div
        id="warningBar"

      >

        <span
          id="warningIcon"

        </span>

        <span
          id="warningText"

          --

  </header>


  <!-- =====================================================

  <div

  >

      今日辛苦了，祝您有個愉快的晚上。
    </div>

  </div>


  <!-- =====================================================
       DASHBOARD
  ====================================================== -->

  <main
    id="dashboard"
    class="dashboard"
  >


    <!-- ===================================================
         TASKS
    ==================================================== -->

    <section class="panel">

      <div class="panel-header">

        <div class="panel-title">
          Tasks
        </div>

        <div class="panel-meta">

          <div
            id="taskCount"
            class="panel-count"
          >
            --
          </div>

          <div
            id="taskUpdated"
            class="panel-updated"
          >
            更新 --
          </div>

        </div>

      </div>


      <div class="panel-body">

        <div
          id="taskScroll"
          class="task-scroll"
        >

          <div class="task-empty">

          </div>

        </div>

      </div>

    </section>


    <!-- ===================================================
         SCHEDULE
    ==================================================== -->

    <section class="panel">

      <div class="panel-header">

        <div class="panel-title">

        <div class="panel-meta">

            id="scheduleDate"
            class="panel-count"

            --
          </div>

            id="scheduleUpdated"

            更新 --
          </div>

        </div>

      </div>


      <div class="panel-body">

        <div
          id="scheduleScroll"
          class="schedule-scroll"
        >

          <div class="schedule-empty">
            尚未登入
          </div>

        </div>

      </div>

    </section>


    <!-- ===================================================
         EMAIL
    ==================================================== -->

    <section class="panel">

      <div class="panel-header">

        <div class="panel-title">
          Email
        </div>

        <div class="panel-meta">

          <div
            id="mailCount"
            class="panel-count"
          >
            未讀
          </div>

          <div
            id="mailUpdated"
            class="panel-updated"
          >
            更新 --
          </div>

        </div>

      </div>


      <div class="panel-body">

        <div
          id="mailScroll"
          class="mail-scroll"
        >

          <div class="mail-empty">
            尚未登入
          </div>

        </div>

      </div>

    </section>


  </main>

</div>

/* =========================================================

const CLIENT_ID =

const loginButton =

const logoutButton =

/* =========================================================
   CLOCK
========================================================= */

function formatTime(date) {

  return (
    String(
      date.getHours()
    ).padStart(2, "0")
    +
    ":"
    +
    String(
      date.getMinutes()
    ).padStart(2, "0")
  );

}


function updateClock() {

  clock.textContent =
    formatTime(
      new Date()
    );

}


updateClock();

setInterval(
  updateClock,
  1000
);


/* =========================================================
   PANEL UPDATE TIME
========================================================= */

function setPanelUpdated(
  element
) {

  element.textContent =
    `更新 ${formatTime(new Date())}`;

}


/* =========================================================
   DATE HELPERS
========================================================= */

function startOfToday() {

  const d =
    new Date();

  d.setHours(
    0,
    0,
    0,
    0
  );

  return d;

}


function startOfTomorrow() {

  const d =
    startOfToday();

  d.setDate(
    d.getDate() + 1
  );

  return d;

}


function formatDateMD(
  date
) {

  return (
    `${date.getMonth() + 1}/` +
    `${date.getDate()}`
  );

}


function formatScheduleDate(
  date
) {

  const weekdays = [
    "日",
    "一",
    "二",
    "三",
    "四",
    "五",
    "六"
  ];


  return (
    `${date.getMonth() + 1}/` +
    `${date.getDate()}（` +
    `${weekdays[date.getDay()]}` +
    "）"
  );

}

/* =========================================================
   GOOGLE API
========================================================= */

async function googleFetch(
  url,
  options = {}
) {

  if (!accessToken) {

    throw new Error(
      "尚未登入 Google"
    );

  }


  const response =
    await fetch(
      url,
      {
        ...options,

        headers: {
          ...(options.headers || {}),

          Authorization:
            `Bearer ${accessToken}`,

          "Content-Type":
            "application/json"
        }

      }
    );


  if (
    response.status === 401
  ) {

    accessToken =
      null;

    loginOverlay.style.display =
      "flex";

    throw new Error(
      "Google 授權已過期"
    );

  }


  if (!response.ok) {

    const text =
      await response.text();


    throw new Error(
      `${response.status}: ${text}`
    );

  }


  return response.json();

}

========================================================= */

async function getDefaultTaskList() {

  if (taskListId) {

    return taskListId;

  }


  const data =
    await googleFetch(
      `${TASKS_API}/users/@me/lists?maxResults=100`
    );


  const lists =
    data.items || [];


  const defaultList =
    lists.find(
      item =>
        item.id === "@default"
    );


  if (defaultList) {

    taskListId =
      defaultList.id;

  } else if (
    lists.length
  ) {

    taskListId =
      lists[0].id;

  } else {

    throw new Error(
      "找不到 Google Tasks 清單"
    );

  }


  return taskListId;

}


function taskDateInfo(
  due
) {

  if (!due) {
    return null;
  }


  const date =
    new Date(due);


  const today =
    startOfToday();


  const tomorrow =
    startOfTomorrow();


  const dateOnly =
    new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()
    );


  if (
    dateOnly < today
  ) {

    return {
      text: "逾期",
      className: "overdue"
    };

  }


  if (
    dateOnly.getTime() ===
    today.getTime()
  ) {

    return {
      text: "今日",
      className: "today"
    };

  }


  if (
    dateOnly.getTime() ===
    tomorrow.getTime()
  ) {

    return {
      text: "明日",
      className: "tomorrow"
    };

  }


  return {
    text:
      formatDateMD(date),

    className:
      ""
  };

}


function sortTasks(
  tasks
) {

  return [
    ...tasks
  ].sort(
    (a, b) => {

      if (
        !a.due &&
        !b.due
      ) {

        return 0;

      }


      if (!a.due) {
        return 1;
      }


      if (!b.due) {
        return -1;
      }


      return (
        new Date(a.due) -
        new Date(b.due)
      );

    }
  );

}


function renderTasks(
  tasks
) {

  taskScroll.innerHTML =
    "";


  taskCount.textContent =
    `${tasks.length} 項`;


  if (
    !tasks.length
  ) {

    taskScroll.innerHTML =
      `<div class="task-empty">
         🎉 沒有未完成 Tasks
       </div>`;

    return;

  }


  sortTasks(tasks)
    .forEach(
      task => {

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "task-card";


        const checkbox =
          document.createElement(
            "button"
          );

        checkbox.type =
          "button";

        checkbox.className =
          "task-checkbox";


        checkbox.addEventListener(
          "click",
          async () => {

            checkbox.className =
              "task-checkbox done";

            card.className =
              "task-card fading";


            try {

              await googleFetch(
                `${TASKS_API}/lists/${encodeURIComponent(taskListId)}/tasks/${encodeURIComponent(task.id)}`,
                {
                  method:
                    "PATCH",

                  body:
                    JSON.stringify({
                      status:
                        "completed"
                    })

                }
              );

            } catch (
              error
            ) {

              console.error(
                error
              );

              await syncTasks();

              return;

            }


            setTimeout(
              () => {

                if (
                  card.parentNode
                ) {

                  card.parentNode
                    .removeChild(
                      card
                    );

                }

              },
              250
            );

          }
        );


        const content =
          document.createElement(
            "div"
          );

        content.className =
          "task-content";


        const title =
          document.createElement(
            "div"
          );

        title.className =
          "task-title";

        title.textContent =
          task.title ||
          "(無標題)";


        const info =
          taskDateInfo(
            task.due
          );


        content.appendChild(
          title
        );


        if (info) {

          const date =
            document.createElement(
              "div"
            );

          date.className =
            info.className
              ? `task-date ${info.className}`
              : "task-date";

          date.textContent =
            info.text;

          content.appendChild(
            date
          );

        }


        card.appendChild(
          checkbox
        );

        card.appendChild(
          content
        );


        taskScroll.appendChild(
          card
        );

      }
    );

}


async function syncTasks() {

  try {

    const listId =
      await getDefaultTaskList();


    const data =
      await googleFetch(
        `${TASKS_API}/lists/${encodeURIComponent(listId)}/tasks?showCompleted=false&showDeleted=false&maxResults=100`

/* =========================================================
   CALENDAR HELPERS
========================================================= */

function eventStart(
  event
) {

  if (
    event.start &&
    event.start.dateTime
  ) {

    return new Date(
      event.start.dateTime
    );

  }


  if (
    event.start &&
    event.start.date
  ) {

    const p =
      event.start.date.split("-");


    return new Date(
      Number(p[0]),
      Number(p[1]) - 1,
      Number(p[2])
    );

  }


  return null;

}


function eventEnd(
  event
) {

  if (
    event.end &&
    event.end.dateTime
  ) {

    return new Date(
      event.end.dateTime
    );

  }


  if (
    event.end &&
    event.end.date
  ) {

    const p =
      event.end.date.split("-");


    return new Date(
      Number(p[0]),
      Number(p[1]) - 1,
      Number(p[2])
    );

  }


  return null;

}


function isAllDayEvent(
  event
) {

  return Boolean(
    event.start &&
    event.start.date
  );

}


function isEventNow(
  event
) {

  if (
    isAllDayEvent(event)
  ) {

    return false;

  }


  const start =
    eventStart(event);

  const end =
    eventEnd(event);


  if (!start || !end) {
    return false;
  }


  const now =
    new Date();


  return (
    now >= start &&
    now < end
  );

}


function isEventPast(
  event
) {

  if (
    isAllDayEvent(event)
  ) {

    return false;

  }


  const end =
    eventEnd(event);


  if (!end) {
    return false;
  }


  return (
    new Date() >= end
  );

}


function minutesUntil(
  date
) {

  return Math.round(
    (
      date.getTime() -
      Date.now()
    ) / 60000
  );

}


function countdownText(
  minutes
) {

  if (
    minutes <= 0
  ) {

    return "";

  }


  if (
    minutes < 60
  ) {

    return `${minutes} 分鐘後`;

  }


  const hours =
    Math.floor(
      minutes / 60
    );


  const mins =
    minutes % 60;


  if (!mins) {

    return `${hours} 小時後`;

  }


  return (
    `${hours} 小時 ${mins} 分鐘後`
  );

}


/* =========================================================
   RENDER SCHEDULE
========================================================= */

function renderSchedule(
  events
) {

  scheduleScroll.innerHTML =
    "";


  const today =
    startOfToday();


  const tomorrow =
    startOfTomorrow();


  const dayAfterTomorrow =
    new Date(
      tomorrow
    );


  dayAfterTomorrow.setDate(
    dayAfterTomorrow.getDate() + 1
  );


  scheduleDate.textContent =
    formatScheduleDate(
      today
    );


  const todayEvents =
    events.filter(
      event => {

        const start =
          eventStart(event);


        if (!start) {
          return false;
        }


        return (
          start >= today &&
          start < tomorrow
        );

      }
    );


  const tomorrowEvents =
    events.filter(
      event => {

        const start =
          eventStart(event);


        if (!start) {
          return false;
        }


        return (
          start >= tomorrow &&
          start < dayAfterTomorrow
        );

      }
    );


  if (
    todayEvents.length === 0
  ) {

    scheduleScroll.innerHTML =
      `<div class="schedule-empty">
         今日沒有 Calendar 行程
       </div>`;

  } else {

    const label =
      document.createElement(
        "div"
      );

    label.className =
      "schedule-day-label";

    label.textContent =
      `今日 · ${formatScheduleDate(today)}`;


    scheduleScroll.appendChild(
      label
    );


    todayEvents.forEach(
      (event, index) => {

        scheduleScroll.appendChild(
          createScheduleItem(
            event,
            todayEvents,
            index
          )
        );

      }
    );

  }


  if (
    tomorrowEvents.length
  ) {

    const label =
      document.createElement(
        "div"
      );

    label.className =
      "schedule-day-label";

    label.style.marginTop =
      "14px";

    label.textContent =
      `明日 · ${formatScheduleDate(tomorrow)}`;


    scheduleScroll.appendChild(
      label
    );


    tomorrowEvents.forEach(
      event => {

        scheduleScroll.appendChild(
          createScheduleItem(
            event,
            [],
            -1
          )
        );

      }
    );

  }

}


/* =========================================================
   CREATE SCHEDULE ITEM
========================================================= */

function createScheduleItem(
  event,
  todayEvents,
  index
) {

  const item =
    document.createElement(
      "div"
    );


  let className =
    "schedule-item";


  const now =
    isEventNow(event);


  const past =
    isEventPast(event);


  let isNext =
    false;


  if (
    todayEvents.length
  ) {

    const nextIndex =
      todayEvents.findIndex(
        e => {

          const start =
            eventStart(e);


          return (
            start &&
            start > new Date()
          );

        }
      );


    isNext =
      index === nextIndex;

  }


  if (now) {

    className +=
      " now";

  } else if (past) {

    className +=
      " past";

  } else if (isNext) {

    className +=
      " next";

  }


  item.className =
    className;


  const time =
    document.createElement(
      "div"
    );

  time.className =
    "schedule-time";


  if (
    isAllDayEvent(event)
  ) {

    time.innerHTML =
      `<span class="schedule-all-day">
         全天
       </span>`;

  } else {

    time.textContent =
      formatTime(
        eventStart(event)
      );

  }


  const line =
    document.createElement(
      "div"
    );

  line.className =
    "schedule-line";


  const dot =
    document.createElement(
      "div"
    );

  dot.className =
    "schedule-dot";


  line.appendChild(
    dot
  );


  const info =
    document.createElement(
      "div"
    );

  info.className =
    "schedule-info";


  const title =
    document.createElement(
      "div"
    );

  title.className =
    "schedule-title";

  title.textContent =
    event.summary ||
    "(無標題)";


  info.appendChild(
    title
  );


  if (
    event.location
  ) {

    const location =
      document.createElement(
        "div"
      );

    location.className =
      "schedule-location";

    location.textContent =
      event.location;


    info.appendChild(
      location
    );

  }


  if (now) {

    const nowText =
      document.createElement(
        "div"
      );

    nowText.className =
      "schedule-next";

    nowText.textContent =
      "● NOW";


    info.appendChild(
      nowText
    );

  }


  if (
    isNext &&
    !now &&
    !isAllDayEvent(event)
  ) {

    const minutes =
      minutesUntil(
        eventStart(event)
      );


    const countdown =
      countdownText(
        minutes
      );


    if (countdown) {

      const nextText =
        document.createElement(
          "div"
        );

      nextText.className =
        "schedule-next";

      nextText.textContent =
        `→ ${countdown}`;


      info.appendChild(
        nextText
      );

    }

  }


  item.appendChild(
    time
  );

  item.appendChild(
    line
  );

  item.appendChild(
    info
  );


  return item;

}

async function getMailDetail(
  id
) {

  const url =
    `${GMAIL_API}/users/me/messages/` +
    `${encodeURIComponent(id)}` +
    `?format=metadata` +
    `&metadataHeaders=From` +
    `&metadataHeaders=Subject`;


  const data =
    await googleFetch(
      url
    );


  const headers =
    data.payload &&
    data.payload.headers
      ? data.payload.headers
      : [];


  const from =
    headers.find(
      h =>
        h.name.toLowerCase() ===
        "from"
    );


  const subject =
    headers.find(
      h =>
        h.name.toLowerCase() ===
        "subject"
    );


  return {

    id,

    threadId:
      data.threadId,

    from:
      from
        ? from.value
        : "",

    subject:
      subject
        ? subject.value
        : "(無主旨)",

    snippet:
      data.snippet || "",

    internalDate:
      data.internalDate
        ? Number(
            data.internalDate
          )
        : 0

  };

}


function cleanSender(
  sender
) {

  if (!sender) {
    return "";
  }


  const match =
    sender.match(
      /^(.+?)\s*<.*>$/
    );


  if (match) {

    return match[1]
      .replace(
        /^"|"$/g,
        ""
      )
      .trim();

  }


  return sender;

}


function formatMailTime(
  timestamp
) {

  if (!timestamp) {
    return "";
  }


  const date =
    new Date(
      timestamp
    );


  const now =
    new Date();


  if (
    date.toDateString() ===
    now.toDateString()
  ) {

    return formatTime(
      date
    );

  }


  return (
    `${date.getMonth() + 1}/` +
    `${date.getDate()}`
  );

}


function renderMail(
  messages
) {

  mailScroll.innerHTML =
    "";


  messages.forEach(
    message => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "mail-card";

          );

      );

        );

      sender.className =

        );

        );

        );

      );

      );


      const subject =

        );

        );

      card.appendChild(

      );

      card.appendChild(

      );

      card.appendChild(

      );


      mailScroll.appendChild(

      );

    }
  );

}

    renderCurrentWeather(
      current
    );


    renderRainProbability(
      forecast
    );


    renderWarnings(
      warnings
    );


  } catch (
    error
  ) {

    console.error(
      "Weather error:",
      error
    );

  }

}


function renderCurrentWeather(
  data
) {

  try {

    const temperatureData =
      data.temperature &&
      data.temperature.data
        ? data.temperature.data
        : [];


    const hkoTemp =
      temperatureData.find(
        item =>
          item.place ===
          "香港天文台"
      ) ||
      temperatureData[0];


    if (hkoTemp) {

      document.getElementById(
        "weatherTemp"
      ).textContent =
        `${hkoTemp.value}°C`;

    }


    const humidityData =
      data.humidity &&
      data.humidity.data
        ? data.humidity.data
        : [];


    if (
      humidityData[0]
    ) {

      document.getElementById(
        "humidity"
      ).textContent =
        `${humidityData[0].value}%`;

    }


    const icon =
      data.icon &&
      data.icon.length
        ? data.icon[0]
        : null;


    document.getElementById(
      "weatherIcon"
    ).textContent =
      weatherIcon(
        icon
      );


    document.getElementById(
      "weatherText"
    ).textContent =
      getWeatherText(
        data
      );

  } catch (
    error
  ) {

    console.error(
      "Weather parse error:",
      error
    );

  }

}


function getWeatherText(
  data
) {

  if (
    data.weatherDesc &&
    data.weatherDesc.length
  ) {

    return data.weatherDesc[0];

  }


  return "天氣";

}


function weatherIcon(
  icon
) {

  const n =
    Number(icon);


  if (
    Number.isNaN(n)
  ) {

    return "☁";

  }


  if (
    n === 50
  ) {

    return "☀";

  }


  if (
    n >= 60 &&
    n <= 69
  ) {

    return "🌧";

  }


  if (
    n >= 70 &&
    n <= 79
  ) {

    return "🌦";

  }


  if (
    n >= 80 &&
    n <= 89
  ) {

    return "⛈";

  }


  return "☁";

}


/* =========================================================
   RAIN
========================================================= */

function renderRainProbability(
  data
) {

  const forecast =
    data &&
    data.weatherForecast
      ? data.weatherForecast
      : [];


  if (
    !forecast.length
  ) {

    document.getElementById(
      "rainProbability"
    ).textContent =
      "--";

    return;

  }


  const first =
    forecast[0];


  const value =
    first.PSR ||
    first.psr ||
    first.rainProbability ||
    first.rainProb ||
    null;


  document.getElementById(
    "rainProbability"
  ).textContent =
    value !== null
      ? String(value)
      : "--";

}


/* =========================================================
   WEATHER WARNINGS
========================================================= */

function renderWarnings(
  data
) {

  const warnings = [];


  if (
    data &&
    typeof data === "object"
  ) {

    Object.keys(data)
      .forEach(
        key => {

          const item =
            data[key];


          if (
            !item ||
            typeof item !==
            "object"
          ) {

            return;

          }


          const action =
            String(
              item.actionCode || ""
            ).toUpperCase();


          const code =
            String(
              item.code || key
            ).toUpperCase();


          if (
            action === "CANCEL" ||
            code === "CANCEL"
          ) {

            return;

          }


          if (
            item.name
          ) {

            warnings.push(
              item
            );

          }

        }
      );

  }


  const unique = [];

  const seen =
    new Set();


  warnings.forEach(
    item => {

      const key =
        item.code ||
        item.name;


      if (
        !seen.has(key)
      ) {

        seen.add(key);

        unique.push(
          item
        );

      }

    }
  );


  if (
    !unique.length
  ) {

    warningBar.className =
      "warning-bar";

    warningText.textContent =
      "";

    return;

  }


  unique.sort(
    (a, b) =>
      warningPriority(b) -
      warningPriority(a)
  );


  warningText.textContent =
    unique
      .map(
        item =>
          item.name
      )
      .join("　");


  warningBar.className =
    "warning-bar active";


  const highest =
    Math.max(
      ...unique.map(
        item =>
          warningPriority(item)
      )
    );


  if (
    highest >= 90
  ) {

    warningBar.className =
      "warning-bar active warning-extreme";

    warningIcon.textContent =
      "🚨";

  } else if (
    highest >= 60
  ) {

    warningBar.className =
      "warning-bar active warning-high";

    warningIcon.textContent =
      "⚠️";

  } else {

    warningBar.className =
      "warning-bar active warning-normal";

    warningIcon.textContent =
      "⚠️";

  }

}


function warningPriority(
  item
) {

  const code =
    String(
      item.code || ""
    ).toUpperCase();


  if (
    code === "TC10"
  ) {

    return 100;

  }


  if (
    code === "TC9"
  ) {

    return 95;

  }


  if (
    code.includes("TC8")
  ) {

    return 90;

  }


  if (
    code === "WRAINB"
  ) {

    return 88;

  }


  if (
    code === "WRAINR"
  ) {

    return 80;

  }


  if (
    code === "TWS" ||
    code === "WTS"
  ) {

    return 65;

  }


  if (
    code === "WMSGNL"
  ) {

    return 55;

  }


  if (
    code === "WHOT" ||
    code === "WCOLD"
  ) {

    return 45;

  }


  return 40;

}


/* =========================================================
   AQHI
========================================================= */

async function loadAQHI() {

  try {

    const response =
      await fetch(
        AQHI_API
      );


    const data =
      await response.json();


    const value =
      findAQHIValue(
        data
      );


    const element =
      document.getElementById(
        "aqhi"
      );


    if (
      value !== null
    ) {

      element.textContent =
        String(value);

    } else {

      element.textContent =
        "--";

    }

  } catch (
    error
  ) {

    console.error(
      "AQHI error:",
      error
    );

  }

}


function findAQHIValue(
  data
) {

  let list = [];


  if (
    Array.isArray(data)
  ) {

    list =
      data;

  } else if (
    data &&
    Array.isArray(data.data)
  ) {

    list =
      data.data;

  } else if (
    data &&
    Array.isArray(data.records)
  ) {

    list =
      data.records;

  } else if (
    data &&
    Array.isArray(data.results)
  ) {

    list =
      data.results;

  }


  const north =
    list.find(
      item => {

        const text =
          JSON.stringify(
            item
          ).toLowerCase();


        return (
          text.includes("北區") ||
          text.includes("north")
        );

      }
    );


  const target =
    north ||
    list[0];


  if (!target) {
    return null;
  }


  const keys = [
    "aqhi",
    "AQHI",
    "value",
    "index"
  ];


  for (
    const key of keys
  ) {

    if (
      target[key] !==
      undefined &&
      target[key] !==
      null
    ) {

      return target[key];

    }

  }


  return null;

}

========================================================= */

  syncButton.textContent =

  ]);


  syncButton.textContent =
    "↻ 同步";

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  value
) {

  return String(
    value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
