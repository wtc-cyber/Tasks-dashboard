<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#121212">

<title>Task Dashboard</title>

<script
    src="https://accounts.google.com/gsi/client"
    async
    defer>
</script>

<style>

/* ================================
   BASIC
================================ */

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #121212;
}

body {
    color: #ffffff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
}


/* ================================
   APP
================================ */

#app {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
}


/* ================================
   HEADER
================================ */

#header {
    position: sticky;
    top: 0;
    z-index: 10;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding:
        12px
        16px;

    background: #181818;
    border-bottom: 1px solid #2c2c2c;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 16px;
}

#title {
    font-size: 1.45rem;
    font-weight: 700;
}

#clock {
    color: #aaaaaa;
    font-size: 1.25rem;
    font-weight: 600;
}

.header-right {
    display: flex;
    gap: 6px;
}

.header-button {
    border: 0;
    border-radius: 8px;

    background: #292929;
    color: white;

    padding: 9px 12px;

    font-size: 0.95rem;

    cursor: pointer;
}

.header-button:active {
    transform: scale(0.95);
}

#loginButton {
    background: white;
    color: #121212;
    font-weight: 600;
}


/* ================================
   STATUS
================================ */

#status {
    min-height: 32px;

    display: flex;
    align-items: center;

    padding: 6px 16px;

    background: #151515;

    border-bottom: 1px solid #242424;

    color: #777777;

    font-size: 0.82rem;
}


/* ================================
   MAIN
================================ */

#main {
    flex: 1;

    width: 100%;

    padding:
        14px
        16px
        30px;

    overflow-y: auto;
}

#tasks {
    width: 100%;

    display: flex;
    flex-direction: column;

    gap: 10px;
}


/* ================================
   TASK
================================ */

.task {
    min-height: 76px;

    display: flex;
    align-items: center;

    gap: 14px;

    padding: 12px 15px;

    background: #1e1e1e;

    border: 1px solid #2a2a2a;

    border-radius: 12px;

    transition:
        opacity 0.25s ease,
        transform 0.25s ease;
}

.task.fading {
    opacity: 0;
    transform: translateX(25px);
}


/* ================================
   CHECKBOX
================================ */

.task-checkbox {
    flex-shrink: 0;

    width: 30px;
    height: 30px;

    border: 2px solid #888888;
    border-radius: 7px;

    background: transparent;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;

    cursor: pointer;
}

.task-checkbox.done {
    background: white;
    border-color: white;
}

.task-checkbox.done::after {
    content: "✓";

    color: #121212;

    font-size: 21px;
    font-weight: bold;
}


/* ================================
   TASK CONTENT
================================ */

.task-content {
    flex: 1;
    min-width: 0;
}

.task-title {
    font-size: 1.3rem;
    line-height: 1.35;

    word-break: break-word;
}

.task-date {
    margin-top: 4px;

    font-size: 0.88rem;

    color: #888888;
}

.task-date.today {
    color: white;
    font-weight: 600;
}

.task-date.tomorrow {
    color: #bbbbbb;
}

.task-date.overdue {
    color: #ff7777;
    font-weight: 600;
}


/* ================================
   EMPTY
================================ */

.empty {
    padding: 50px 20px;

    text-align: center;

    color: #777777;

    font-size: 1.1rem;
}


/* ================================
   LOGIN
================================ */

#loginOverlay {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: #121212;
}

.login-box {
    width: min(420px, 100%);

    padding: 30px;

    border-radius: 16px;

    background: #1e1e1e;

    border: 1px solid #303030;

    text-align: center;
}

.login-box h1 {
    margin:
        0
        0
        10px;

    font-size: 1.7rem;
}

.login-box p {
    margin:
        0
        0
        25px;

    color: #999999;

    line-height: 1.6;
}

#overlayLoginButton {
    width: 100%;

    min-height: 52px;

    border: 0;
    border-radius: 9px;

    background: white;
    color: #121212;

    font-size: 1.05rem;
    font-weight: 600;
}


/* ================================
   MOBILE
================================ */

@media (max-width: 600px) {

    #header {
        padding:
            10px;
    }

    .header-left {
        gap: 8px;
    }

    #title {
        font-size: 1.15rem;
    }

    #clock {
        font-size: 1.05rem;
    }

    .header-right {
        gap: 3px;
    }

    .header-button {
        padding:
            8px
            9px;

        font-size: 0.8rem;
    }

    #main {
        padding:
            10px
            9px
            25px;
    }

    .task {
        min-height: 76px;
        padding: 12px;
        gap: 12px;
    }

    .task-title {
        font-size: 1.2rem;
    }

    .task-checkbox {
        width: 29px;
        height: 29px;
    }
}

</style>
</head>


<body>

<div id="app">


    <!-- ============================
         HEADER
    ============================= -->

    <header id="header">

        <div class="header-left">

            <div id="title">
                Task Dashboard
            </div>

            <div id="clock">
                --:--
            </div>

        </div>


        <div class="header-right">

            <button
                id="syncButton"
                class="header-button"
                type="button">
                ↻
            </button>

            <button
                id="fullscreenButton"
                class="header-button"
                type="button">
                ⛶
            </button>

            <button
                id="loginButton"
                class="header-button"
                type="button">
                登入
            </button>

            <button
                id="logoutButton"
                class="header-button"
                type="button"
                style="display:none;">
                登出
            </button>

        </div>

    </header>


    <!-- ============================
         STATUS
    ============================= -->

    <div id="status">
        尚未登入
    </div>


    <!-- ============================
         TASKS
    ============================= -->

    <main id="main">

        <div id="tasks">

            <div class="empty">
                請先登入 Google
            </div>

        </div>

    </main>

</div>


<!-- ================================
     LOGIN OVERLAY
================================= -->

<div id="loginOverlay">

    <div class="login-box">

        <h1>
            Task Dashboard
        </h1>

        <p>
            登入 Google 後<br>
            顯示你的 Google Tasks
        </p>

        <button
            id="overlayLoginButton"
            type="button">
            使用 Google 登入
        </button>

    </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const CLIENT_ID =
    "710651032876-n8m8m7g3rhne9f2r3m0b78vkoqh18lhl.apps.googleusercontent.com";

const GOOGLE_SCOPE =
    "https://www.googleapis.com/auth/tasks";

const API_BASE =
    "https://tasks.googleapis.com/tasks/v1";

const SYNC_INTERVAL =
    5000;


/* =========================================================
   STATE
========================================================= */

let googleTokenClient = null;

let accessToken = "";

let tokenExpiry = 0;

let tasksData = [];

let syncTimer = null;

let syncing = false;


/* =========================================================
   ELEMENTS
========================================================= */

const tasksElement =
    document.getElementById("tasks");

const statusElement =
    document.getElementById("status");

const loginButton =
    document.getElementById("loginButton");

const logoutButton =
    document.getElementById("logoutButton");

const syncButton =
    document.getElementById("syncButton");

const fullscreenButton =
    document.getElementById("fullscreenButton");

const loginOverlay =
    document.getElementById("loginOverlay");

const overlayLoginButton =
    document.getElementById(
        "overlayLoginButton"
    );

const clockElement =
    document.getElementById("clock");


/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    const now = new Date();

    const hour =
        String(
            now.getHours()
        ).padStart(2, "0");

    const minute =
        String(
            now.getMinutes()
        ).padStart(2, "0");

    clockElement.textContent =
        hour + ":" + minute;
}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =========================================================
   STATUS
========================================================= */

function setStatus(message) {

    statusElement.textContent =
        message;
}


/* =========================================================
   GOOGLE INITIALIZATION
========================================================= */

function initializeGoogle() {

    if (
        typeof google === "undefined" ||
        !google.accounts ||
        !google.accounts.oauth2
    ) {

        setTimeout(
            initializeGoogle,
            500
        );

        return;
    }


    googleTokenClient =
        google.accounts.oauth2.initTokenClient({

            client_id:
                CLIENT_ID,

            scope:
                GOOGLE_SCOPE,

            callback:
                handleGoogleToken

        });
}


window.addEventListener(
    "load",
    initializeGoogle
);


/* =========================================================
   LOGIN
========================================================= */

function login() {

    if (!googleTokenClient) {

        setStatus(
            "Google 登入元件尚未準備好，請稍候。"
        );

        return;
    }


    googleTokenClient.requestAccessToken({

        prompt:
            "consent"

    });
}


loginButton.addEventListener(
    "click",
    login
);


overlayLoginButton.addEventListener(
    "click",
    login
);


/* =========================================================
   GOOGLE TOKEN
========================================================= */

function handleGoogleToken(response) {

    if (
        !response ||
        response.error
    ) {

        console.error(
            "Google OAuth Error:",
            response
        );

        setStatus(
            "Google 登入失敗：" +
            (
                response.error_description ||
                response.error ||
                "未知錯誤"
            )
        );

        return;
    }


    accessToken =
        response.access_token;


    const seconds =
        Number(
            response.expires_in || 3600
        );


    tokenExpiry =
        Date.now() +
        seconds * 1000;


    loginOverlay.style.display =
        "none";


    loginButton.style.display =
        "none";


    logoutButton.style.display =
        "block";


    setStatus(
        "已登入，正在同步…"
    );


    startAutoSync();
}


/* =========================================================
   TOKEN CHECK
========================================================= */

function tokenExpired() {

    if (!accessToken) {
        return true;
    }


    /*
     * 提早 60 秒視為即將過期
     */

    return (
        Date.now() >
        tokenExpiry - 60000
    );
}


function requireLoginAgain() {

    stopAutoSync();


    accessToken = "";

    tokenExpiry = 0;


    loginButton.style.display =
        "block";


    logoutButton.style.display =
        "none";


    loginOverlay.style.display =
        "flex";


    setStatus(
        "Google 登入已過期，請重新登入。"
    );
}


/* =========================================================
   API FETCH
========================================================= */

async function googleFetch(
    url,
    options = {}
) {

    if (tokenExpired()) {

        requireLoginAgain();

        throw new Error(
            "TOKEN_EXPIRED"
        );
    }


    const headers = {};

    if (options.headers) {

        Object.assign(
            headers,
            options.headers
        );
    }


    headers.Authorization =
        "Bearer " +
        accessToken;


    const response =
        await fetch(
            url,
            {
                ...options,
                headers:
                    headers
            }
        );


    if (
        response.status === 401
    ) {

        requireLoginAgain();

        throw new Error(
            "TOKEN_EXPIRED"
        );
    }


    return response;
}


/* =========================================================
   GET TASKS
========================================================= */

async function getTasks() {

    const allTasks = [];

    let pageToken = "";


    do {

        let url =
            API_BASE +
            "/lists/@default/tasks" +
            "?showCompleted=false" +
            "&showDeleted=false" +
            "&maxResults=100";


        if (pageToken) {

            url +=
                "&pageToken=" +
                encodeURIComponent(
                    pageToken
                );
        }


        const response =
            await googleFetch(
                url
            );


        if (!response.ok) {

            const errorText =
                await response.text();


            throw new Error(
                "Google Tasks API " +
                response.status +
                " " +
                errorText
            );
        }


        const data =
            await response.json();


        if (
            Array.isArray(
                data.items
            )
        ) {

            data.items.forEach(
                task => {

                    allTasks.push(
                        task
                    );

                }
            );
        }


        pageToken =
            data.nextPageToken || "";


    } while (
        pageToken
    );


    return allTasks;
}


/* =========================================================
   TASK COMPARISON
========================================================= */

function sameTasks(
    oldTasks,
    newTasks
) {

    if (
        oldTasks.length !==
        newTasks.length
    ) {

        return false;
    }


    for (
        let i = 0;
        i < oldTasks.length;
        i++
    ) {

        const oldTask =
            oldTasks[i];

        const newTask =
            newTasks[i];


        if (
            oldTask.id !==
            newTask.id
        ) {
            return false;
        }


        if (
            oldTask.title !==
            newTask.title
        ) {
            return false;
        }


        if (
            oldTask.notes !==
            newTask.notes
        ) {
            return false;
        }


        if (
            oldTask.status !==
            newTask.status
        ) {
            return false;
        }


        if (
            oldTask.updated !==
            newTask.updated
        ) {
            return false;
        }


        if (
            oldTask.due !==
            newTask.due
        ) {
            return false;
        }


        if (
            oldTask.position !==
            newTask.position
        ) {
            return false;
        }

    }


    return true;
}


/* =========================================================
   SYNC
========================================================= */

async function syncTasks() {

    if (!accessToken) {
        return;
    }


    if (syncing) {
        return;
    }


    if (tokenExpired()) {

        requireLoginAgain();

        return;
    }


    syncing = true;

    syncButton.disabled = true;


    try {

        const newTasks =
            await getTasks();


        if (
            !sameTasks(
                tasksData,
                newTasks
            )
        ) {

            tasksData =
                newTasks;
tasksData.sort((a, b) => {
    return new Date(b.updated || 0) - new Date(a.updated || 0);
});
            renderTasks(
                tasksData
            );
        }


        const time =
            new Date()
                .toLocaleTimeString(
                    "zh-HK",
                    {
                        hour:
                            "2-digit",

                        minute:
                            "2-digit",

                        second:
                            "2-digit"
                    }
                );


        setStatus(
            tasksData.length +
            " 個待辦 · 最後同步 " +
            time
        );


    } catch (error) {

        console.error(
            "SYNC ERROR:",
            error
        );


        if (
            error.message !==
            "TOKEN_EXPIRED"
        ) {

            setStatus(
                "同步失敗：" +
                error.message
            );
        }

    } finally {

        syncing = false;

        syncButton.disabled = false;
    }
}


/* =========================================================
   RENDER TASKS
========================================================= */

function renderTasks(
    taskArray
) {

    /*
     * 先清空
     */

    tasksElement.innerHTML = "";


    /*
     * 沒有 Task
     */

    if (
        taskArray.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "empty";


        empty.textContent =
            "目前沒有未完成 Task";


        tasksElement.appendChild(
            empty
        );


        return;
    }


    /*
     * 一個一個建立
     */

    taskArray.forEach(
        task => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "task";


            card.dataset.taskId =
                task.id;


            /*
             * Checkbox
             */

            const checkbox =
                document.createElement(
                    "button"
                );


            checkbox.type =
                "button";


            checkbox.className =
                "task-checkbox";


            checkbox.setAttribute(
                "aria-label",
                "完成 Task"
            );


            checkbox.addEventListener(
                "click",
                function () {

                    completeTask(
                        task.id,
                        card,
                        checkbox
                    );

                }
            );


            /*
             * Content
             */

            const content =
                document.createElement(
                    "div"
                );


            content.className =
                "task-content";


            /*
             * Title
             */

            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "task-title";


            title.textContent =
                task.title ||
                "(沒有標題)";


            /*
             * Date
             */

            const date =
                document.createElement(
                    "div"
                );


            date.className =
                "task-date";


            const dateData =
                getTaskDate(
                    task.due
                );


            if (
                dateData
            ) {

                date.textContent =
                    dateData.text;


                /*
                 * 注意：
                 *
                 * 呢度完全唔用
                 * classList.add()
                 *
                 * 直接修改 className。
                 *
                 * 因此絕對唔會有
                 * classList.add("")
                 * 呢個錯誤。
                 */

                if (
                    dateData.type ===
                    "today"
                ) {

                    date.className =
                        "task-date today";

                }
                else if (
                    dateData.type ===
                    "tomorrow"
                ) {

                    date.className =
                        "task-date tomorrow";

                }
                else if (
                    dateData.type ===
                    "overdue"
                ) {

                    date.className =
                        "task-date overdue";

                }
                else {

                    date.className =
                        "task-date";
                }

            }
            else {

                date.style.display =
                    "none";
            }


            /*
             * 組合
             */

            content.appendChild(
                title
            );

            content.appendChild(
                date
            );


            card.appendChild(
                checkbox
            );

            card.appendChild(
                content
            );


            tasksElement.appendChild(
                card
            );

        }
    );
}


/* =========================================================
   TASK DATE
========================================================= */

function getTaskDate(
    due
) {

    if (!due) {

        return null;
    }


    const date =
        new Date(
            due
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return null;
    }


    const now =
        new Date();


    const today =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
        );


    const taskDay =
        new Date(
            date.getFullYear(),
            date.getMonth(),
            date.getDate()
        );


    const difference =
        Math.round(
            (
                taskDay.getTime() -
                today.getTime()
            ) /
            86400000
        );


    if (
        difference === 0
    ) {

        return {

            text:
                "今日",

            type:
                "today"

        };
    }


    if (
        difference === 1
    ) {

        return {

            text:
                "明日",

            type:
                "tomorrow"

        };
    }


    if (
        difference < 0
    ) {

        return {

            text:
                "逾期 · " +
                date.toLocaleDateString(
                    "zh-HK",
                    {
                        month:
                            "numeric",

                        day:
                            "numeric"
                    }
                ),

            type:
                "overdue"

        };
    }


    return {

        text:
            date.toLocaleDateString(
                "zh-HK",
                {
                    month:
                        "numeric",

                    day:
                        "numeric"
                }
            ),

        type:
            "normal"

    };
}


/* =========================================================
   COMPLETE TASK
========================================================= */

async function completeTask(
    taskId,
    card,
    checkbox
) {

    if (!accessToken) {
        return;
    }


    if (
        card.classList.contains(
            "fading"
        )
    ) {

        return;
    }


    /*
     * 即時 UI
     */

    checkbox.classList.add(
        "done"
    );

    card.classList.add(
        "fading"
    );


    try {

        await setTaskCompleted(
            taskId
        );


        /*
         * API 成功
         */

        tasksData =
            tasksData.filter(
                task =>
                    task.id !==
                    taskId
            );


        setTimeout(
            function () {

                renderTasks(
                    tasksData
                );

            },
            250
        );


        setStatus(
            "Task 已完成 ✓"
        );


    } catch (error) {

        console.error(
            "COMPLETE ERROR:",
            error
        );


        /*
         * API 失敗
         * 還原 UI
         */

        card.classList.remove(
            "fading"
        );

        checkbox.classList.remove(
            "done"
        );


        if (
            error.message !==
            "TOKEN_EXPIRED"
        ) {

            setStatus(
                "完成 Task 失敗，已還原。"
            );
        }
    }
}


/* =========================================================
   PATCH TASK
========================================================= */

async function setTaskCompleted(
    taskId
) {

    const url =
        API_BASE +
        "/lists/@default/tasks/" +
        encodeURIComponent(
            taskId
        );


    const response =
        await googleFetch(
            url,
            {

                method:
                    "PATCH",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        status:
                            "completed"

                    })

            }
        );


    if (!response.ok) {

        const text =
            await response.text();


        throw new Error(
            "PATCH " +
            response.status +
            ": " +
            text
        );
    }


    return response.json();
}


/* =========================================================
   MANUAL SYNC
========================================================= */

syncButton.addEventListener(
    "click",
    function () {

        syncTasks();

    }
);


/* =========================================================
   AUTO SYNC
========================================================= */

function startAutoSync() {

    stopAutoSync();


    /*
     * 登入後立即同步
     */

    syncTasks();


    /*
     * 每 5 秒
     */

    syncTimer =
        setInterval(
            function () {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    syncTasks();

                }

            },
            SYNC_INTERVAL
        );
}


function stopAutoSync() {

    if (syncTimer) {

        clearInterval(
            syncTimer
        );

        syncTimer = null;
    }
}


/* =========================================================
   LOGOUT
========================================================= */

logoutButton.addEventListener(
    "click",
    function () {

        stopAutoSync();


        if (
            accessToken &&
            typeof google !== "undefined" &&
            google.accounts &&
            google.accounts.oauth2
        ) {

            try {

                google.accounts.oauth2.revoke(
                    accessToken,
                    function () {}
                );

            } catch (error) {

                console.warn(
                    error
                );
            }
        }


        accessToken = "";

        tokenExpiry = 0;

        tasksData = [];


        loginButton.style.display =
            "block";

        logoutButton.style.display =
            "none";


        loginOverlay.style.display =
            "none";


        tasksElement.innerHTML =
            '<div class="empty">' +
            '請先登入 Google' +
            '</div>';


        setStatus(
            "尚未登入"
        );

    }
);


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    function () {

        if (
            document.visibilityState ===
            "visible"
        ) {

            if (accessToken) {

                syncTasks();

            }
        }
    }
);


/* =========================================================
   NETWORK
========================================================= */

window.addEventListener(
    "online",
    function () {

        if (accessToken) {

            setStatus(
                "網絡已恢復，正在同步…"
            );

            syncTasks();

        }
    }
);


window.addEventListener(
    "offline",
    function () {

        setStatus(
            "網絡中斷，等待恢復…"
        );

    }
);


/* =========================================================
   FULLSCREEN
========================================================= */

fullscreenButton.addEventListener(
    "click",
    async function () {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement.requestFullscreen();

            }
            else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.warn(
                "Fullscreen error:",
                error
            );

            setStatus(
                "瀏覽器未能進入全螢幕。"
            );
        }

    }
);


/* =========================================================
   INITIAL
========================================================= */

setStatus(
    "尚未登入"
);

</script>

</body>
</html>
