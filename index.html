<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>工作 Dashboard</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #121212;
    color: #f1f1f1;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
}

body {
    position: fixed;
    inset: 0;
}

button {
    font-family: inherit;
}

.app {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* =========================
   HEADER
========================= */

.header {
    flex: 0 0 auto;
    min-height: 58px;
    padding: 8px 12px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;

    background: #181818;
    border-bottom: 1px solid #292929;
}

.header-left {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 14px;
}

.title-area {
    min-width: 0;
}

.title {
    font-size: 1.15rem;
    font-weight: 700;
    white-space: nowrap;
}

.clock {
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1;
    margin-top: 2px;
}

.weather {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 0.78rem;
    color: #cfcfcf;
    white-space: nowrap;
    overflow: hidden;
}

.weather-main {
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
}

.weather-warning {
    color: #ffcc66;
    font-weight: 600;
}

.header-right {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
}

.header-btn {
    border: 1px solid #383838;
    background: #242424;
    color: #f1f1f1;

    border-radius: 8px;
    padding: 7px 10px;

    font-size: 0.78rem;
    cursor: pointer;
}

.header-btn:hover {
    background: #303030;
}

.header-btn:active {
    transform: scale(0.97);
}

#continueButton {
    display: none;
}

/* =========================
   DASHBOARD
========================= */

.dashboard {
    flex: 1 1 0;
    min-width: 0;
    min-height: 0;

    width: 100%;
    padding: 10px 12px 12px;

    display: grid;
    grid-template-columns: 45fr 35fr 20fr;
    gap: 10px;

    overflow: hidden;
}

/* =========================
   PANEL
========================= */

.panel {
    min-width: 0;
    min-height: 0;
    height: 100%;

    display: flex;
    flex-direction: column;

    background: #181818;
    border: 1px solid #292929;
    border-radius: 12px;

    overflow: hidden;
}

.panel-header {
    flex: 0 0 auto;

    min-height: 46px;
    padding: 8px 11px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;

    border-bottom: 1px solid #292929;
}

.panel-title-wrap {
    min-width: 0;

    display: flex;
    align-items: center;
    gap: 7px;
}

.panel-title {
    font-size: 0.95rem;
    font-weight: 700;
    white-space: nowrap;
}

.panel-count {
    min-width: 20px;
    height: 20px;

    padding: 0 6px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background: #303030;
    color: #cfcfcf;

    font-size: 0.68rem;
}

.panel-meta {
    flex: 0 0 auto;

    display: flex;
    align-items: center;
    gap: 7px;

    color: #999;
}

.panel-updated {
    font-size: 0.68rem;
    color: #858585;
    white-space: nowrap;
}

/* =========================
   TASKS
========================= */

.task-scroll {
    flex: 1 1 0;
    min-height: 0;

    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;

    padding: 8px;
}

.task-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.task-item {
    display: flex;
    align-items: center;
    gap: 10px;

    padding: 8px 9px;

    background: #202020;
    border: 1px solid #2c2c2c;
    border-radius: 9px;

    transition:
        opacity 0.2s ease,
        transform 0.2s ease,
        background 0.15s ease;
}

.task-item:hover {
    background: #252525;
}

.task-item.completed {
    opacity: 0;
    transform: translateX(20px);
}

.task-checkbox {
    flex: 0 0 auto;

    width: 27px;
    height: 27px;

    border: 2px solid #777;
    border-radius: 7px;

    background: transparent;

    cursor: pointer;
}

.task-checkbox:hover {
    border-color: #aaa;
}

.task-content {
    min-width: 0;
    flex: 1;
}

.task-title {
    font-size: 0.95rem;
    line-height: 1.35;

    word-break: break-word;
}

.task-due {
    margin-top: 2px;

    font-size: 0.68rem;
    color: #888;
}

.empty-state {
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px;

    color: #777;
    text-align: center;
    font-size: 0.85rem;
}

/* =========================
   CALENDAR
========================= */

.schedule-scroll {
    flex: 1 1 0;
    min-height: 0;

    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;

    padding: 8px;
}

.next-event {
    margin-bottom: 8px;
    padding: 8px 10px;

    background: #202020;
    border: 1px solid #303030;
    border-radius: 9px;
}

.next-event-label {
    font-size: 0.65rem;
    color: #888;
}

.next-event-title {
    margin-top: 2px;

    font-size: 0.85rem;
    font-weight: 700;

    word-break: break-word;
}

.next-event-countdown {
    margin-top: 2px;

    font-size: 0.72rem;
    color: #aaa;
}

.day-title {
    margin: 7px 2px 5px;

    font-size: 0.7rem;
    font-weight: 700;
    color: #888;
}

.event-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.event-item {
    padding: 8px 9px;

    background: #202020;
    border: 1px solid #2c2c2c;
    border-radius: 8px;

    opacity: 0.95;
}

.event-item.past {
    opacity: 0.42;
}

.event-item.now {
    border-color: #666;
    background: #252525;
}

.event-time {
    font-size: 0.7rem;
    color: #999;
}

.event-title {
    margin-top: 2px;

    font-size: 0.82rem;
    line-height: 1.3;
    font-weight: 600;

    word-break: break-word;
}

.event-location {
    margin-top: 3px;

    font-size: 0.65rem;
    color: #777;

    word-break: break-word;
}

/* =========================
   EMAIL
========================= */

.mail-scroll {
    flex: 1 1 0;
    min-height: 0;

    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;

    padding: 8px;
}

.mail-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.mail-item {
    flex: 0 0 auto;
    min-height: 0;

    padding: 8px 9px;

    background: #202020;
    border: 1px solid #2c2c2c;
    border-radius: 8px;

    cursor: pointer;
}

.mail-item:hover {
    background: #252525;
}

.mail-sender {
    font-size: 0.68rem;
    color: #999;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.mail-subject {
    margin-top: 3px;

    font-size: 0.79rem;
    line-height: 1.35;
    font-weight: 600;

    /* 不再強制一行 */
    white-space: normal;
    overflow: visible;
    text-overflow: clip;

    word-break: break-word;
    overflow-wrap: anywhere;
}

.mail-snippet {
    margin-top: 4px;

    font-size: 0.67rem;
    line-height: 1.35;

    color: #777;

    white-space: normal;
    word-break: break-word;
    overflow-wrap: anywhere;
}

.mail-time {
    margin-top: 4px;

    font-size: 0.62rem;
    color: #666;
}

/* =========================
   WORK OFF
========================= */

.work-off {
    display: none;

    flex: 1 1 0;
    min-height: 0;

    width: 100%;
    height: 100%;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 20px;
}

.work-off.active {
    display: flex;
}

.work-off-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    gap: 10px;
}

.work-off-icon {
    font-size: clamp(2.5rem, 6vw, 4rem);
}

.work-off-title {
    font-size: clamp(2rem, 5vw, 4rem);
    font-weight: 800;
    line-height: 1.1;
}

.work-off-text {
    font-size: clamp(1rem, 2vw, 1.4rem);
    color: #aaa;
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: #444;
    border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
    background: #555;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 900px) {
    .weather {
        display: none;
    }

    .dashboard {
        grid-template-columns: 42fr 38fr 20fr;
    }

    .title {
        font-size: 1rem;
    }

    .clock {
        font-size: 1.3rem;
    }
}

@media (max-width: 650px) {
    .header-btn {
        padding: 6px 8px;
        font-size: 0.7rem;
    }

    .dashboard {
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
        padding: 6px;
    }

    .panel-header {
        padding: 7px;
    }

    .panel-title {
        font-size: 0.82rem;
    }

    .task-title {
        font-size: 0.82rem;
    }

    .mail-subject {
        font-size: 0.7rem;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- =========================
         HEADER
    ========================== -->
    <header class="header">

        <div class="header-left">

            <div class="title-area">
                <div class="title">工作 Dashboard</div>
                <div id="clock" class="clock">--:--</div>
            </div>

            <div class="weather">
                <span id="weatherMain" class="weather-main">天氣載入中</span>
                <span id="weatherHumidity"></span>
                <span id="weatherRain"></span>
                <span id="weatherAQHI"></span>
                <span id="weatherWarning" class="weather-warning"></span>
            </div>

        </div>

        <div class="header-right">

            <button id="loginButton" class="header-btn">
                登入 Google
            </button>

            <button id="logoutButton"
                    class="header-btn"
                    style="display:none;">
                登出
            </button>

            <button id="syncButton"
                    class="header-btn">
                ↻
            </button>

            <button id="fullscreenButton"
                    class="header-btn">
                ⛶
            </button>

            <button id="workButton"
                    class="header-btn">
                🌙 收工
            </button>

            <button id="continueButton"
                    class="header-btn">
                ☀️ 繼續工作
            </button>

        </div>

    </header>


    <!-- =========================
         DASHBOARD
    ========================== -->

    <main id="dashboard" class="dashboard">

        <!-- TASKS -->
        <section class="panel">

            <div class="panel-header">

                <div class="panel-title-wrap">
                    <div class="panel-title">Tasks</div>
                    <div id="taskCount"
                         class="panel-count">
                        0
                    </div>
                </div>

                <div class="panel-meta">
                    <div id="taskUpdated"
                         class="panel-updated">
                        --:--
                    </div>
                </div>

            </div>

            <div class="task-scroll">
                <div id="taskList"
                     class="task-list">

                    <div class="empty-state">
                        請先登入 Google
                    </div>

                </div>
            </div>

        </section>


        <!-- CALENDAR -->
        <section class="panel">

            <div class="panel-header">

                <div class="panel-title-wrap">
                    <div class="panel-title">Schedule</div>
                </div>

                <div class="panel-meta">
                    <div id="calendarUpdated"
                         class="panel-updated">
                        --:--
                    </div>
                </div>

            </div>

            <div class="schedule-scroll">

                <div id="nextEvent"></div>

                <div id="scheduleList">

                    <div class="empty-state">
                        請先登入 Google
                    </div>

                </div>

            </div>

        </section>


        <!-- EMAIL -->
        <section class="panel">

            <div class="panel-header">

                <div class="panel-title-wrap">
                    <div class="panel-title">Email</div>

                    <div id="mailCount"
                         class="panel-count">
                        0
                    </div>
                </div>

                <div class="panel-meta">
                    <div id="mailUpdated"
                         class="panel-updated">
                        --:--
                    </div>
                </div>

            </div>

            <div class="mail-scroll">

                <div id="mailList"
                     class="mail-list">

                    <div class="empty-state">
                        請先登入 Google
                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         WORK OFF SCREEN
    ========================== -->

    <section id="workOff"
             class="work-off">

        <div class="work-off-inner">

            <div class="work-off-icon">
                🌙
            </div>

            <div class="work-off-title">
                已收工
            </div>

            <div class="work-off-text">
                已收工!!今日辛苦了，祝您有個愉快的晚上。
            </div>

        </div>

    </section>

</div>


<script>
/* =========================================================
   GOOGLE CONFIG
========================================================= */

const CLIENT_ID =
    "710651032876-n8m8m7g3rhne9f2r3m0b78vkoqh18lhl.apps.googleusercontent.com";

const GOOGLE_SCOPE =
    "https://www.googleapis.com/auth/tasks " +
    "https://www.googleapis.com/auth/calendar.readonly " +
    "https://www.googleapis.com/auth/gmail.readonly";


/* =========================================================
   API
========================================================= */

const TASKS_API =
    "https://tasks.googleapis.com/tasks/v1";

const CALENDAR_API =
    "https://www.googleapis.com/calendar/v3";

const GMAIL_API =
    "https://gmail.googleapis.com/gmail/v1";

const HKO_API =
    "https://data.weather.gov.hk/weatherAPI/opendata/weather.php";

const AQHI_API =
    "https://dashboard.data.gov.hk/api/aqhi-individual?format=json";


/* =========================================================
   STATE
========================================================= */

let accessToken = null;
let tokenClient = null;

let workOff = false;

let taskTimer = null;
let calendarTimer = null;
let mailTimer = null;
let weatherTimer = null;

let currentTasks = [];
let currentEvents = [];
let currentMails = [];


/* =========================================================
   ELEMENTS
========================================================= */

const clockEl =
    document.getElementById("clock");

const loginButton =
    document.getElementById("loginButton");

const logoutButton =
    document.getElementById("logoutButton");

const syncButton =
    document.getElementById("syncButton");

const fullscreenButton =
    document.getElementById("fullscreenButton");

const workButton =
    document.getElementById("workButton");

const continueButton =
    document.getElementById("continueButton");

const dashboard =
    document.getElementById("dashboard");

const workOffScreen =
    document.getElementById("workOff");

const taskList =
    document.getElementById("taskList");

const taskCount =
    document.getElementById("taskCount");

const taskUpdated =
    document.getElementById("taskUpdated");

const scheduleList =
    document.getElementById("scheduleList");

const nextEvent =
    document.getElementById("nextEvent");

const calendarUpdated =
    document.getElementById("calendarUpdated");

const mailList =
    document.getElementById("mailList");

const mailCount =
    document.getElementById("mailCount");

const mailUpdated =
    document.getElementById("mailUpdated");


/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    const now = new Date();

    const hh =
        String(now.getHours()).padStart(2, "0");

    const mm =
        String(now.getMinutes()).padStart(2, "0");

    clockEl.textContent =
        `${hh}:${mm}`;
}

updateClock();

setInterval(updateClock, 1000);


/* =========================================================
   TIME
========================================================= */

function formatTime(date) {

    if (!date) {
        return "";
    }

    const hh =
        String(date.getHours()).padStart(2, "0");

    const mm =
        String(date.getMinutes()).padStart(2, "0");

    return `${hh}:${mm}`;
}


function formatDateTime(date) {

    if (!date) {
        return "";
    }

    return `${date.getMonth() + 1}/${date.getDate()} ${formatTime(date)}`;
}


function setPanelUpdated(element) {

    /*
       只顯示時間，例如：
       15:32
    */

    element.textContent =
        formatTime(new Date());
}


/* =========================================================
   GOOGLE LOGIN
========================================================= */

function initGoogle() {

    if (
        !window.google ||
        !google.accounts ||
        !google.accounts.oauth2
    ) {
        setTimeout(initGoogle, 500);
        return;
    }

    tokenClient =
        google.accounts.oauth2.initTokenClient({

            client_id: CLIENT_ID,

            scope: GOOGLE_SCOPE,

            callback: async (response) => {

                if (response.error) {

                    console.error(
                        "OAuth error:",
                        response
                    );

                    return;
                }

                accessToken =
                    response.access_token;

                loginButton.style.display =
                    "none";

                logoutButton.style.display =
                    "inline-block";

                await syncAll();
            }

        });
}

initGoogle();


loginButton.addEventListener(
    "click",
    () => {

        if (!tokenClient) {
            alert("Google 登入元件仍在載入，請稍候。");
            return;
        }

        tokenClient.requestAccessToken({
            prompt: "consent"
        });
    }
);


logoutButton.addEventListener(
    "click",
    () => {

        accessToken = null;

        if (
            window.google &&
            google.accounts &&
            google.accounts.oauth2
        ) {
            google.accounts.oauth2.revoke(
                accessToken,
                () => {}
            );
        }

        loginButton.style.display =
            "inline-block";

        logoutButton.style.display =
            "none";

        taskList.innerHTML =
            `<div class="empty-state">請先登入 Google</div>`;

        scheduleList.innerHTML =
            `<div class="empty-state">請先登入 Google</div>`;

        mailList.innerHTML =
            `<div class="empty-state">請先登入 Google</div>`;

        taskCount.textContent = "0";
        mailCount.textContent = "0";

        stopGoogleTimers();
    }
);


/* =========================================================
   API HELPER
========================================================= */

async function googleFetch(url, options = {}) {

    if (!accessToken) {
        throw new Error("未登入 Google");
    }

    const headers = {
        ...(options.headers || {}),
        Authorization:
            `Bearer ${accessToken}`
    };

    const response =
        await fetch(url, {
            ...options,
            headers
        });

    if (response.status === 401) {

        accessToken = null;

        loginButton.style.display =
            "inline-block";

        logoutButton.style.display =
            "none";

        throw new Error("Google 登入已失效");
    }

    if (!response.ok) {

        const text =
            await response.text();

        throw new Error(
            `${response.status}: ${text}`
        );
    }

    return response;
}


/* =========================================================
   TASKS
========================================================= */

async function loadTasks() {

    if (!accessToken) {
        return;
    }

    try {

        const url =
            `${TASKS_API}/lists/@default/tasks` +
            `?showCompleted=false` +
            `&showDeleted=false` +
            `&maxResults=100`;

        const response =
            await googleFetch(url);

        const data =
            await response.json();

        currentTasks =
            (data.items || [])
            .filter(task => !task.deleted)
            .sort((a, b) => {

                const da =
                    a.due
                        ? new Date(a.due).getTime()
                        : Infinity;

                const db =
                    b.due
                        ? new Date(b.due).getTime()
                        : Infinity;

                return da - db;
            });

        renderTasks();

        setPanelUpdated(taskUpdated);

    } catch (error) {

        console.error(
            "Tasks:",
            error
        );
    }
}


function renderTasks() {

    taskCount.textContent =
        currentTasks.length;

    if (currentTasks.length === 0) {

        taskList.innerHTML =
            `<div class="empty-state">目前沒有待辦事項</div>`;

        return;
    }

    taskList.innerHTML = "";

    currentTasks.forEach(task => {

        const item =
            document.createElement("div");

        item.className =
            "task-item";

        const checkbox =
            document.createElement("button");

        checkbox.className =
            "task-checkbox";

        checkbox.setAttribute(
            "aria-label",
            "完成工作"
        );

        checkbox.addEventListener(
            "click",
            () => completeTask(task, item)
        );


        const content =
            document.createElement("div");

        content.className =
            "task-content";


        const title =
            document.createElement("div");

        title.className =
            "task-title";

        title.textContent =
            task.title || "(沒有標題)";


        content.appendChild(title);


        if (task.due) {

            const due =
                document.createElement("div");

            due.className =
                "task-due";

            const date =
                new Date(task.due);

            due.textContent =
                `到期：${formatDateTime(date)}`;

            content.appendChild(due);
        }


        item.appendChild(checkbox);
        item.appendChild(content);

        taskList.appendChild(item);
    });
}


async function completeTask(task, element) {

    /*
       先更新畫面，唔等 API
    */

    element.classList.add("completed");

    setTimeout(() => {

        element.remove();

        currentTasks =
            currentTasks.filter(
                t => t.id !== task.id
            );

        taskCount.textContent =
            currentTasks.length;

    }, 200);


    try {

        await googleFetch(
            `${TASKS_API}/lists/@default/tasks/${encodeURIComponent(task.id)}`,
            {
                method: "PATCH",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    status: "completed"
                })
            }
        );

    } catch (error) {

        console.error(
            "完成 Task 失敗:",
            error
        );

        /*
           如果 API 失敗，下次同步會重新出現
        */
    }
}


/* =========================================================
   CALENDAR
========================================================= */

async function loadCalendar() {

    if (!accessToken) {
        return;
    }

    try {

        const now =
            new Date();

        const start =
            new Date(now);

        start.setHours(
            0, 0, 0, 0
        );

        const end =
            new Date(start);

        end.setDate(
            end.getDate() + 2
        );

        const url =
            `${CALENDAR_API}/calendars/primary/events` +
            `?timeMin=${encodeURIComponent(start.toISOString())}` +
            `&timeMax=${encodeURIComponent(end.toISOString())}` +
            `&singleEvents=true` +
            `&orderBy=startTime` +
            `&maxResults=100`;

        const response =
            await googleFetch(url);

        const data =
            await response.json();

        currentEvents =
            data.items || [];

        renderCalendar();

        setPanelUpdated(calendarUpdated);

    } catch (error) {

        console.error(
            "Calendar:",
            error
        );
    }
}


function getEventDate(event) {

    if (event.start?.dateTime) {
        return new Date(event.start.dateTime);
    }

    if (event.start?.date) {

        const d =
            new Date(
                event.start.date + "T00:00:00"
            );

        return d;
    }

    return null;
}


function getEventEndDate(event) {

    if (event.end?.dateTime) {
        return new Date(event.end.dateTime);
    }

    if (event.end?.date) {

        const d =
            new Date(
                event.end.date + "T00:00:00"
            );

        return d;
    }

    return null;
}


function isAllDay(event) {

    return !!event.start?.date;
}


function renderCalendar() {

    const now =
        new Date();

    const tomorrow =
        new Date(now);

    tomorrow.setDate(
        tomorrow.getDate() + 1
    );


    const todayKey =
        now.toISOString()
        .slice(0, 10);

    const tomorrowKey =
        tomorrow.toISOString()
        .slice(0, 10);


    const todayEvents = [];
    const tomorrowEvents = [];


    currentEvents.forEach(event => {

        if (!event.start) {
            return;
        }

        if (event.start.date) {

            if (event.start.date === todayKey) {
                todayEvents.push(event);
            }

            if (event.start.date === tomorrowKey) {
                tomorrowEvents.push(event);
            }

            return;
        }


        const start =
            new Date(event.start.dateTime);

        const key =
            start.toISOString()
            .slice(0, 10);

        if (key === todayKey) {
            todayEvents.push(event);
        }

        if (key === tomorrowKey) {
            tomorrowEvents.push(event);
        }
    });


    let html = "";

    html += renderDay(
        "今日",
        todayEvents,
        now
    );

    html += renderDay(
        "明日",
        tomorrowEvents,
        now
    );


    if (!html) {

        html =
            `<div class="empty-state">今日及明日沒有行程</div>`;
    }

    scheduleList.innerHTML =
        html;


    updateNextEvent();
}


function renderDay(title, events, now) {

    let html =
        `<div class="day-title">${title}</div>`;

    if (!events.length) {

        html +=
            `<div style="
                color:#555;
                font-size:.68rem;
                padding:4px 2px 7px;
            ">沒有行程</div>`;

        return html;
    }


    html += `<div class="event-list">`;


    events.forEach(event => {

        const start =
            getEventDate(event);

        const end =
            getEventEndDate(event);

        const past =
            end &&
            end < now;

        const active =
            start &&
            end &&
            start <= now &&
            now <= end;


        let timeText = "";

        if (isAllDay(event)) {

            timeText =
                "全日";
        } else {

            timeText =
                `${formatTime(start)} - ${formatTime(end)}`;
        }


        const location =
            event.location
                ? `<div class="event-location">
                    📍 ${escapeHtml(event.location)}
                   </div>`
                : "";


        html += `
            <div class="event-item ${past ? "past" : ""} ${active ? "now" : ""}">

                <div class="event-time">
                    ${timeText}
                </div>

                <div class="event-title">
                    ${escapeHtml(event.summary || "(沒有標題)")}
                </div>

                ${location}

            </div>
        `;
    });


    html += `</div>`;

    return html;
}


function updateNextEvent() {

    const now =
        new Date();

    const upcoming =
        currentEvents
        .map(event => {

            const start =
                getEventDate(event);

            const end =
                getEventEndDate(event);

            return {
                event,
                start,
                end
            };

        })
        .filter(x =>
            x.start &&
            x.end &&
            x.end > now
        )
        .sort((a, b) =>
            a.start - b.start
        );


    if (!upcoming.length) {

        nextEvent.innerHTML = "";

        return;
    }


    const item =
        upcoming[0];

    const diff =
        item.start - now;


    let countdown = "";

    if (diff <= 0) {

        countdown =
            "進行中";

    } else {

        const totalMinutes =
            Math.ceil(diff / 60000);

        const hours =
            Math.floor(totalMinutes / 60);

        const minutes =
            totalMinutes % 60;

        if (hours > 0) {

            countdown =
                `${hours} 小時 ${minutes} 分鐘後`;

        } else {

            countdown =
                `${minutes} 分鐘後`;
        }
    }


    nextEvent.innerHTML = `
        <div class="next-event">

            <div class="next-event-label">
                下一個行程
            </div>

            <div class="next-event-title">
                ${escapeHtml(item.event.summary || "(沒有標題)")}
            </div>

            <div class="next-event-countdown">
                ${countdown} · ${formatTime(item.start)}
            </div>

        </div>
    `;
}


/* =========================================================
   GMAIL
========================================================= */

async function loadMail() {

    if (!accessToken) {
        return;
    }

    try {

        /*
           只取 Inbox 未讀
        */

        const searchUrl =
            `${GMAIL_API}/users/me/messages` +
            `?labelIds=INBOX` +
            `&q=is:unread` +
            `&maxResults=8`;

        const response =
            await googleFetch(searchUrl);

        const data =
            await response.json();

        const messages =
            data.messages || [];


        const details =
            await Promise.all(
                messages.map(
                    message =>
                        loadMailDetail(message.id)
                )
            );


        currentMails =
            details.filter(Boolean);

        renderMail();

        setPanelUpdated(mailUpdated);

    } catch (error) {

        console.error(
            "Gmail:",
            error
        );
    }
}


async function loadMailDetail(id) {

    try {

        const response =
            await googleFetch(
                `${GMAIL_API}/users/me/messages/${id}?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date`
            );

        const data =
            await response.json();

        const headers =
            data.payload?.headers || [];


        const getHeader =
            name => {

                const header =
                    headers.find(
                        h =>
                            h.name.toLowerCase() ===
                            name.toLowerCase()
                    );

                return header
                    ? header.value
                    : "";
            };


        return {
            id,
            threadId: data.threadId,
            from: getHeader("From"),
            subject:
                getHeader("Subject") ||
                "(沒有主旨)",
            date: getHeader("Date"),
            snippet: data.snippet || ""
        };

    } catch (error) {

        console.error(
            "Email detail:",
            error
        );

        return null;
    }
}


function renderMail() {

    mailCount.textContent =
        currentMails.length;


    if (currentMails.length === 0) {

        mailList.innerHTML =
            `<div class="empty-state">沒有未讀 Email</div>`;

        return;
    }


    mailList.innerHTML = "";


    currentMails.forEach(mail => {

        const item =
            document.createElement("div");

        item.className =
            "mail-item";


        const sender =
            document.createElement("div");

        sender.className =
            "mail-sender";

        sender.textContent =
            mail.from || "(未知寄件人)";


        const subject =
            document.createElement("div");

        subject.className =
            "mail-subject";

        subject.textContent =
            mail.subject;


        const snippet =
            document.createElement("div");

        snippet.className =
            "mail-snippet";

        snippet.textContent =
            mail.snippet;


        const time =
            document.createElement("div");

        time.className =
            "mail-time";

        if (mail.date) {

            const date =
                new Date(mail.date);

            if (!isNaN(date.getTime())) {

                time.textContent =
                    formatDateTime(date);
            }
        }


        item.appendChild(sender);
        item.appendChild(subject);
        item.appendChild(snippet);
        item.appendChild(time);


        item.addEventListener(
            "click",
            () => {

                /*
                   開 Gmail thread
                */

                window.open(
                    `https://mail.google.com/mail/u/0/#all/${mail.threadId}`,
                    "_blank"
                );

            }
        );


        mailList.appendChild(item);
    });
}


/* =========================================================
   WEATHER
========================================================= */

async function loadWeather() {

    try {

        const response =
            await fetch(
                `${HKO_API}?dataType=rhrread&lang=tc`
            );

        const data =
            await response.json();


        const temp =
            data.temperature?.data?.[0]?.value;

        const humidity =
            data.humidity?.data?.[0]?.value;

        const rain =
            data.rainfall?.data?.[0]?.max;


        let weatherText =
            "天氣資料";


        if (
            data.icon &&
            data.icon.length
        ) {

            weatherText =
                `天氣 ${data.icon[0]}`;
        }


        if (temp !== undefined) {

            weatherText +=
                ` · ${temp}°C`;
        }


        document.getElementById(
            "weatherMain"
        ).textContent =
            weatherText;


        document.getElementById(
            "weatherHumidity"
        ).textContent =
            humidity !== undefined
                ? `濕度 ${humidity}%`
                : "";


        document.getElementById(
            "weatherRain"
        ).textContent =
            rain !== undefined
                ? `雨量 ${rain}mm`
                : "";


        await loadWeatherWarning();

    } catch (error) {

        console.error(
            "Weather:",
            error
        );

        document.getElementById(
            "weatherMain"
        ).textContent =
            "天氣資料暫時無法取得";
    }
}


async function loadWeatherWarning() {

    try {

        const response =
            await fetch(
                `${HKO_API}?dataType=warnsum&lang=tc`
            );

        const data =
            await response.json();


        const warningNames = [];


        Object.values(data || {}).forEach(
            item => {

                if (
                    item &&
                    item.name
                ) {

                    warningNames.push(
                        item.name
                    );
                }
            }
        );


        const warningEl =
            document.getElementById(
                "weatherWarning"
            );


        if (warningNames.length) {

            warningEl.textContent =
                `⚠ ${warningNames.join("、")}`;

        } else {

            warningEl.textContent =
                "";
        }

    } catch (error) {

        console.error(
            "Weather warning:",
            error
        );
    }
}


/* =========================================================
   AQHI
========================================================= */

async function loadAQHI() {

    try {

        const response =
            await fetch(AQHI_API);

        const data =
            await response.json();


        let found = null;


        const text =
            JSON.stringify(data);


        /*
           嘗試尋找北區 / North
        */

        if (
            text.includes("北區") ||
            text.toLowerCase().includes("north")
        ) {

            const findAQHI =
                obj => {

                    if (!obj || typeof obj !== "object") {
                        return null;
                    }

                    if (
                        (
                            String(obj.district || "")
                                .includes("北區")
                        ) &&
                        obj.aqhi !== undefined
                    ) {

                        return obj.aqhi;
                    }

                    if (
                        (
                            String(obj.station || "")
                                .toLowerCase()
                                .includes("north")
                        ) &&
                        obj.aqhi !== undefined
                    ) {

                        return obj.aqhi;
                    }

                    for (
                        const value of Object.values(obj)
                    ) {

                        const result =
                            findAQHI(value);

                        if (result !== null) {
                            return result;
                        }
                    }

                    return null;
                };


            found =
                findAQHI(data);
        }


        const aqhiEl =
            document.getElementById(
                "weatherAQHI"
            );


        if (found !== null) {

            aqhiEl.textContent =
                `AQHI ${found}`;

        } else {

            aqhiEl.textContent =
                "";
        }

    } catch (error) {

        console.error(
            "AQHI:",
            error
        );
    }
}


/* =========================================================
   SYNC
========================================================= */

async function syncAll() {

    if (!accessToken) {
        return;
    }

    /*
       三個 panel 分開更新
       每個 panel 成功更新後，
       只更新自己嘅時間
    */

    await Promise.allSettled([
        loadTasks(),
        loadCalendar(),
        loadMail()
    ]);
}


function startGoogleTimers() {

    stopGoogleTimers();


    /*
       Tasks：5 秒
    */

    taskTimer =
        setInterval(
            loadTasks,
            5000
        );


    /*
       Calendar：60 秒
    */

    calendarTimer =
        setInterval(
            loadCalendar,
            60000
        );


    /*
       Email：60 秒
    */

    mailTimer =
        setInterval(
            loadMail,
            60000
        );
}


function stopGoogleTimers() {

    if (taskTimer) {
        clearInterval(taskTimer);
        taskTimer = null;
    }

    if (calendarTimer) {
        clearInterval(calendarTimer);
        calendarTimer = null;
    }

    if (mailTimer) {
        clearInterval(mailTimer);
        mailTimer = null;
    }
}


syncButton.addEventListener(
    "click",
    async () => {

        if (!accessToken) {
            return;
        }

        syncButton.textContent = "…";

        await syncAll();

        syncButton.textContent = "↻";
    }
);

fullscreenButton.addEventListener(

        try {

workButton.addEventListener(

        workOff = true;

        workOffScreen.classList.add(

        );

    }
);


continueButton.addEventListener(

        );

        workButton.style.display =
            "inline-block";

        continueButton.style.display =

    }
);


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================================================
   INITIAL LOAD
========================================================= */

loadWeather();
loadAQHI();


weatherTimer =
    setInterval(
        () => {

            loadWeather();
            loadAQHI();

        },
        5 * 60 * 1000
    );


/*
   Google 登入成功後開始定時同步
*/

const originalSyncAll =
    syncAll;


/*
   每次第一次成功取得 accessToken 後
   啟動背景更新
*/

setInterval(
    () => {

        if (
            accessToken &&
            !taskTimer &&
            !calendarTimer &&
            !mailTimer
        ) {

            startGoogleTimers();
        }

    },
    1000
);
