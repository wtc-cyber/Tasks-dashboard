<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>WTC Work Dashboard</title>

<script src="https://accounts.google.com/gsi/client"></script>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #121212;
    color: #ffffff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;
}

button {
    font-family: inherit;
}


/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;

    background: #121212;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    flex: 0 0 auto;

    padding: 10px 16px 8px;

    background: #121212;

    border-bottom: 1px solid #292929;
}

.header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 12px;
}

.header-left {
    min-width: 0;

    display: flex;
    align-items: center;

    gap: 14px;
}

.title {
    font-size: 1.35rem;
    font-weight: 700;

    white-space: nowrap;
}

.clock {
    font-size: 1.25rem;
    font-weight: 600;

    color: #bbbbbb;

    font-variant-numeric: tabular-nums;

    white-space: nowrap;
}

.header-actions {
    display: flex;
    align-items: center;

    gap: 6px;
}

.header-button {
    min-height: 34px;

    padding: 0 11px;

    border: 0;
    border-radius: 8px;

    background: #292929;
    color: #ffffff;

    font-size: 0.78rem;

    cursor: pointer;
}

.header-button:active {
    background: #3a3a3a;
}

.logout-button {
    display: none;
}


/* =========================================================
   TOP WEATHER BAR
========================================================= */

.weather-bar {
    margin-top: 7px;

    display: flex;
    align-items: center;

    gap: 18px;

    white-space: nowrap;

    overflow-x: auto;

    scrollbar-width: none;
}

.weather-bar::-webkit-scrollbar {
    display: none;
}

.weather-item {
    display: flex;
    align-items: center;

    gap: 5px;

    color: #aaaaaa;

    font-size: 0.82rem;
}

.weather-value {
    color: #ffffff;
    font-weight: 600;
}

.weather-status {
    color: #666666;

    font-size: 0.68rem;
}

.aqhi-low {
    color: #81c784;
}

.aqhi-moderate {
    color: #ffca5c;
}

.aqhi-high {
    color: #ff9b6b;
}

.aqhi-very-high {
    color: #ff7373;
}

.aqhi-serious {
    color: #ff4f81;
}


/* =========================================================
   MAIN DASHBOARD
========================================================= */

.dashboard {
    flex: 1 1 auto;

    min-height: 0;

    padding: 12px;

    display: grid;

    /*
       Tasks     46%
       Weather   24%
       Email     30%
    */

    grid-template-columns:
        46fr
        24fr
        30fr;

    gap: 12px;
}


/* =========================================================
   PANEL
========================================================= */

.panel {
    min-width: 0;
    min-height: 0;

    display: flex;
    flex-direction: column;

    background: #181818;

    border: 1px solid #282828;

    border-radius: 14px;

    overflow: hidden;
}

.panel-header {
    flex: 0 0 auto;

    height: 48px;

    padding: 0 14px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #1c1c1c;

    border-bottom: 1px solid #292929;
}

.panel-title {
    font-size: 0.98rem;
    font-weight: 700;
}

.panel-info {
    color: #666666;

    font-size: 0.68rem;
}


/* =========================================================
   TASKS
========================================================= */

.task-scroll {
    flex: 1 1 auto;

    min-height: 0;

    overflow-y: auto;
    overflow-x: hidden;

    padding: 9px;

    -webkit-overflow-scrolling: touch;
}

#tasks {
    display: flex;
    flex-direction: column;

    gap: 8px;
}


/* Task */

.task {
    width: 100%;

    min-height: 64px;

    padding: 9px 11px;

    display: flex;
    align-items: center;

    background: #222222;

    border-radius: 11px;

    transition:
        opacity .25s ease,
        transform .25s ease,
        background .15s ease;
}

.task:active {
    background: #2b2b2b;
}

.task.fading {
    opacity: 0;
    transform: translateX(30px);
}


/* Checkbox */

.task-checkbox {
    flex: 0 0 auto;

    width: 28px;
    height: 28px;

    margin-right: 12px;

    border: 2px solid #888888;

    border-radius: 50%;

    position: relative;

    background: transparent;

    cursor: pointer;
}

.task-checkbox.done {
    border-color: #777777;
    background: #777777;
}

.task-checkbox.done::after {
    content: "";

    position: absolute;

    left: 7px;
    top: 3px;

    width: 7px;
    height: 13px;

    border-right: 2px solid #ffffff;
    border-bottom: 2px solid #ffffff;

    transform: rotate(45deg);
}


/* Task content */

.task-content {
    flex: 1;

    min-width: 0;
}

.task-title {
    font-size: 1.08rem;

    line-height: 1.35;

    font-weight: 500;

    word-break: break-word;
}

.task-date {
    margin-top: 3px;

    font-size: 0.75rem;

    color: #888888;
}

.task-date.overdue {
    color: #ff7777;
}

.task-date.today {
    color: #ffb74d;
}

.task-date.tomorrow {
    color: #81c784;
}


/* Empty */

.empty {
    padding: 45px 20px;

    text-align: center;

    color: #666666;

    font-size: 0.95rem;
}

.task-status {
    flex: 0 0 auto;

    min-height: 20px;

    padding: 4px;

    text-align: center;

    color: #555555;

    font-size: 0.63rem;
}


/* =========================================================
   WEATHER PANEL
========================================================= */

.weather-scroll {
    flex: 1 1 auto;

    min-height: 0;

    overflow-y: auto;

    padding: 14px;
}


/* Current weather */

.current-weather {
    padding: 5px 0 15px;

    text-align: center;

    border-bottom: 1px solid #292929;
}

.weather-icon-large {
    font-size: 3rem;

    line-height: 1;

    margin-bottom: 7px;
}

.temperature-large {
    font-size: 2.65rem;

    line-height: 1;

    font-weight: 700;
}

.weather-description {
    margin-top: 7px;

    color: #aaaaaa;

    font-size: 0.85rem;
}


/* Weather stats */

.weather-stats {
    margin-top: 12px;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 7px;
}

.weather-stat {
    padding: 8px;

    background: #222222;

    border-radius: 8px;

    text-align: center;
}

.weather-stat-label {
    color: #777777;

    font-size: 0.63rem;
}

.weather-stat-value {
    margin-top: 3px;

    color: #ffffff;

    font-size: 0.82rem;

    font-weight: 600;
}


/* Forecast */

.forecast-heading {
    margin-top: 15px;
    margin-bottom: 7px;

    color: #777777;

    font-size: 0.7rem;

    font-weight: 600;
}

.forecast-list {
    display: flex;

    flex-direction: column;

    gap: 5px;
}

.forecast-row {
    min-height: 39px;

    padding: 6px 7px;

    display: grid;

    grid-template-columns:
        55px
        28px
        minmax(0, 1fr)
        62px;

    align-items: center;

    gap: 5px;

    background: #222222;

    border-radius: 7px;
}

.forecast-day {
    color: #aaaaaa;

    font-size: 0.68rem;
}

.forecast-icon {
    font-size: 0.95rem;

    text-align: center;
}

.forecast-weather {
    min-width: 0;

    color: #cccccc;

    font-size: 0.68rem;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.forecast-temp {
    color: #888888;

    font-size: 0.64rem;

    text-align: right;
}


/* =========================================================
   EMAIL
========================================================= */

.mail-scroll {
    flex: 1 1 auto;

    min-height: 0;

    overflow-y: auto;

    padding: 9px;
}

.mail-list {
    display: flex;

    flex-direction: column;

    gap: 7px;
}

.mail-item {
    width: 100%;

    padding: 11px;

    border: 0;

    border-radius: 10px;

    background: #222222;

    color: #ffffff;

    text-align: left;

    cursor: pointer;
}

.mail-item:active {
    background: #2c2c2c;
}

.mail-item.unread {
    border-left: 3px solid #ffffff;

    padding-left: 8px;
}

.mail-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 8px;
}

.mail-sender {
    min-width: 0;

    flex: 1;

    font-size: 0.82rem;

    font-weight: 600;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.mail-time {
    flex: 0 0 auto;

    color: #666666;

    font-size: 0.63rem;
}

.mail-subject {
    margin-top: 5px;

    color: #dddddd;

    font-size: 0.8rem;

    line-height: 1.35;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.mail-snippet {
    margin-top: 4px;

    color: #777777;

    font-size: 0.67rem;

    line-height: 1.35;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.mail-empty {
    padding: 50px 15px;

    color: #666666;

    text-align: center;

    font-size: 0.85rem;
}

.mail-error {
    padding: 30px 15px;

    color: #777777;

    text-align: center;

    font-size: 0.75rem;

    line-height: 1.6;
}


/* =========================================================
   LOGIN
========================================================= */

.login-overlay {
    position: fixed;

    inset: 0;

    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background: #121212;
}

.login-box {
    width: min(400px, 100%);

    padding: 30px;

    background: #1e1e1e;

    border-radius: 18px;

    text-align: center;
}

.login-title {
    font-size: 1.5rem;

    font-weight: 700;
}

.login-description {
    margin-top: 10px;
    margin-bottom: 24px;

    color: #999999;

    font-size: 0.88rem;

    line-height: 1.6;
}

.login-button {
    width: 100%;

    min-height: 50px;

    border: 0;

    border-radius: 12px;

    background: #ffffff;

    color: #111111;

    font-size: 1rem;

    font-weight: 600;

    cursor: pointer;
}


/* =========================================================
   SMALL SCREEN
========================================================= */

@media (max-width: 850px) {

    .dashboard {
        grid-template-columns:
            45fr
            25fr
            30fr;
    }

    .task-title {
        font-size: 0.98rem;
    }

    .temperature-large {
        font-size: 2.3rem;
    }

    .forecast-row {
        grid-template-columns:
            45px
            25px
            minmax(0, 1fr);
    }

    .forecast-temp {
        display: none;
    }
}


/* =========================================================
   PORTRAIT FALLBACK
========================================================= */

@media (max-width: 650px) {

    html,
    body {
        overflow: auto;
    }

    .app {
        height: auto;
        min-height: 100vh;
    }

    .dashboard {
        grid-template-columns: 1fr;

        overflow: visible;
    }

    .panel {
        min-height: 350px;
    }
}

</style>
</head>


<body>

<script>

/* =========================================================
   CONFIG
========================================================= */

const CLIENT_ID =
    "710651032876-n8m8m7g3rhne9f2r3m0b78vkoqh18lhl.apps.googleusercontent.com";


const GOOGLE_SCOPE =
    "https://www.googleapis.com/auth/tasks " +
    "https://www.googleapis.com/auth/gmail.readonly";


const TASKS_API =
    "https://tasks.googleapis.com/tasks/v1";


const GMAIL_API =
    "https://gmail.googleapis.com/gmail/v1";


const HKO_API =
    "https://data.weather.gov.hk/weatherAPI/opendata/weather.php";


const AQHI_API =
    "https://dashboard.data.gov.hk/api/aqhi-individual?format=json";


const TASK_INTERVAL =
    5000;


const MAIL_INTERVAL =
    60000;


const WEATHER_INTERVAL =
    600000;


/* =========================================================
   STATE
========================================================= */

let accessToken = null;

let tokenClient = null;

let taskListId = null;

let tasks = [];

let mails = [];

let currentWeather = null;

let forecast = null;


/* =========================================================
   DOM
========================================================= */

const loginOverlay =
    document.getElementById(
        "loginOverlay"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const logoutButton =
    document.getElementById(
        "logoutButton"
    );

const syncButton =
    document.getElementById(
        "syncButton"
    );

const fullscreenButton =
    document.getElementById(
        "fullscreenButton"
    );


/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    const now = new Date();

    const h =
        String(
            now.getHours()
        ).padStart(2, "0");

    const m =
        String(
            now.getMinutes()
        ).padStart(2, "0");

    document.getElementById(
        "clock"
    ).textContent =
        `${h}:${m}`;
}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =========================================================
   TIME
========================================================= */

function timeString(date) {

    return (
        String(
            date.getHours()
        ).padStart(2, "0")
        +
        ":"
        +
        String(
            date.getMinutes()
        ).padStart(2, "0")
    );
}


/* =========================================================
   TASK DATE
========================================================= */

function dateOnly(date) {

    return new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
    );
}


function taskDateInfo(value) {

    if (!value) {
        return null;
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return null;
    }


    const today =
        dateOnly(
            new Date()
        );


    const tomorrow =
        new Date(today);

    tomorrow.setDate(
        tomorrow.getDate() + 1
    );


    const d =
        dateOnly(date);


    if (
        d.getTime() <
        today.getTime()
    ) {

        return {
            text:
                `逾期 · ${d.getMonth() + 1}/${d.getDate()}`,
            type:
                "overdue"
        };
    }


    if (
        d.getTime() ===
        today.getTime()
    ) {

        return {
            text: "今日",
            type: "today"
        };
    }


    if (
        d.getTime() ===
        tomorrow.getTime()
    ) {

        return {
            text: "明日",
            type: "tomorrow"
        };
    }


    return {
        text:
            `${d.getMonth() + 1}/${d.getDate()}`,
        type:
            ""
    };
}


/* =========================================================
   GOOGLE TASKS
========================================================= */

async function getTaskList() {

    const response =
        await fetch(
            `${TASKS_API}/users/@me/lists`,
            {
                headers: {
                    Authorization:
                        `Bearer ${accessToken}`
                }
            }
        );


    if (!response.ok) {
        throw new Error(
            "Task List error"
        );
    }


    const data =
        await response.json();


    const defaultList =
        data.items?.find(
            item =>
                item.id === "@default"
        );


    if (defaultList) {
        return defaultList.id;
    }


    if (
        data.items &&
        data.items.length
    ) {

        return data.items[0].id;

    }


    throw new Error(
        "No task list"
    );
}


/* =========================================================
   LOAD TASKS
========================================================= */

async function loadTasks() {

    if (!accessToken) {
        return;
    }


    try {

        if (!taskListId) {

            taskListId =
                await getTaskList();

        }


        const url =
            `${TASKS_API}/lists/` +
            `${encodeURIComponent(taskListId)}` +
            `/tasks` +
            `?showCompleted=false` +
            `&showDeleted=false` +
            `&maxResults=100`;


        const response =
            await fetch(
                url,
                {
                    headers: {
                        Authorization:
                            `Bearer ${accessToken}`
                    }
                }
            );


        if (!response.ok) {
            throw new Error(
                "Tasks error"
            );
        }


        const data =
            await response.json();


        tasks =
            data.items || [];


        renderTasks();


        document.getElementById(
            "taskStatus"
        ).textContent =
            `更新 ${timeString(new Date())}`;

    }

/* =========================================================
   SORT TASKS
========================================================= */

function sortedTasks() {

    return [...tasks].sort(
        (a, b) => {

            if (!a.due && !b.due) {
                return 0;
            }

            if (!a.due) {
                return 1;
            }

            if (!b.due) {
                return -1;
            }

            return (
                new Date(a.due) -
                new Date(b.due)
            );
        }
    );
}

/* =========================================================
   COMPLETE TASK
========================================================= */

async function completeTask(
    task,
    card,
    checkbox
) {

    if (
        !accessToken ||
        !taskListId
    ) {
        return;
    }


    /*
     * 即時 UI
     */

    checkbox.className =
        "task-checkbox done";

    card.className =
        "task fading";


    try {

        const response =
            await fetch(
                `${TASKS_API}/lists/` +
                `${encodeURIComponent(taskListId)}` +
                `/tasks/` +
                `${encodeURIComponent(task.id)}`,
                {
                    method: "PATCH",

                    headers: {
                        Authorization:
                            `Bearer ${accessToken}`,

                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        status:
                            "completed"
                    })
                }
            );


        if (!response.ok) {
            throw new Error(
                "Complete task failed"
            );
        }


        setTimeout(
            () => {

                tasks =
                    tasks.filter(
                        item =>
                            item.id !== task.id
                    );

                renderTasks();

            },
            250
        );

    }
    catch (error) {

        console.error(
            error
        );


        checkbox.className =
            "task-checkbox";

        card.className =
            "task";

    }
}

async function loadMail() {

            `?maxResults=6` +
            `&q=${encodeURIComponent(

/* =========================================================
   GET MAIL
========================================================= */

async function getMail(id) {

    const url =
        `${GMAIL_API}/users/me/messages/` +
        `${encodeURIComponent(id)}` +
        `?format=metadata` +
        `&metadataHeaders=From` +
        `&metadataHeaders=Subject`;


    const response =
        await fetch(
            url,
            {
                headers: {
                    Authorization:
                        `Bearer ${accessToken}`
                }
            }
        );


    if (!response.ok) {
        return null;
    }


    const data =
        await response.json();


    const headers =
        data.payload?.headers || [];


    const from =
        headers.find(
            item =>
                item.name.toLowerCase() ===
                "from"
        );


    const subject =
        headers.find(
            item =>
                item.name.toLowerCase() ===
                "subject"
        );


    return {

        id:
            data.id,

        threadId:
            data.threadId,

        sender:
            cleanSender(
                from?.value ||
                "未知寄件人"
            ),

        subject:
            subject?.value ||
            "(沒有主旨)",

        snippet:
            data.snippet ||
            "",

        time:
            Number(
                data.internalDate ||
                Date.now()
            )

    };
}


/* =========================================================
   CLEAN SENDER
========================================================= */

function cleanSender(value) {

    const match =
        value.match(
            /^(.+?)\s*<[^>]+>$/
        );


    if (match) {

        return match[1]
            .replace(
                /^["']|["']$/g,
                ""
            )
            .trim();

    }


    return value;
}

function mailTime(date) {

    const now =
        new Date();


    if (
        date.toDateString() ===
        now.toDateString()
    ) {

        return timeString(date);

    }


    return (
        `${date.getMonth() + 1}/` +
        `${date.getDate()}`
    );

/* =========================================================
   WEATHER ICON
========================================================= */

function weatherIcon(
    text,
    code
) {

    const description =
        String(
            text || ""
        );


    if (
        description.includes("雷")
    ) {
        return "⛈️";
    }


    if (
        description.includes("雨") ||
        description.includes("驟雨")
    ) {
        return "🌧️";
    }


    if (
        description.includes("陰")
    ) {
        return "☁️";
    }


    if (
        description.includes("多雲")
    ) {
        return "⛅";
    }


    if (
        description.includes("晴")
    ) {
        return "☀️";
    }


    const n =
        Number(code);


    if (
        [50,51,52,53,54].includes(n)
    ) {
        return "⛅";
    }


    if (
        [60,61,62,63,64,65].includes(n)
    ) {
        return "🌧️";
    }


    return "🌤️";
}

/* =========================================================
   FORECAST DATE
========================================================= */

function forecastDay(value) {

    if (!value) {
        return "--";
    }


    const text =
        String(value);


    const year =
        Number(
            text.substring(0, 4)
        );

    const month =
        Number(
            text.substring(4, 6)
        );

    const day =
        Number(
            text.substring(6, 8)
        );


    const date =
        new Date(
            year,
            month - 1,
            day
        );


    const today =
        dateOnly(
            new Date()
        );


    const tomorrow =
        new Date(today);

    tomorrow.setDate(
        tomorrow.getDate() + 1
    );


    if (
        date.getTime() ===
        today.getTime()
    ) {
        return "今日";
    }


    if (
        date.getTime() ===
        tomorrow.getTime()
    ) {
        return "明日";
    }


    const week =
        [
            "日",
            "一",
            "二",
            "三",
            "四",
            "五",
            "六"
        ][
            date.getDay()
        ];


    return (
        `${month}/${day} ${week}`
    );
}


/* =========================================================
   FORECAST TEMP
========================================================= */

function forecastTemp(item) {

    const min =
        item.forecastMintemp?.value;

    const max =
        item.forecastMaxtemp?.value;


    if (
        min !== undefined &&
        max !== undefined
    ) {

        return `${min}°-${max}°`;

    }


    return "--";
}

/* =========================================================
   FIND AQHI
========================================================= */

function findAQHI(data) {

    let list = [];


    if (Array.isArray(data)) {

        list =
            data;

    }
    else {

        list =
            data?.data ||
            data?.records ||
            data?.results ||
            [];

    }


    if (!Array.isArray(list)) {
        return null;
    }


    /*
     * 嘗試找北區。
     */

    const north =
        list.find(
            item => {

                const text =
                    JSON.stringify(
                        item
                    ).toLowerCase();


                return (
                    text.includes("北區") ||
                    text.includes("north")
                );

            }
        );


    const item =
        north ||
        list[0];


    if (!item) {
        return null;
    }


    return (
        item.aqhi ??
        item.AQHI ??
        item.value ??
        item.index ??
        null
    );
}


/* =========================================================
   SHOW AQHI
========================================================= */

function showAQHI(value) {

    const element =
        document.getElementById(
            "topAQHI"
        );


    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        element.textContent =
            "AQHI --";

        element.className =
            "weather-value";

        return;
    }


    const number =
        Number(value);


    element.textContent =
        `AQHI ${value}`;


    let className =
        "weather-value";


    if (number <= 3) {

        className +=
            " aqhi-low";

    }
    else if (number <= 6) {

        className +=
            " aqhi-moderate";

    }
    else if (number <= 7) {

        className +=
            " aqhi-high";

    }
    else if (number <= 10) {

        className +=
            " aqhi-very-high";

    }
    else {

        className +=
            " aqhi-serious";

    }


    element.className =
        className;
}

        console.error(
            "Google Identity Services not ready"
        );

        return;
    }


    tokenClient =
        google.accounts.oauth2.initTokenClient({

            client_id:
                CLIENT_ID,

            scope:
                GOOGLE_SCOPE,

            callback:
                async response => {

                    if (
                        response.error
                    ) {

                        console.error(
                            "OAuth:",
                            response
                        );

                        return;
                    }


                    accessToken =
                        response.access_token;


                    taskListId =
                        null;


                    loginOverlay.style.display =
                        "none";


                    logoutButton.style.display =
                        "block";


                    await initialLoad();

                }

        });

}
