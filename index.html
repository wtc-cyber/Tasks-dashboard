<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <title>Tasks Dashboard</title>

    <script src="https://accounts.google.com/gsi/client"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #121212;
            color: #ffffff;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app {
            width: 100%;
            min-height: 100vh;
            padding: 16px;
        }

        /* =========================
           Header
        ========================= */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .title {
            font-size: 1.45rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .clock {
            font-size: 1.35rem;
            font-weight: 600;
            color: #bbbbbb;
            font-variant-numeric: tabular-nums;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font: inherit;
        }

        .header-button {
            min-height: 40px;
            padding: 0 13px;
            border-radius: 10px;
            background: #2a2a2a;
            color: #ffffff;
            font-size: 0.9rem;
        }

        .header-button:active {
            background: #3a3a3a;
        }

        .logout-button {
            display: none;
        }

        /* =========================
           Tasks
        ========================= */

        #tasks {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task {
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 72px;
            padding: 12px 14px;
            border-radius: 14px;
            background: #1e1e1e;
            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
        }

        .task.fading {
            opacity: 0;
            transform: translateX(30px);
        }

        .task-checkbox {
            flex: 0 0 auto;
            width: 28px;
            height: 28px;
            margin-right: 14px;
            border: 2px solid #888888;
            border-radius: 50%;
            background: transparent;
            position: relative;
            cursor: pointer;
        }

        .task-checkbox.done {
            border-color: #777777;
            background: #777777;
        }

        .task-checkbox.done::after {
            content: "";
            position: absolute;
            left: 7px;
            top: 3px;
            width: 7px;
            height: 13px;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            transform: rotate(45deg);
        }

        .task-content {
            min-width: 0;
            flex: 1;
        }

        .task-title {
            font-size: 1.3rem;
            line-height: 1.35;
            font-weight: 500;
            word-break: break-word;
        }

        .task-date {
            margin-top: 4px;
            font-size: 0.9rem;
            color: #999999;
        }

        .task-date.overdue {
            color: #ff7777;
        }

        .task-date.today {
            color: #ffb74d;
        }

        .task-date.tomorrow {
            color: #81c784;
        }

        .empty {
            padding: 50px 20px;
            text-align: center;
            color: #777777;
            font-size: 1.1rem;
        }

        /* =========================
           Status
        ========================= */

        .status {
            margin-top: 14px;
            text-align: center;
            font-size: 0.8rem;
            color: #666666;
            min-height: 18px;
        }

        /* =========================
           Login overlay
        ========================= */

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #121212;
        }

        .login-box {
            width: min(420px, 100%);
            padding: 30px;
            border-radius: 18px;
            background: #1e1e1e;
            text-align: center;
        }

        .login-title {
            margin-bottom: 10px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .login-description {
            margin-bottom: 24px;
            color: #999999;
            line-height: 1.6;
        }

        .login-button {
            width: 100%;
            min-height: 50px;
            border-radius: 12px;
            background: #ffffff;
            color: #111111;
            font-size: 1rem;
            font-weight: 600;
        }

        .login-button:active {
            opacity: 0.8;
        }

        /* =========================
           Desktop
        ========================= */

        @media (min-width: 700px) {
            .app {
                max-width: 900px;
                margin: 0 auto;
                padding: 24px;
            }

            .task {
                min-height: 76px;
                padding: 14px 18px;
            }

            .task-title {
                font-size: 1.35rem;
            }
        }
    </style>
</head>

<body>

<div id="loginOverlay" class="overlay">
    <div class="login-box">
        <div class="login-title">Tasks Dashboard</div>

        <div class="login-description">
            登入 Google 帳戶後<br>
            會自動同步你的 Google Tasks
        </div>

        <button id="overlayLoginButton" class="login-button">
            使用 Google 登入
        </button>
    </div>
</div>

<div class="app">

    <div class="header">

        <div class="header-left">
            <div class="title">Tasks</div>
            <div id="clock" class="clock">--:--</div>
        </div>

        <div class="header-right">

            <button id="syncButton"
                    class="header-button">
                同步
            </button>

            <button id="fullscreenButton"
                    class="header-button">
                全螢幕
            </button>

            <button id="loginButton"
                    class="header-button">
                登入
            </button>

            <button id="logoutButton"
                    class="header-button logout-button">
                登出
            </button>

        </div>

    </div>

    <div id="tasks"></div>

    <div id="status" class="status"></div>

</div>

<script>

    /* =========================================================
       Google 設定
    ========================================================= */

    const CLIENT_ID =
        "710651032876-n8m8m7g3rhne9f2r3m0b78vkoqh18lhl.apps.googleusercontent.com";

    const GOOGLE_SCOPE =
        "https://www.googleapis.com/auth/tasks";

    const API_BASE =
        "https://tasks.googleapis.com/tasks/v1";

    const SYNC_INTERVAL =
        5000;


    /* =========================================================
       狀態
    ========================================================= */

    let googleTokenClient = null;

    let accessToken = null;

    let tokenExpiry = 0;

    let tasksData = [];

    let syncTimer = null;

    let syncing = false;


    /* =========================================================
       DOM
    ========================================================= */

    const tasksElement =
        document.getElementById("tasks");

    const statusElement =
        document.getElementById("status");

    const loginButton =
        document.getElementById("loginButton");

    const logoutButton =
        document.getElementById("logoutButton");

    const syncButton =
        document.getElementById("syncButton");

    const fullscreenButton =
        document.getElementById("fullscreenButton");

    const loginOverlay =
        document.getElementById("loginOverlay");

    const overlayLoginButton =
        document.getElementById("overlayLoginButton");

    const clockElement =
        document.getElementById("clock");


    /* =========================================================
       時鐘
    ========================================================= */

    function updateClock() {

        const now = new Date();

        const hours =
            String(now.getHours()).padStart(2, "0");

        const minutes =
            String(now.getMinutes()).padStart(2, "0");

        clockElement.textContent =
            `${hours}:${minutes}`;
    }

    updateClock();

    setInterval(updateClock, 1000);


    /* =========================================================
       Google OAuth
    ========================================================= */

    function initGoogle() {

        if (
            typeof google === "undefined" ||
            !google.accounts ||
            !google.accounts.oauth2
        ) {
            statusElement.textContent =
                "Google 登入元件載入失敗";

            return;
        }

        googleTokenClient =
            google.accounts.oauth2.initTokenClient({

                client_id: CLIENT_ID,

                scope: GOOGLE_SCOPE,

                callback: handleGoogleToken
            });
    }


    function login() {

        if (!googleTokenClient) {

            statusElement.textContent =
                "Google 登入尚未準備好";

            return;
        }

        googleTokenClient.requestAccessToken({
            prompt: "consent"
        });
    }


    function handleGoogleToken(response) {

        if (!response || !response.access_token) {

            statusElement.textContent =
                "Google 登入失敗";

            return;
        }

        accessToken =
            response.access_token;

        tokenExpiry =
            Date.now() +
            ((response.expires_in || 3600) * 1000);

        loginOverlay.style.display =
            "none";

        loginButton.style.display =
            "none";

        logoutButton.style.display =
            "block";

        statusElement.textContent =
            "已登入";

        startAutoSync();

        syncTasks();
    }


    /* =========================================================
       API Request
    ========================================================= */

    async function googleFetch(url, options = {}) {

        if (!accessToken) {
            throw new Error("NO_TOKEN");
        }

        const headers =
            new Headers(options.headers || {});

        headers.set(
            "Authorization",
            `Bearer ${accessToken}`
        );

        headers.set(
            "Content-Type",
            "application/json"
        );

        const response =
            await fetch(url, {
                ...options,
                headers
            });

        if (response.status === 401) {

            accessToken = null;

            stopAutoSync();

            loginOverlay.style.display =
                "flex";

            loginButton.style.display =
                "block";

            logoutButton.style.display =
                "none";

            throw new Error("TOKEN_EXPIRED");
        }

        if (!response.ok) {

            const text =
                await response.text();

            throw new Error(
                `HTTP ${response.status}: ${text}`
            );
        }

        return response;
    }


    /* =========================================================
       取得 Google Tasks
    ========================================================= */

    async function getTasks() {

        let allTasks = [];

        let pageToken = "";

        do {

            let url =
                `${API_BASE}/lists/@default/tasks` +
                `?showCompleted=false` +
                `&showDeleted=false` +
                `&maxResults=100`;

            if (pageToken) {

                url +=
                    `&pageToken=${encodeURIComponent(pageToken)}`;
            }

            const response =
                await googleFetch(url);

            const data =
                await response.json();

            if (Array.isArray(data.items)) {

                allTasks =
                    allTasks.concat(data.items);
            }

            pageToken =
                data.nextPageToken || "";

        } while (pageToken);

        return allTasks;
    }


    /* =========================================================
       判斷 Task 有冇變化
    ========================================================= */

    function sameTasks(a, b) {

        if (a.length !== b.length) {
            return false;
        }

        for (let i = 0; i < a.length; i++) {

            const x = a[i];

            const y = b[i];

            if (
                x.id !== y.id ||
                x.title !== y.title ||
                x.notes !== y.notes ||
                x.status !== y.status ||
                x.updated !== y.updated ||
                x.due !== y.due ||
                x.position !== y.position
            ) {
                return false;
            }
        }

        return true;
    }


    /* =========================================================
       同步
    ========================================================= */

    async function syncTasks() {

        if (!accessToken || syncing) {
            return;
        }

        if (Date.now() >= tokenExpiry) {
            return;
        }

        syncing = true;

        try {

            const newTasks =
                await getTasks();

            if (!sameTasks(tasksData, newTasks)) {

                tasksData =
                    newTasks;

                renderTasks();
            }

            statusElement.textContent =
                `最後同步 ${formatTime(new Date())}`;

        } catch (error) {

            console.error(error);

            if (
                error.message !== "TOKEN_EXPIRED"
            ) {

                statusElement.textContent =
                    "同步失敗";
            }

        } finally {

            syncing = false;
        }
    }


    /* =========================================================
       ⭐ 排序
       
       1. 過期
       2. 今日
       3. 明日
       4. 其他日期，由近至遠
       5. 沒有日期
       
       同一日期保持 Google Tasks 原本順序
    ========================================================= */

    function sortTasks(tasks) {

        return [...tasks].sort((a, b) => {

            /* 沒日期 */

            if (!a.due && !b.due) {
                return 0;
            }

            if (!a.due) {
                return 1;
            }

            if (!b.due) {
                return -1;
            }


            /* 有日期 */

            const dateA =
                new Date(a.due);

            const dateB =
                new Date(b.due);


            /* 直接按時間由近至遠 */

            return dateA - dateB;
        });
    }


    /* =========================================================
       Render
    ========================================================= */

    function renderTasks() {

        tasksElement.innerHTML = "";

        const sortedTasks =
            sortTasks(tasksData);


        if (sortedTasks.length === 0) {

            const empty =
                document.createElement("div");

            empty.className =
                "empty";

            empty.textContent =
                "沒有未完成工作";

            tasksElement.appendChild(empty);

            return;
        }


        sortedTasks.forEach(task => {

            const card =
                document.createElement("div");

            card.className =
                "task";


            /* Checkbox */

            const checkbox =
                document.createElement("div");

            checkbox.className =
                "task-checkbox";


            /* Task 內容 */

            const content =
                document.createElement("div");

            content.className =
                "task-content";


            /* 標題 */

            const title =
                document.createElement("div");

            title.className =
                "task-title";

            title.textContent =
                task.title || "(沒有標題)";


            /* 日期 */

            const date =
                document.createElement("div");

            const dateInfo =
                getTaskDate(task);


            if (dateInfo) {

                date.className =
                    `task-date ${dateInfo.type}`;

                date.textContent =
                    dateInfo.text;

            } else {

                date.className =
                    "task-date";

                date.style.display =
                    "none";
            }


            content.appendChild(title);

            content.appendChild(date);


            card.appendChild(checkbox);

            card.appendChild(content);

            tasksElement.appendChild(card);


            /* 點擊完成 */

            checkbox.addEventListener(
                "click",
                () => completeTask(
                    task,
                    card,
                    checkbox
                )
            );
        });
    }


    /* =========================================================
       日期顯示
    ========================================================= */

    function getTaskDate(task) {

        if (!task.due) {
            return null;
        }

        const due =
            new Date(task.due);

        const now =
            new Date();


        /* 清除時間，只比較日期 */

        const dueDay =
            new Date(
                due.getFullYear(),
                due.getMonth(),
                due.getDate()
            );

        const today =
            new Date(
                now.getFullYear(),
                now.getMonth(),
                now.getDate()
            );

        const tomorrow =
            new Date(today);

        tomorrow.setDate(
            tomorrow.getDate() + 1
        );


        const diff =
            Math.round(
                (dueDay - today) /
                86400000
            );


        const dateText =
            `${due.getMonth() + 1}/${due.getDate()}`;


        if (diff < 0) {

            return {
                text: `已過期 · ${dateText}`,
                type: "overdue"
            };
        }


        if (diff === 0) {

            return {
                text: `今日 · ${dateText}`,
                type: "today"
            };
        }


        if (diff === 1) {

            return {
                text: `明日 · ${dateText}`,
                type: "tomorrow"
            };
        }


        return {
            text: dateText,
            type: "normal"
        };
    }


    /* =========================================================
       完成 Task
    ========================================================= */

    async function completeTask(
        task,
        card,
        checkbox
    ) {

        if (
            card.className.includes("fading")
        ) {
            return;
        }


        /* 立即反映 UI */

        checkbox.className =
            "task-checkbox done";

        card.className =
            "task fading";


        try {

            const url =
                `${API_BASE}/lists/@default/tasks/${encodeURIComponent(task.id)}`;


            await googleFetch(
                url,
                {
                    method: "PATCH",

                    body: JSON.stringify({
                        status: "completed"
                    })
                }
            );


            /* 本地立即移除 */

            tasksData =
                tasksData.filter(
                    item => item.id !== task.id
                );


            setTimeout(() => {

                renderTasks();

            }, 250);


        } catch (error) {

            console.error(error);


            /* 失敗就還原 */

            checkbox.className =
                "task-checkbox";

            card.className =
                "task";


            statusElement.textContent =
                "完成 Task 失敗";
        }
    }


    /* =========================================================
       自動同步
    ========================================================= */

    function startAutoSync() {

        stopAutoSync();

        syncTimer =
            setInterval(
                syncTasks,
                SYNC_INTERVAL
            );
    }


    function stopAutoSync() {

        if (syncTimer) {

            clearInterval(syncTimer);

            syncTimer = null;
        }
    }


    /* =========================================================
       時間
    ========================================================= */

    function formatTime(date) {

        const h =
            String(
                date.getHours()
            ).padStart(2, "0");

        const m =
            String(
                date.getMinutes()
            ).padStart(2, "0");

        return `${h}:${m}`;
    }


    /* =========================================================
       手動同步
    ========================================================= */

    syncButton.addEventListener(
        "click",
        () => {

            if (!accessToken) {

                login();

                return;
            }

            syncTasks();
        }
    );


    /* =========================================================
       Login
    ========================================================= */

    loginButton.addEventListener(
        "click",
        login
    );


    overlayLoginButton.addEventListener(
        "click",
        login
    );


    /* =========================================================
       Logout
    ========================================================= */

    logoutButton.addEventListener(
        "click",
        () => {

            accessToken = null;

            tokenExpiry = 0;

            tasksData = [];

            stopAutoSync();

            tasksElement.innerHTML = "";

            loginOverlay.style.display =
                "flex";

            loginButton.style.display =
                "block";

            logoutButton.style.display =
                "none";

            statusElement.textContent =
                "已登出";
        }
    );


    /* =========================================================
       全螢幕
    ========================================================= */

    fullscreenButton.addEventListener(
        "click",
        async () => {

            try {

                if (!document.fullscreenElement) {

                    await document.documentElement.requestFullscreen();

                } else {

                    await document.exitFullscreen();
                }

            } catch (error) {

                console.error(error);
            }
        }
    );


    /* =========================================================
       網絡恢復
    ========================================================= */

    window.addEventListener(
        "online",
        () => {

            if (accessToken) {
                syncTasks();
            }
        }
    );


    /* =========================================================
       App 回到前景
    ========================================================= */

    document.addEventListener(
        "visibilitychange",
        () => {

            if (
                document.visibilityState === "visible" &&
                accessToken
            ) {
                syncTasks();
            }
        }
    );


    /* =========================================================
       初始化
    ========================================================= */

    initGoogle();

</script>

</body>
</html>
