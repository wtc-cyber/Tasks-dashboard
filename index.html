<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mate 10 Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 20px;
      height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #333;
    }
    .time {
      font-size: 2.5rem;
      font-weight: bold;
    }
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      height: calc(100vh - 100px);
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .card-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: #4facfe;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .scroll-list {
      flex: 1;
      overflow-y: auto;
    }
    .item-card {
      background: #2a2a2a;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .item-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .item-sub {
      font-size: 0.85rem;
      color: #aaa;
    }
    .empty-tip {
      color: #666;
      font-size: 0.9rem;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="time" id="clockDisplay">00:00</div>
    <div id="statusTag" style="color: #4cd964; font-size: 0.9rem;">● 系統運作中</div>
  </div>

  <div class="dashboard-grid">
    <!-- 行程日曆 -->
    <div class="card">
      <div class="card-title">📅 7 天行程 (Calendar)</div>
      <div class="scroll-list" id="calendarScroll">
        <div class="empty-tip">載入中...</div>
      </div>
    </div>

    <!-- 待辦事項 -->
    <div class="card">
      <div class="card-title">☑ 待辦事項 (Tasks)</div>
      <div class="scroll-list" id="taskScroll">
        <div class="empty-tip">載入中...</div>
      </div>
    </div>

    <!-- Gmail 未讀 -->
    <div class="card">
      <div class="card-title">✉ 未讀電郵 (Gmail)</div>
      <div class="scroll-list" id="mailScroll">
        <div class="empty-tip">載入中...</div>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ 請填入你在 Step 3 部署 GAS 得到的網址
    const GAS_API_URL = "https://script.google.com/macros/s/你的_GAS_DEPLOYMENT_ID/exec";

    // 1. 時鐘功能
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clockDisplay').textContent = `${hours}:${mins}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. 自動向 GAS 抓取資料 (免登入、永遠不會過期)
    async function syncAllData() {
      const statusEl = document.getElementById("statusTag");
      try {
        statusEl.textContent = "🔄 更新中...";
        statusEl.style.color = "#ffcc00";

        const res = await fetch(GAS_API_URL);
        const data = await res.json();

        renderCalendar(data.calendar || []);
        renderTasks(data.tasks || []);
        renderGmail(data.gmail || []);

        statusEl.textContent = "● 自動同步正常";
        statusEl.style.color = "#4cd964";
      } catch (err) {
        console.error("同步失敗:", err);
        statusEl.textContent = "⚠️ 讀取失敗";
        statusEl.style.color = "#ff3b30";
      }
    }

    // 3. 渲染 Functions
    function renderCalendar(events) {
      const el = document.getElementById("calendarScroll");
      if (!events.length) {
        el.innerHTML = '<div class="empty-tip">未來 7 天沒有行程</div>';
        return;
      }
      el.innerHTML = events.map(e => {
        const timeStr = e.isAllDay ? "全日" : new Date(e.start).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        return `
          <div class="item-card">
            <div class="item-title">${escapeHtml(e.title)}</div>
            <div class="item-sub">🕒 ${timeStr}</div>
          </div>
        `;
      }).join('');
    }

    function renderTasks(tasks) {
      const el = document.getElementById("taskScroll");
      if (!tasks.length) {
        el.innerHTML = '<div class="empty-tip">沒有未完成的待辦事項</div>';
        return;
      }
      el.innerHTML = tasks.map(t => `
        <div class="item-card">
          <div class="item-title">${escapeHtml(t.title)}</div>
        </div>
      `).join('');
    }

    function renderGmail(mails) {
      const el = document.getElementById("mailScroll");
      if (!mails.length) {
        el.innerHTML = '<div class="empty-tip">沒有主要未讀電郵</div>';
        return;
      }
      el.innerHTML = mails.map(m => `
        <div class="item-card">
          <div class="item-title">${escapeHtml(m.subject || "無主旨")}</div>
          <div class="item-sub">👤 ${escapeHtml(m.from)}</div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // 4. 啟動：立即抓取，並設為每 15 分鐘自動刷新一次
    syncAllData();
    setInterval(syncAllData, 15 * 60 * 1000);
  </script>
</body>
</html>
