<!DOCTYPE html>
<html lang="zh-HK">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">


<meta name="theme-color" content="#121212">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">


<title>Task Dashboard V2</title>


<script src="https://accounts.google.com/gsi/client" async defer></script>


<style>

/* ==========================
   BASE
========================== */

*{
    box-sizing:border-box;
    user-select:none;
}


html,body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#121212;
    color:#eeeeee;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Microsoft JhengHei",
    sans-serif;
}


body{

    position:fixed;

}


/* ==========================
   APP
========================== */


.app{

    height:100vh;
    width:100%;

    display:flex;
    flex-direction:column;

}


/* ==========================
   HEADER
========================== */


.header{

    height:65px;

    flex-shrink:0;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:8px 12px;

    background:#181818;

    border-bottom:1px solid #333;

}


.header-left{

    display:flex;

    align-items:center;

    gap:15px;

}


.title{

    font-size:1.15rem;

    font-weight:700;

}


.clock{

    font-size:1.5rem;

    font-weight:700;

    line-height:1;

}



.info{

    font-size:.8rem;

    color:#aaa;

}




.header-right{

    display:flex;

    gap:6px;

}



button{

    background:#252525;

    color:white;

    border:0;

    border-radius:8px;

    padding:8px 12px;

    font-size:.8rem;

}



button:active{

    transform:scale(.95);

}



/* ==========================
   MAIN GRID
========================== */


.dashboard{


    flex:1;

    min-height:0;


    display:grid;


    grid-template-columns:

    35% 45% 20%;


    gap:10px;


    padding:10px;


}





/* ==========================
   PANEL
========================== */


.panel{


    background:#1e1e1e;


    border-radius:12px;


    overflow:hidden;


    display:flex;

    flex-direction:column;


    min-width:0;


}



.panel-header{


    height:40px;


    flex-shrink:0;


    display:flex;


    justify-content:space-between;


    align-items:center;


    padding:0 12px;


    border-bottom:1px solid #333;


}



.panel-title{


    font-weight:700;

    font-size:.95rem;

}



.update-time{


    font-size:.62rem;

    color:#888;

}



.panel-body{


    flex:1;

    overflow-y:auto;

    padding:8px;

}




.empty{


    height:100%;


    display:flex;


    justify-content:center;


    align-items:center;


    color:#777;

}





/* ==========================
 TASK
========================== */


.task-item{


    display:flex;


    align-items:center;


    gap:12px;


    padding:10px;


    margin-bottom:8px;


    background:#252525;


    border-radius:10px;


    transition:.25s;


}




.task-check{


    width:28px;

    height:28px;

}




.task-title{


    font-size:1.05rem;

    line-height:1.3;

}




/* ==========================
 SCHEDULE
========================== */


.schedule-item{


    background:#252525;


    padding:10px;


    border-radius:10px;


    margin-bottom:8px;


}



.schedule-item.now{


    border:2px solid #888;


}




.schedule-item.past{


    opacity:.35;


}




.schedule-time{


    font-size:.75rem;

    color:#aaa;


}



.schedule-main{


    font-size:1.15rem;

    font-weight:bold;

    margin-top:4px;


}



.schedule-detail{


    margin-top:6px;


    font-size:.85rem;

    color:#ccc;


}





/* ==========================
 EMAIL
========================== */


.email-item{


    background:#252525;


    border-radius:8px;


    padding:8px;


    margin-bottom:7px;


}



.email-from{


    color:#999;


    font-size:.65rem;


}



.email-title{


    font-size:.85rem;


    margin-top:4px;


}





/* ==========================
 WORK OFF
========================== */


.workoff{


    display:none;


    flex:1;


    justify-content:center;


    align-items:center;


    text-align:center;


}



.workoff.active{


    display:flex;


}




.workoff-title{


    font-size:3rem;


    font-weight:800;


}



.workoff-message{


    margin-top:15px;


    font-size:1.2rem;


    color:#aaa;


}



/* ==========================
 MOBILE / MATE 10
========================== */


@media(max-width:800px){

.title{

font-size:1rem;

}

button{

padding:6px 8px;

}


}



</style>

</head>


<body>


<div class="app">


<header class="header">


<div class="header-left">


<div>


<div class="title">

📋 Task Dashboard V2

</div>


<div class="clock" id="clock">

00:00

</div>


</div>


<div class="info">


🌤️ <span id="weather">--</span>

<br>

AQHI <span id="aqhi">--</span>


</div>


</div>



<div class="header-right">


<button id="loginBtn">

登入

</button>


<button id="syncBtn">

↻

</button>


<button id="fullscreenBtn">

⛶

</button>


<button id="workBtn">

🌙

</button>


<button id="resumeBtn" style="display:none">

☀️

</button>


</div>


</header>





<div class="dashboard">



<!-- TASK -->

<section class="panel">


<div class="panel-header">


<div class="panel-title">

✅ Tasks

</div>


<div class="update-time" id="taskUpdate">

--

</div>


</div>


<div class="panel-body" id="taskList">


<div class="empty">

等待登入

</div>


</div>


</section>





<!-- SCHEDULE -->


<section class="panel">


<div class="panel-header">


<div class="panel-title">

🏫 Schedule

</div>


<div class="update-time" id="scheduleUpdate">

--

</div>


</div>


<div class="panel-body" id="scheduleList">


<div class="empty">

載入課表

</div>


</div>


</section>





<!-- EMAIL -->


<section class="panel">


<div class="panel-header">


<div class="panel-title">

✉️ Email

</div>


<div class="update-time" id="emailUpdate">

--

</div>


</div>


<div class="panel-body" id="emailList">


<div class="empty">

等待資料

</div>


</div>


</section>



</div>






<div class="workoff" id="workoff">


<div>


<div class="workoff-title">

🌙 已收工

</div>


<div class="workoff-message">

今日工作到此為止，祝您有個愉快的晚上。

</div>


</div>


</div>





</div>


<script>

/* ==========================
   GOOGLE CONFIG
========================== */


const CLIENT_ID =
"710651032876-n8m8m7g3rhne9f2r3m0b78vkoqh18lhl.apps.googleusercontent.com";


const TASK_SCOPE =
"https://www.googleapis.com/auth/tasks";


const SCHEDULE_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTsQx-iaBuir-NFhfq75miYTkRHi_HgoTy1bcmQWKL957yJj1VPKQlQN_5A1sONCTmMu2y3cP6WutcL/pub?gid=1147875770&single=true&output=csv";



let accessToken=null;

let tokenClient=null;



/* ==========================
   ELEMENT
========================== */


const clock =
document.getElementById("clock");


const taskList =
document.getElementById("taskList");


const taskUpdate =
document.getElementById("taskUpdate");


const scheduleList =
document.getElementById("scheduleList");


const scheduleUpdate =
document.getElementById("scheduleUpdate");


const loginBtn =
document.getElementById("loginBtn");


const syncBtn =
document.getElementById("syncBtn");


const fullscreenBtn =
document.getElementById("fullscreenBtn");


const workBtn =
document.getElementById("workBtn");


const resumeBtn =
document.getElementById("resumeBtn");


const workoff =
document.getElementById("workoff");



let taskTimer;


/* ==========================
   CLOCK
========================== */


function updateClock(){

const now=new Date();

clock.textContent=

now.toLocaleTimeString(
"zh-HK",
{
hour:"2-digit",
minute:"2-digit"
}
);

}


setInterval(updateClock,1000);

updateClock();



/* ==========================
   GOOGLE LOGIN
========================== */


function initGoogle(){


if(!window.google){

setTimeout(initGoogle,500);

return;

}



tokenClient=

google.accounts.oauth2.initTokenClient({

client_id:CLIENT_ID,

scope:TASK_SCOPE,


callback:(response)=>{


if(response.error){

console.log(response);

return;

}


accessToken=response.access_token;


loginBtn.textContent="已登入";


loadTasks();


startTaskSync();


}


});


}



initGoogle();



loginBtn.onclick=()=>{


if(tokenClient){

tokenClient.requestAccessToken({

prompt:"consent"

});

}


};




/* ==========================
   GOOGLE API
========================== */


async function googleFetch(url,options={}){


const res=

await fetch(url,{

...options,

headers:{

"Authorization":

"Bearer "+accessToken,


"Content-Type":

"application/json"

}

});



if(res.status===401){

accessToken=null;

loginBtn.textContent="重新登入";

alert("Google 登入已過期");

throw new Error("Token expired");

}


return res;


}



/* ==========================
   TASK LOAD
========================== */


async function loadTasks(){


if(!accessToken)return;


try{


const url=

"https://tasks.googleapis.com/tasks/v1/lists/@default/tasks?showCompleted=false&showDeleted=false&maxResults=100";



const res=

await googleFetch(url);



const data=

await res.json();



renderTasks(data.items||[]);



taskUpdate.textContent=getTime();



}catch(e){

console.log(e);

}


}





function renderTasks(tasks){


taskList.innerHTML="";



if(tasks.length===0){

taskList.innerHTML=

`
<div class="empty">
沒有待辦事項
</div>
`;

return;

}



tasks.forEach(task=>{


const div=

document.createElement("div");


div.className="task-item";



const box=

document.createElement("input");


box.type="checkbox";

box.className="task-check";


box.onclick=()=>{

completeTask(task.id,div);

};



const title=

document.createElement("div");


title.className="task-title";

title.textContent=task.title;



div.appendChild(box);

div.appendChild(title);


taskList.appendChild(div);


});


}




async function completeTask(id,element){



element.style.opacity="0";


setTimeout(()=>{

element.remove();

},250);



await googleFetch(

"https://tasks.googleapis.com/tasks/v1/lists/@default/tasks/"+id,

{

method:"PATCH",

body:JSON.stringify({

status:"completed"

})

}

);


}



function startTaskSync(){


if(taskTimer)

clearInterval(taskTimer);


taskTimer=

setInterval(()=>{

loadTasks();

},5000);


}





syncBtn.onclick=()=>{

loadTasks();

};





/* ==========================
   GOOGLE SHEET SCHEDULE
========================== */


async function loadSchedule(){


try{


const res=

await fetch(SCHEDULE_URL);



const csv=

await res.text();



const data=

parseCSV(csv);



renderSchedule(data);



scheduleUpdate.textContent=getTime();



}catch(e){

console.log(e);

}


}




function parseCSV(text){


const lines=

text.split("\n");


const headers=

lines.shift()
.split(",");



return lines.map(line=>{


const values=line.split(",");

let obj={};


headers.forEach((h,i)=>{

obj[h.trim()]=

(values[i]||"").trim();

});


return obj;


});


}





function todayName(){


return [

"Sun",

"Mon",

"Tue",

"Wed",

"Thu",

"Fri",

"Sat"

][new Date().getDay()];


}



function toMinute(time){


if(!time)return 9999;


const p=time.split(":");


return Number(p[0])*60+

Number(p[1]);


}





function renderSchedule(data){


const today=todayName();


const now=

new Date().getHours()*60+

new Date().getMinutes();



let list=

data.filter(x=>

x.Day===today

);



list.sort((a,b)=>

toMinute(a.Start)-toMinute(b.Start)

);



scheduleList.innerHTML="";



if(list.length===0){

scheduleList.innerHTML=

`
<div class="empty">
今日沒有課堂
</div>
`;

return;

}



list.forEach(item=>{


const start=

toMinute(item.Start);


const end=

toMinute(item.End);



const active=

now>=start && now<=end;


const past=

now>end;



const div=

document.createElement("div");


div.className="schedule-item";



if(active)

div.classList.add("now");


if(past)

div.classList.add("past");



let icon=

item.Type==="PE"

?"🏃"

:

item.Type==="CT"

?"📘"

:

"📚";



div.innerHTML=

`

<div class="schedule-time">

${item.Start} - ${item.End}

</div>


<div class="schedule-main">

${active?"🟢 NOW ":""}

第${item.Period}節 ${item.Class}

</div>


<div class="schedule-detail">

${icon} ${item.Type}

<br>

👤 ${item.Teacher}

${item.Location?

"<br>📍 "+item.Location:""}

</div>

`;



scheduleList.appendChild(div);



});


}



loadSchedule();



setInterval(loadSchedule,300000);





/* ==========================
   FULLSCREEN
========================== */


fullscreenBtn.onclick=()=>{


if(!document.fullscreenElement){


document.documentElement.requestFullscreen();


}else{


document.exitFullscreen();


}


};






/* ==========================
   WORK OFF MODE
========================== */


workBtn.onclick=()=>{


document.querySelector(".dashboard")

.style.display="none";


workoff.classList.add("active");


workBtn.style.display="none";


resumeBtn.style.display="block";


};



resumeBtn.onclick=()=>{


document.querySelector(".dashboard")

.style.display="grid";


workoff.classList.remove("active");


workBtn.style.display="block";


resumeBtn.style.display="none";


};






/* ==========================
   TIME FORMAT
========================== */


function getTime(){


const now=new Date();


return now.toLocaleTimeString(

"zh-HK",

{

hour:"2-digit",

minute:"2-digit"

}

);


}




</script>


</body>

</html>
