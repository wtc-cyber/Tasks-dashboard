<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <!-- PWA / Mobile -->
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Task Dashboard">

    <title>Task Dashboard</title>

    <!-- Google Identity Services -->
    <script
        src="https://accounts.google.com/gsi/client"
        async
        defer>
    </script>

    <style>
        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: #121212;
            color: #ffffff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                "Microsoft JhengHei",
                Arial,
                sans-serif;

            user-select: none;
            -webkit-user-select: none;
        }

        body {
            overflow-x: hidden;
        }

        button {
            font-family: inherit;
        }


        /* =========================================================
           APP
        ========================================================= */

        #app {
            width: 100%;
            min-height: 100vh;
            background: #121212;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        .header {
            position: sticky;
            top: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-between;

            min-height: 80px;

            padding:
                12px 18px;

            background: #121212;

            border-bottom:
                1px solid #292929;
        }

        .header-left {
            display: flex;
            align-items: center;

            gap: 18px;

            min-width: 0;
        }

        .title {
            margin: 0;

            font-size: 1.7rem;
            font-weight: 700;

            line-height: 1.1;

            white-space: nowrap;
        }

        .clock {
            color: #bbbbbb;

            font-size: 1.55rem;
            font-weight: 500;

            font-variant-numeric: tabular-nums;

            white-space: nowrap;
        }

        .header-right {
            display: flex;
            align-items: center;

            gap: 8px;
        }

        .header-button {
            min-height: 44px;

            padding:
                8px 13px;

            border:
                1px solid #3a3a3a;

            border-radius: 9px;

            background: #1e1e1e;
            color: #ffffff;

            font-size: 0.95rem;

            cursor: pointer;
        }

        .header-button:active {
            background: #303030;
        }

        .header-button:disabled {
            opacity: 0.4;
            cursor: default;
        }


        /* =========================================================
           STATUS BAR
        ========================================================= */

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;

            min-height: 36px;

            padding:
                6px 18px;

            background: #151515;

            border-bottom:
                1px solid #202020;

            color: #888888;

            font-size: 0.82rem;
        }

        .status-left {
            display: flex;
            align-items: center;

            gap: 7px;

            min-width: 0;
        }

        .status-dot {
            width: 8px;
            height: 8px;

            flex: 0 0 8px;

            border-radius: 50%;

            background: #666666;
        }

        .status-dot.online {
            background: #6e9b6e;
        }

        .status-dot.error {
            background: #a75f5f;
        }


        /* =========================================================
           MAIN
        ========================================================= */

        .main {
            width: 100%;
            max-width: 900px;

            margin: 0 auto;

            padding: 18px;
        }


        /* =========================================================
           LOGIN PANEL
        ========================================================= */

        .login-panel {
            margin-top: 35px;

            padding:
                30px 22px;

            text-align: center;

            background: #1e1e1e;

            border:
                1px solid #292929;

            border-radius: 14px;
        }

        .login-panel h2 {
            margin:
                0 0 12px;

            font-size: 1.5rem;
        }

        .login-panel p {
            margin:
                0 0 25px;

            color: #999999;

            line-height: 1.6;
        }

        .login-button {
            min-width: 180px;
            min-height: 52px;

            padding:
                10px 20px;

            border:
                1px solid #444444;

            border-radius: 10px;

            background: #292929;
            color: #ffffff;

            font-size: 1.05rem;

            cursor: pointer;
        }

        .login-button:active {
            background: #383838;
        }


        /* =========================================================
           TASK LIST
        ========================================================= */

        .task-list {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        /* =========================================================
           TASK CARD
        ========================================================= */

        .task-card {
            display: flex;

            align-items: center;

            width: 100%;

            min-height: 70px;

            padding:
                12px 14px;

            background: #1e1e1e;

            border:
                1px solid #292929;

            border-radius: 11px;

            transition:
                opacity 0.32s ease,
                transform 0.32s ease,
                max-height 0.32s ease,
                margin 0.32s ease,
                padding 0.32s ease;
        }

        .task-card.removing {
            opacity: 0;

            transform:
                translateX(35px);

            max-height: 0;

            min-height: 0;

            margin-top: -10px;

            padding-top: 0;
            padding-bottom: 0;

            overflow: hidden;
        }


        /* =========================================================
           CHECKBOX
        ========================================================= */

        .task-checkbox {
            position: relative;

            flex:
                0 0 28px;

            width: 28px;
            height: 28px;

            margin-right: 15px;

            padding: 0;

            border:
                2px solid #888888;

            border-radius: 7px;

            background: #151515;

            cursor: pointer;
        }

        .task-checkbox:active {
            background: #303030;
        }

        .task-checkbox:disabled {
            cursor: default;
        }

        .task-checkbox.checked {
            background: #666666;

            border-color:
                #888888;
        }

        .task-checkbox.checked::after {
            content: "✓";

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -53%);

            color: #ffffff;

            font-size: 20px;
            font-weight: bold;
        }


        /* =========================================================
           TASK CONTENT
        ========================================================= */

        .task-content {
            flex: 1;

            min-width: 0;
        }

        .task-title {
            margin: 0;

            color: #f2f2f2;

            font-size: 1.3rem;

            line-height: 1.35;

            font-weight: 500;

            word-break: break-word;
        }

        .task-notes {
            margin-top: 4px;

            color: #888888;

            font-size: 0.85rem;

            line-height: 1.3;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .task-date {
            margin-left: 10px;

            color: #777777;

            font-size: 0.78rem;

            white-space: nowrap;
        }


        /* =========================================================
           EMPTY / LOADING
        ========================================================= */

        .message-panel {
            padding:
                50px 20px;

            text-align: center;

            color: #888888;

            font-size: 1.05rem;
        }

        .message-icon {
            margin-bottom: 12px;

            font-size: 2rem;

            opacity: 0.7;
        }


        /* =========================================================
           LOADING SPINNER
        ========================================================= */

        .loading {
            display: inline-block;

            width: 22px;
            height: 22px;

            border:
                3px solid #444444;

            border-top-color:
                #aaaaaa;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }


        /* =========================================================
           TOAST
        ========================================================= */

        .toast {
            position: fixed;

            left: 50%;
            bottom: 22px;

            z-index: 999;

            min-width: 200px;

            max-width:
                calc(100vw - 40px);

            padding:
                12px 17px;

            transform:
                translateX(-50%)
                translateY(20px);

            background: #252525;

            border:
                1px solid #383838;

            border-radius: 10px;

            color: #ffffff;

            text-align: center;

            font-size: 0.9rem;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
        }

        .toast.show {
            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 650px) {

            .header {
                min-height: 72px;

                padding:
                    9px 12px;
            }

            .header-left {
                gap: 10px;
            }

            .title {
                font-size: 1.35rem;
            }

            .clock {
                font-size: 1.2rem;
            }

            .header-right {
                gap: 5px;
            }

            .header-button {
                min-height: 42px;

                padding:
                    7px 9px;

                font-size: 0.8rem;
            }

            .status-bar {
                padding:
                    6px 12px;
            }

            .main {
                padding:
                    12px;
            }

            .task-card {
                min-height: 68px;

                padding:
                    11px;
            }

            .task-checkbox {
                flex-basis: 28px;

                width: 28px;
                height: 28px;

                margin-right: 12px;
            }

            .task-title {
                font-size: 1.18rem;
            }

            .task-date {
                display: none;
            }
        }


        /* =========================================================
           LANDSCAPE
           Mate 10 放桌面橫向使用時
        ========================================================= */

        @media (orientation: landscape) and (max-height: 500px) {

            .header {
                min-height: 62px;

                padding:
                    7px 14px;
            }

            .title {
                font-size: 1.3rem;
            }

            .clock {
                font-size: 1.15rem;
            }

            .status-bar {
                min-height: 29px;

                padding:
                    4px 14px;
            }

            .main {
                padding:
                    9px 14px;
            }

            .task-list {
                gap: 7px;
            }

            .task-card {
                min-height: 54px;

                padding:
                    7px 10px;
            }

            .task-checkbox {
                width: 26px;
                height: 26px;

                flex-basis: 26px;
            }

            .task-title {
                font-size: 1.08rem;
            }
        }
    </style>
</head>


<body>

<div id="app">

    <!-- =========================================================
         HEADER
    ========================================================== -->

    <header class="header">

        <div class="header-left">

            <h1 class="title">
                工作事項
            </h1>

            <div
                id="clock"
                class="clock">
                --:--
            </div>

        </div>


        <div class="header-right">

            <button
                id="syncButton"
                class="header-button"
                type="button"
                disabled>
                同步
            </button>

            <button
                id="authButton"
                class="header-button"
                type="button">
                登入
            </button>

        </div>

    </header>


    <!-- =========================================================
         STATUS
    ========================================================== -->

    <div class="status-bar">

        <div class="status-left">

            <span
                id="statusDot"
                class="status-dot">
            </span>

            <span
                id="statusText">
                尚未登入
            </span>

        </div>


        <div
            id="lastSync">
            --
        </div>

    </div>


    <!-- =========================================================
         MAIN
    ========================================================== -->

    <main class="main">

        <div id="content">

            <div class="login-panel">

                <h2>
                    Task Dashboard
                </h2>

                <p>
                    登入 Google 後顯示<br>
                    Google Tasks 未完成事項
                </p>

                <button
                    id="loginButton"
                    class="login-button"
                    type="button">
                    使用 Google 登入
                </button>

            </div>

        </div>

    </main>

</div>


<!-- =============================================================
     TOAST
============================================================== -->

<div
    id="toast"
    class="toast">
</div>


<script>

/* ================================================================
   TASK DASHBOARD
   Google Tasks + GIS
   Vanilla JavaScript
   ================================================================ */


/* ================================================================
   1. GOOGLE CLIENT ID
   ================================================================

   ★★★ 只需要改這裡 ★★★

   例如：

   const CLIENT_ID =
       '123456789012-abcdefghijklmnop.apps.googleusercontent.com';

================================================================ */

const CLIENT_ID =
    '710651032876-n8m8m7g3rhne9f2r3m0b78vkoqh18lhl.apps.googleusercontent.com';


/* ================================================================
   2. SETTINGS
================================================================ */


/*
   Google Tasks API Scope
*/

const SCOPES =
    'https://www.googleapis.com/auth/tasks';


/*
   Google Tasks API Base URL
*/

const TASKS_API =
    'https://tasks.googleapis.com/tasks/v1';


/*
   每 5 秒同步一次

   5000 = 5 秒
*/

const SYNC_INTERVAL =
    5000;


/*
   API 最多每次取 100 個 Task
*/

const MAX_RESULTS =
    100;


/* ================================================================
   3. GLOBAL STATE
================================================================ */


/*
   GIS Token Client
*/

let tokenClient =
    null;


/*
   Access Token
*/

let accessToken =
    null;


/*
   Token expiry timestamp
*/

let tokenExpiresAt =
    0;


/*
   本地 Task Array
*/

let tasks =
    [];


/*
   防止同一時間進行兩次同步
*/

let isSyncing =
    false;


/*
   自動同步 Timer
*/

let syncTimer =
    null;


/*
   Toast Timer
*/

let toastTimer =
    null;


/*
   正在完成的 Task ID

   防止使用者快速連按。
*/

const completingTaskIds =
    new Set();


/* ================================================================
   4. DOM
================================================================ */

const clockElement =
    document.getElementById(
        'clock'
    );


const contentElement =
    document.getElementById(
        'content'
    );


const authButton =
    document.getElementById(
        'authButton'
    );


const loginButton =
    document.getElementById(
        'loginButton'
    );


const syncButton =
    document.getElementById(
        'syncButton'
    );


const statusText =
    document.getElementById(
        'statusText'
    );


const statusDot =
    document.getElementById(
        'statusDot'
    );


const lastSyncElement =
    document.getElementById(
        'lastSync'
    );


const toastElement =
    document.getElementById(
        'toast'
    );


/* ================================================================
   5. CLOCK
================================================================ */

function updateClock() {

    const now =
        new Date();


    const hours =
        String(
            now.getHours()
        ).padStart(
            2,
            '0'
        );


    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            '0'
        );


    /*
       Dashboard 只顯示 HH:mm
    */

    clockElement.textContent =
        `${hours}:${minutes}`;
}


/*
   第一次立即更新
*/

updateClock();


/*
   每秒更新
*/

setInterval(
    updateClock,
    1000
);


/* ================================================================
   6. STATUS
================================================================ */

function setStatus(
    message,
    type = 'normal'
) {

    statusText.textContent =
        message;


    statusDot.className =
        'status-dot';


    if (type === 'online') {

        statusDot.classList.add(
            'online'
        );
    }


    if (type === 'error') {

        statusDot.classList.add(
            'error'
        );
    }
}


/* ================================================================
   7. TOAST
================================================================ */

function showToast(
    message
) {

    clearTimeout(
        toastTimer
    );


    toastElement.textContent =
        message;


    toastElement.classList.add(
        'show'
    );


    toastTimer =
        setTimeout(
            function () {

                toastElement.classList.remove(
                    'show'
                );

            },
            2500
        );
}


/* ================================================================
   8. GIS INITIALIZATION
================================================================ */

function initializeGoogle() {

    /*
       Google GIS script 可能尚未完成載入。

       如果未準備好，
       500ms 後再檢查。
    */

    if (
        typeof google === 'undefined' ||
        !google.accounts ||
        !google.accounts.oauth2
    ) {

        setTimeout(
            initializeGoogle,
            500
        );

        return;
    }


    /*
       檢查 Client ID。
    */

    if (
        CLIENT_ID.indexOf(
            'YOUR_GOOGLE_CLIENT_ID'
        ) !== -1
    ) {

        setStatus(
            '請先設定 Google Client ID',
            'error'
        );

        return;
    }


    /*
       建立 GIS Token Client。
    */

    tokenClient =
        google.accounts.oauth2.initTokenClient({

            client_id:
                CLIENT_ID,

            scope:
                SCOPES,

            callback:
                handleTokenResponse

        });


    setStatus(
        '準備登入'
    );
}


/*
   頁面載入後初始化。
*/

window.addEventListener(
    'load',
    initializeGoogle
);


/* ================================================================
   9. LOGIN
================================================================ */

function login() {

    /*
       GIS 未準備好。
    */

    if (!tokenClient) {

        showToast(
            'Google 登入元件尚未準備好'
        );

        return;
    }


    /*
       如果 Token 尚未過期，
       直接同步。
    */

    if (
        accessToken &&
        Date.now() < tokenExpiresAt
    ) {

        syncTasks(
            false
        );

        return;
    }


    /*
       Request Token。
    */

    tokenClient.requestAccessToken({

        prompt:
            'consent'

    });
}


/* ================================================================
   10. TOKEN RESPONSE
================================================================ */

function handleTokenResponse(
    response
) {

    if (!response) {

        setStatus(
            '登入失敗',
            'error'
        );

        return;
    }


    if (response.error) {

        console.error(
            'Google OAuth Error:',
            response
        );


        setStatus(
            'Google 登入失敗',
            'error'
        );


        showToast(
            'Google 登入失敗'
        );


        return;
    }


    /*
       保存 Access Token。
    */

    accessToken =
        response.access_token;


    /*
       Google 一般會提供 expires_in。

       預留 60 秒安全時間。
    */

    const expiresIn =
        Number(
            response.expires_in || 3600
        );


    tokenExpiresAt =
        Date.now() +
        Math.max(
            60,
            expiresIn - 60
        ) *
        1000;


    /*
       更新 UI。
    */

    authButton.textContent =
        '登出';


    syncButton.disabled =
        false;


    setStatus(
        '已登入 Google Tasks',
        'online'
    );


    /*
       立即同步。
    */

    syncTasks(
        true
    );


    /*
       啟動 5 秒同步。
    */

    startAutoSync();
}


/* ================================================================
   11. LOGOUT
================================================================ */

function logout() {

    /*
       如果有 Token，
       嘗試 revoke。
    */

    if (
        accessToken &&
        typeof google !== 'undefined' &&
        google.accounts &&
        google.accounts.oauth2
    ) {

        try {

            google.accounts.oauth2.revoke(
                accessToken,
                function () {}
            );

        } catch (error) {

            console.warn(
                'Token revoke error:',
                error
            );
        }
    }


    /*
       清除 State。
    */

    accessToken =
        null;


    tokenExpiresAt =
        0;


    tasks =
        [];


    completingTaskIds.clear();


    /*
       停止自動同步。
    */

    stopAutoSync();


    /*
       更新按鈕。
    */

    authButton.textContent =
        '登入';


    syncButton.disabled =
        true;


    /*
       更新 Status。
    */

    setStatus(
        '尚未登入'
    );


    lastSyncElement.textContent =
        '--';


    /*
       顯示登入畫面。
    */

    renderLogin();


    showToast(
        '已登出'
    );
}


/* ================================================================
   12. TOKEN EXPIRATION
================================================================ */

function handleTokenExpired() {

    accessToken =
        null;


    tokenExpiresAt =
        0;


    syncButton.disabled =
        true;


    authButton.textContent =
        '重新登入';


    setStatus(
        '登入已過期，請重新登入',
        'error'
    );


    showToast(
        '登入已過期，請重新登入'
    );


    stopAutoSync();
}


/* ================================================================
   13. API FETCH
================================================================ */

async function apiFetch(
    url,
    options = {}
) {

    /*
       Token 不存在。
    */

    if (!accessToken) {

        handleTokenExpired();

        throw new Error(
            'ACCESS_TOKEN_EXPIRED'
        );
    }


    /*
       本地 expiry 已到。
    */

    if (
        Date.now() >=
        tokenExpiresAt
    ) {

        handleTokenExpired();

        throw new Error(
            'ACCESS_TOKEN_EXPIRED'
        );
    }


    /*
       建立 Header。
    */

    const headers =
        Object.assign(
            {
                'Authorization':
                    'Bearer ' +
                    accessToken
            },

            options.headers || {}
        );


    /*
       發送 Request。
    */

    const response =
        await fetch(
            url,
            Object.assign(
                {},
                options,
                {
                    headers:
                        headers
                }
            )
        );


    /*
       Google API 回傳 401。

       即使本地 expiry 尚未到，
       也可能 Token 已被 Google 失效。
    */

    if (
        response.status === 401
    ) {

        handleTokenExpired();

        throw new Error(
            'ACCESS_TOKEN_EXPIRED'
        );
    }


    return response;
}


/* ================================================================
   14. GET TASKS
================================================================ */

async function fetchAllTasks() {

    let pageToken =
        '';


    let allTasks =
        [];


    /*
       Pagination Loop
    */

    do {

        let url =
            TASKS_API +
            '/lists/@default/tasks' +
            '?showCompleted=false' +
            '&showHidden=false' +
            '&maxResults=' +
            MAX_RESULTS;


        if (pageToken) {

            url +=
                '&pageToken=' +
                encodeURIComponent(
                    pageToken
                );
        }


        const response =
            await apiFetch(
                url
            );


        if (!response.ok) {

            const errorText =
                await response.text();


            throw new Error(
                'GET Tasks failed: ' +
                response.status +
                ' ' +
                errorText
            );
        }


        const data =
            await response.json();


        if (
            Array.isArray(
                data.items
            )
        ) {

            allTasks =
                allTasks.concat(
                    data.items
                );
        }


        pageToken =
            data.nextPageToken || '';


    } while (
        pageToken
    );


    return allTasks;
}


/* ================================================================
   15. TASK COMPARISON
================================================================ */


/*
   判斷兩個 Task Array 是否真正有變化。

   只有：

   - ID
   - Title
   - Notes
   - Status
   - Updated
   - Due
   - Position

   有改變才重新 Render。

   這可以避免 Mate 10 每 5 秒重畫一次畫面。
*/

function tasksAreEqual(
    oldTasks,
    newTasks
) {

    if (
        oldTasks.length !==
        newTasks.length
    ) {

        return false;
    }


    for (
        let i = 0;
        i < newTasks.length;
        i++
    ) {

        const oldTask =
            oldTasks[i];


        const newTask =
            newTasks[i];


        if (
            oldTask.id !==
            newTask.id
        ) {

            return false;
        }


        if (
            oldTask.title !==
            newTask.title
        ) {

            return false;
        }


        if (
            oldTask.notes !==
            newTask.notes
        ) {

            return false;
        }


        if (
            oldTask.status !==
            newTask.status
        ) {

            return false;
        }


        if (
            oldTask.updated !==
            newTask.updated
        ) {

            return false;
        }


        if (
            oldTask.due !==
            newTask.due
        ) {

            return false;
        }


        if (
            oldTask.position !==
            newTask.position
        ) {

            return false;
        }
    }


    return true;
}


/* ================================================================
   16. SORT TASKS
================================================================ */


/*
   Google Tasks API 通常已經按照 position
   返回。

   這裡保留 API 原本順序，
   不自行按日期排序。
*/

function normalizeTasks(
    taskList
) {

    return taskList.filter(
        function (task) {

            /*
               理論上 showCompleted=false
               已經只會返回未完成 Task。

               再做一次保險。
            */

            return (
                task.status !==
                'completed'
            );

        }
    );
}


/* ================================================================
   17. MAIN SYNC
================================================================ */

async function syncTasks(
    forceRender = false
) {

    /*
       沒登入。
    */

    if (!accessToken) {

        renderLogin();

        return;
    }


    /*
       防止重疊 Request。

       例如：

       5 秒 Timer 正在 Fetch，
       使用者同時按 Sync。

       不會開兩個 Request。
    */

    if (isSyncing) {

        return;
    }


    isSyncing =
        true;


    syncButton.disabled =
        true;


    /*
       首次同步顯示 loading。
    */

    if (
        tasks.length === 0 &&
        forceRender
    ) {

        renderLoading();
    }


    setStatus(
        '正在同步…'
    );


    try {

        const newTasks =
            normalizeTasks(
                await fetchAllTasks()
            );


        /*
           判斷資料是否真的改變。
        */

        const changed =
            !tasksAreEqual(
                tasks,
                newTasks
            );


        /*
           更新本地資料。
        */

        tasks =
            newTasks;


        /*
           只有真的變化，
           或強制 Render，
           才重新建立 DOM。
        */

        if (
            changed ||
            forceRender
        ) {

            renderTasks();
        }


        /*
           更新同步時間。
        */

        lastSyncElement.textContent =
            '更新 ' +
            formatTime(
                new Date()
            );


        setStatus(
            `已同步 · ${tasks.length} 項未完成`,
            'online'
        );


    } catch (error) {

        console.error(
            'Sync Error:',
            error
        );


        /*
           Token 過期已由 apiFetch 處理。
        */

        if (
            error.message !==
            'ACCESS_TOKEN_EXPIRED'
        ) {

            setStatus(
                '同步失敗',
                'error'
            );


            showToast(
                '同步失敗，稍後會再試'
            );
        }


    } finally {

        isSyncing =
            false;


        syncButton.disabled =
            !accessToken;
    }
}


/* ================================================================
   18. AUTO SYNC
================================================================ */

function startAutoSync() {

    stopAutoSync();


    /*
       每 5 秒執行一次。
    */

    syncTimer =
        setInterval(
            function () {

                if (
                    accessToken &&
                    Date.now() <
                    tokenExpiresAt
                ) {

                    syncTasks(
                        false
                    );

                }

            },
            SYNC_INTERVAL
        );
}


/* ================================================================
   19. STOP AUTO SYNC
================================================================ */

function stopAutoSync() {

    if (syncTimer) {

        clearInterval(
            syncTimer
        );

        syncTimer =
            null;
    }
}


/* ================================================================
   20. COMPLETE TASK
================================================================ */

async function completeTask(
    task,
    card,
    checkbox
) {

    /*
       防止快速連按。
    */

    if (
        completingTaskIds.has(
            task.id
        )
    ) {

        return;
    }


    completingTaskIds.add(
        task.id
    );


    /*
       Disable Checkbox。
    */

    checkbox.disabled =
        true;


    /*
       ============================================================
       OPTIMISTIC UI
       ============================================================

       使用者一按：

       1. Checkbox 即時打勾
       2. Card 即時淡出
       3. 同時發 API PATCH

       使用者唔需要等 Google API。
       ============================================================
    */

    checkbox.classList.add(
        'checked'
    );


    card.classList.add(
        'removing'
    );


    try {

        /*
           PATCH Google Tasks
        */

        await patchCompleteTask(
            task.id
        );


        /*
           API 成功。

           從本地 Task Array 移除。
        */

        tasks =
            tasks.filter(
                function (item) {

                    return (
                        item.id !==
                        task.id
                    );

                }
            );


        /*
           動畫完成後重新 Render。

           但如果同步期間有新資料，
           Render 出來會以最新 tasks 為準。
        */

        setTimeout(
            function () {

                /*
                   只有當 Card
                   仍然存在於 DOM
                   才 Render。
                */

                if (
                    card.parentNode
                ) {

                    renderTasks();
                }

            },
            350
        );


        /*
           更新狀態。
        */

        setStatus(
            `已完成 · ${tasks.length} 項未完成`,
            'online'
        );


    } catch (error) {

        console.error(
            'Complete Task Error:',
            error
        );


        /*
           ========================================================
           API 失敗
           ========================================================

           Optimistic UI 需要還原。
        */

        card.classList.remove(
            'removing'
        );


        checkbox.classList.remove(
            'checked'
        );


        checkbox.disabled =
            false;


        /*
           Token 過期：
           不顯示一般失敗訊息，
           因為 handleTokenExpired()
           已經處理。
        */

        if (
            error.message !==
            'ACCESS_TOKEN_EXPIRED'
        ) {

            showToast(
                '完成任務失敗，已還原'
            );


            setStatus(
                '完成同步失敗',
                'error'
            );
        }


    } finally {

        completingTaskIds.delete(
            task.id
        );
    }
}


/* ================================================================
   21. PATCH COMPLETE
================================================================ */

async function patchCompleteTask(
    taskId
) {

    const url =
        TASKS_API +
        '/lists/@default/tasks/' +
        encodeURIComponent(
            taskId
        );


    /*
       Google Tasks API：

       PATCH Task
       status = completed
    */

    const response =
        await apiFetch(
            url,
            {
                method:
                    'PATCH',

                headers:
                    {
                        'Content-Type':
                            'application/json'
                    },

                body:
                    JSON.stringify({
                        status:
                            'completed'
                    })
            }
        );


    if (!response.ok) {

        const errorText =
            await response.text();


        throw new Error(
            'PATCH Task failed: ' +
            response.status +
            ' ' +
            errorText
        );
    }


    return response.json();
}


/* ================================================================
   22. RENDER LOGIN
================================================================ */

function renderLogin() {

    contentElement.innerHTML = `

        <div class="login-panel">

            <h2>
                Task Dashboard
            </h2>

            <p>
                登入 Google 後顯示<br>
                Google Tasks 未完成事項
            </p>

            <button
                id="loginButtonInner"
                class="login-button"
                type="button">

                使用 Google 登入

            </button>

        </div>
    `;


    const button =
        document.getElementById(
            'loginButtonInner'
        );


    if (button) {

        button.addEventListener(
            'click',
            login
        );
    }
}


/* ================================================================
   23. RENDER LOADING
================================================================ */

function renderLoading() {

    contentElement.innerHTML = `

        <div class="message-panel">

            <div class="loading"></div>

        </div>
    `;
}


/* ================================================================
   24. RENDER EMPTY
================================================================ */

function renderEmpty() {

    contentElement.innerHTML = `

        <div class="message-panel">

            <div class="message-icon">
                ✓
            </div>

            <div>
                暫時沒有未完成事項
            </div>

        </div>
    `;
}


/* ================================================================
   25. RENDER TASKS
================================================================ */

function renderTasks() {

    /*
       沒有 Task。
    */

    if (!tasks.length) {

        renderEmpty();

        return;
    }


    /*
       建立 Document Fragment。

       比逐個 appendChild 更有效率。
    */

    const fragment =
        document.createDocumentFragment();


    const list =
        document.createElement(
            'div'
        );


    list.className =
        'task-list';


    tasks.forEach(
        function (task) {

            const card =
                createTaskCard(
                    task
                );


            list.appendChild(
                card
            );

        }
    );


    fragment.appendChild(
        list
    );


    /*
       一次替換。
    */

    contentElement.innerHTML = '';

    contentElement.appendChild(
        fragment
    );
}


/* ================================================================
   26. CREATE TASK CARD
================================================================ */

function createTaskCard(
    task
) {

    const card =
        document.createElement(
            'div'
        );


    card.className =
        'task-card';


    card.dataset.taskId =
        task.id;


    /*
       ============================================================
       Checkbox
       ============================================================
    */

    const checkbox =
        document.createElement(
            'button'
        );


    checkbox.type =
        'button';


    checkbox.className =
        'task-checkbox';


    checkbox.setAttribute(
        'aria-label',
        '完成任務'
    );


    checkbox.addEventListener(
        'click',
        function () {

            completeTask(
                task,
                card,
                checkbox
            );

        }
    );


    /*
       ============================================================
       Content
       ============================================================
    */

    const content =
        document.createElement(
            'div'
        );


    content.className =
        'task-content';


    /*
       Task Title
    */

    const title =
        document.createElement(
            'div'
        );


    title.className =
        'task-title';


    title.textContent =
        task.title ||
        '(無標題)';


    content.appendChild(
        title
    );


    /*
       Notes
    */

    if (task.notes) {

        const notes =
            document.createElement(
                'div'
            );


        notes.className =
            'task-notes';


        notes.textContent =
            task.notes;


        content.appendChild(
            notes
        );
    }


    /*
       Due Date
    */

    if (task.due) {

        const date =
            document.createElement(
                'span'
            );


        date.className =
            'task-date';


        date.textContent =
            formatDueDate(
                task.due
            );


        content.appendChild(
            date
        );
    }


    /*
       加入 Card
    */

    card.appendChild(
        checkbox
    );


    card.appendChild(
        content
    );


    return card;
}


/* ================================================================
   27. FORMAT TIME
================================================================ */

function formatTime(
    date
) {

    const hours =
        String(
            date.getHours()
        ).padStart(
            2,
            '0'
        );


    const minutes =
        String(
            date.getMinutes()
        ).padStart(
            2,
            '0'
        );


    return (
        hours +
        ':' +
        minutes
    );
}


/* ================================================================
   28. FORMAT DUE DATE
================================================================ */

function formatDueDate(
    dateString
) {

    const date =
        new Date(
            dateString
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return '';
    }


    const month =
        date.getMonth() + 1;


    const day =
        date.getDate();


    return (
        month +
        '/' +
        day
    );
}


/* ================================================================
   29. BUTTON EVENTS
================================================================ */


/*
   Header 登入 / 登出
*/

authButton.addEventListener(
    'click',
    function () {

        if (accessToken) {

            logout();

        } else {

            login();

        }

    }
);


/*
   Login Panel 登入
*/

loginButton.addEventListener(
    'click',
    login
);


/*
   手動同步
*/

syncButton.addEventListener(
    'click',
    function () {

        if (
            accessToken &&
            !isSyncing
        ) {

            syncTasks(
                true
            );
        }

    }
);


/* ================================================================
   30. VISIBILITY CHANGE
================================================================ */


/*
   如果 Android 瀏覽器暫停背景 Timer，
   使用者返回 Dashboard 時立即同步。

   這對手機長期運行尤其重要。
*/

document.addEventListener(
    'visibilitychange',
    function () {

        if (
            document.visibilityState !==
            'visible'
        ) {

            return;
        }


        /*
           Token 已過期。
        */

        if (
            accessToken &&
            Date.now() >=
            tokenExpiresAt
        ) {

            handleTokenExpired();

            return;
        }


        /*
           回到畫面立即同步。
        */

        if (
            accessToken &&
            !isSyncing
        ) {

            syncTasks(
                false
            );
        }

    }
);


/* ================================================================
   31. NETWORK STATUS
================================================================ */


/*
   網絡恢復：
   立即同步。
*/

window.addEventListener(
    'online',
    function () {

        if (accessToken) {

            setStatus(
                '網絡已恢復，正在同步…',
                'online'
            );


            syncTasks(
                false
            );

        } else {

            setStatus(
                '網絡已恢復'
            );
        }

    }
);


/*
   網絡中斷。
*/

window.addEventListener(
    'offline',
    function () {

        setStatus(
            '網絡連線中斷',
            'error'
        );


        showToast(
            '目前沒有網絡連線'
        );

    }
);


/* ================================================================
   32. INITIAL STATE
================================================================ */

renderLogin();


/*
   如果尚未設定 Client ID，
   顯示提示。
*/

if (
    CLIENT_ID.indexOf(
        'YOUR_GOOGLE_CLIENT_ID'
    ) !== -1
) {

    setStatus(
        '請設定 Google Client ID',
        'error'
    );
}

</script>
