   GLOBAL

* {

<script>

/* =========================================================
   CONFIG
========================================================= */

const CLIENT_ID =
    "710651032876-n8m8m7g3rhne9f2r3m0b78vkoqh18lhl.apps.googleusercontent.com";


const GOOGLE_SCOPE =
    "https://www.googleapis.com/auth/tasks " +
    "https://www.googleapis.com/auth/gmail.readonly";


const TASKS_API =
    "https://tasks.googleapis.com/tasks/v1";


const GMAIL_API =

const HKO_API =
    "https://data.weather.gov.hk/weatherAPI/opendata/weather.php";


const AQHI_API =
    "https://dashboard.data.gov.hk/api/aqhi-individual?format=json";


const TASK_INTERVAL =
    5000;


const MAIL_INTERVAL =
    60000;


const WEATHER_INTERVAL =
    600000;


/* =========================================================
   STATE
========================================================= */

let accessToken = null;

let tokenClient = null;

let taskListId = null;

let tasks = [];

let mails = [];

let currentWeather = null;

let forecast = null;


/* =========================================================
   DOM
========================================================= */

const loginOverlay =
    document.getElementById(
        "loginOverlay"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const logoutButton =
    document.getElementById(
        "logoutButton"
    );

const syncButton =
    document.getElementById(
        "syncButton"
    );

const fullscreenButton =
    document.getElementById(
        "fullscreenButton"
    );


/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    const now =
        new Date();


    const h =
        String(
            now.getHours()
        ).padStart(2, "0");


    const m =
        String(
            now.getMinutes()
        ).padStart(2, "0");


    document.getElementById(
        "clock"
    ).textContent =
        `${h}:${m}`;
}


updateClock();


setInterval(
    updateClock,
    1000
);


/* =========================================================
   TIME
========================================================= */

function timeString(date) {

    return (
        String(
            date.getHours()
        ).padStart(2, "0")
        +
        ":"
        +
        String(
            date.getMinutes()
        ).padStart(2, "0")
    );
}


/* =========================================================
   DATE
========================================================= */

function dateOnly(date) {

    return new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
    );
}


/* =========================================================
   TASK DATE INFO
========================================================= */

function taskDateInfo(value) {

    if (!value) {
        return null;
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return null;
    }


    const today =
        dateOnly(
            new Date()
        );


    const tomorrow =
        new Date(today);


    tomorrow.setDate(
        tomorrow.getDate() + 1
    );


    const d =
        dateOnly(date);


    if (
        d.getTime() <
        today.getTime()
    ) {

        return {
            text:
                `逾期 · ${d.getMonth() + 1}/${d.getDate()}`,

            type:
                "overdue"
        };

    }


    if (
        d.getTime() ===
        today.getTime()
    ) {

        return {
            text:
                "今日",

            type:
                "today"
        };

    }


    if (
        d.getTime() ===
        tomorrow.getTime()
    ) {

        return {
            text:
                "明日",

            type:
                "tomorrow"
        };

    }


    return {

        text:
            `${d.getMonth() + 1}/${d.getDate()}`,

        type:
            ""

    };
}


/* =========================================================
   TASK LIST
========================================================= */

async function getTaskList() {

    const response =
        await fetch(
            `${TASKS_API}/users/@me/lists`,
            {
                headers: {
                    Authorization:
                        `Bearer ${accessToken}`
                }
            }
        );


    if (!response.ok) {

        throw new Error(
            "Task list error"
        );

    }


    const data =
        await response.json();


    const defaultList =
        data.items?.find(
            item =>
                item.id === "@default"
        );


    if (defaultList) {

        return defaultList.id;

    }


    if (
        data.items &&
        data.items.length
    ) {

        return data.items[0].id;

    }


    throw new Error(
        "No task list"
    );
}


/* =========================================================
   LOAD TASKS
========================================================= */

async function loadTasks() {

    if (!accessToken) {
        return;
    }


    try {

        if (!taskListId) {

            taskListId =
                await getTaskList();

        }


        const url =
            `${TASKS_API}/lists/` +
            `${encodeURIComponent(taskListId)}` +
            `/tasks` +
            `?showCompleted=false` +
            `&showDeleted=false` +
            `&maxResults=100`;


        const response =
            await fetch(
                url,
                {

/* =========================================================
   SORT TASKS
========================================================= */

function sortedTasks() {

    return [...tasks].sort(
        (a, b) => {

            if (!a.due && !b.due) {
                return 0;
            }

            if (!a.due) {
                return 1;
            }

            if (!b.due) {
                return -1;
            }

            return (
                new Date(a.due) -
                new Date(b.due)
            );

        }
    );
}

/* =========================================================

========================================================= */

async function completeTask(
    task,
    card,
    checkbox
) {

    if (
        !accessToken ||
        !taskListId
    ) {
        return;
    }


    checkbox.className =
        "task-checkbox done";


    card.className =
        "task fading";


    try {

        const response =
            await fetch(
                `${TASKS_API}/lists/` +
                `${encodeURIComponent(taskListId)}` +
                `/tasks/` +
                `${encodeURIComponent(task.id)}`,
                {

                    method:
                        "PATCH",

                    headers: {

                        Authorization:
                            `Bearer ${accessToken}`,

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({
                            status:
                                "completed"
                        })

                }
            );


        if (!response.ok) {

            throw new Error(
                "Complete failed"
            );

        }


        setTimeout(
            () => {

                tasks =
                    tasks.filter(
                        item =>
                            item.id !== task.id
                    );


                renderTasks();

            },
            250
        );

    }
    catch (error) {

        console.error(
            error
        );


        checkbox.className =
            "task-checkbox";


        card.className =
            "task";

    }
}

/* =========================================================
   GET MAIL
========================================================= */

async function getMail(id) {

    const url =
        `${GMAIL_API}/users/me/messages/` +
        `${encodeURIComponent(id)}` +
        `?format=metadata` +
        `&metadataHeaders=From` +
        `&metadataHeaders=Subject`;


    const response =
        await fetch(
            url,
            {
                headers: {
                    Authorization:
                        `Bearer ${accessToken}`
                }
            }
        );


    if (!response.ok) {
        return null;
    }


    const data =
        await response.json();


    const headers =
        data.payload?.headers || [];


    const from =
        headers.find(
            item =>
                item.name.toLowerCase() ===
                "from"
        );


    const subject =
        headers.find(
            item =>
                item.name.toLowerCase() ===
                "subject"
        );


    return {

        id:
            data.id,

        threadId:
            data.threadId,

        sender:
            cleanSender(
                from?.value ||
                "未知寄件人"
            ),

        subject:
            subject?.value ||
            "(沒有主旨)",

        snippet:
            data.snippet ||
            "",

        time:
            Number(
                data.internalDate ||
                Date.now()
            )

    };
}


/* =========================================================
   CLEAN SENDER
========================================================= */

function cleanSender(value) {

    const match =
        value.match(
            /^(.+?)\s*<[^>]+>$/
        );


    if (match) {

        return match[1]
            .replace(
                /^["']|["']$/g,
                ""
            )
            .trim();

    }


    return value;
}

/* =========================================================
   WEATHER ICON
========================================================= */

function weatherIcon(
    text,
    code
) {

    const description =
        String(
            text || ""
        );


    if (
        description.includes("雷")
    ) {
        return "⛈️";
    }


    if (
        description.includes("雨") ||
        description.includes("驟雨")
    ) {
        return "🌧️";
    }


    if (
        description.includes("陰")
    ) {
        return "☁️";
    }


    if (
        description.includes("多雲")
    ) {
        return "⛅";
    }


    if (
        description.includes("晴")
    ) {
        return "☀️";
    }


    const n =
        Number(code);


    if (
        [50,51,52,53,54].includes(n)
    ) {
        return "⛅";
    }


    if (
        [60,61,62,63,64,65].includes(n)
    ) {
        return "🌧️";
    }


    return "🌤️";
}

/* =========================================================
   FORECAST DAY
========================================================= */

function forecastDay(value) {

    if (!value) {
        return "--";
    }


    const text =
        String(value);


    const year =
        Number(
            text.substring(0, 4)
        );


    const month =
        Number(
            text.substring(4, 6)
        );


    const day =
        Number(
            text.substring(6, 8)
        );


    const date =
        new Date(
            year,
            month - 1,
            day
        );


    const today =
        dateOnly(
            new Date()
        );


    const tomorrow =
        new Date(today);


    tomorrow.setDate(
        tomorrow.getDate() + 1
    );


    if (
        date.getTime() ===
        today.getTime()
    ) {

        return "今日";
    }


    if (
        date.getTime() ===
        tomorrow.getTime()
    ) {

        return "明日";
    }


    const week =
        [
            "日",
            "一",
            "二",
            "三",
            "四",
            "五",
            "六"
        ][
            date.getDay()
        ];


    return (
        `${month}/${day} ${week}`
    );
}

   FORECAST TEMP
========================================================= */

    const min =
        item.forecastMintemp?.value;


    const max =
        item.forecastMaxtemp?.value;


    if (
        min !== undefined &&
        max !== undefined
    ) {

        return (
            `${min}°-${max}°`
        );

    }


    return "--";
}

/* =========================================================
   FIND AQHI
========================================================= */

function findAQHI(data) {

    let list = [];


    if (Array.isArray(data)) {

        list =
            data;

    }
    else {

        list =
            data?.data ||
            data?.records ||
            data?.results ||
            [];
    }


    if (!Array.isArray(list)) {
        return null;
    }


    const north =
        list.find(
            item => {

                const text =
                    JSON.stringify(
                        item
                    ).toLowerCase();


                return (
                    text.includes("北區") ||
                    text.includes("north")
                );
            }
        );


    const item =
        north ||
        list[0];


    if (!item) {
        return null;
    }


    return (
        item.aqhi ??
        item.AQHI ??
        item.value ??
        item.index ??
        null
    );
}

   SHOW AQHI
========================================================= */

function showAQHI(value) {

    const element =
        document.getElementById(
            "topAQHI"

        value === null ||
        value === undefined ||
        value === ""
    ) {

        element.textContent =
            "AQHI --";

        element.className =
            "weather-value";

        return;
    }


    const number =
        Number(value);


    element.textContent =
        `AQHI ${value}`;


    let className =
        "weather-value";


    if (number <= 3) {

        className +=
            " aqhi-low";

    }
    else if (number <= 6) {

        className +=
            " aqhi-moderate";

    }
    else if (number <= 7) {

        className +=
            " aqhi-high";

    }
    else if (number <= 10) {

        className +=
            " aqhi-very-high";

    }
    else {

        className +=
            " aqhi-serious";

    }


    element.className =
        className;
}
