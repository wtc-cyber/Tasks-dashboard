<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <title>Tasks Dashboard</title>

    <script src="https://accounts.google.com/gsi/client"></script>

    <style>

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #121212;
            color: #ffffff;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
        }


        /* =========================================
           App
        ========================================= */

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #121212;
        }


        /* =========================================
           固定 Header
        ========================================= */

        .header {
            flex: 0 0 auto;
            width: 100%;
            padding: 12px 16px 10px;
            background: #121212;
            border-bottom: 1px solid #252525;
            z-index: 100;
        }


        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }


        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }


        .title {
            font-size: 1.4rem;
            font-weight: 700;
            white-space: nowrap;
        }


        .clock {
            font-size: 1.25rem;
            font-weight: 600;
            color: #bbbbbb;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }


        .header-buttons {
            display: flex;
            align-items: center;
            gap: 6px;
        }


        .header-button {
            min-height: 36px;
            padding: 0 10px;
            border: 0;
            border-radius: 9px;
            background: #292929;
            color: #ffffff;
            font-size: 0.82rem;
            cursor: pointer;
        }


        .header-button:active {
            background: #3a3a3a;
        }


        .logout-button {
            display: none;
        }


        /* =========================================
           Weather Bar
        ========================================= */

        .weather-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 9px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }


        .weather-bar::-webkit-scrollbar {
            display: none;
        }


        .weather-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.92rem;
            color: #cccccc;
        }


        .weather-value {
            color: #ffffff;
            font-weight: 600;
        }


        .weather-location {
            color: #777777;
            font-size: 0.75rem;
        }


        .aqhi-value {
            font-weight: 700;
        }


        .aqhi-low {
            color: #81c784;
        }


        .aqhi-moderate {
            color: #ffca5c;
        }


        .aqhi-high {
            color: #ff9b6b;
        }


        .aqhi-very-high {
            color: #ff7373;
        }


        .aqhi-serious {
            color: #ff4f81;
        }


        .weather-status {
            color: #666666;
            font-size: 0.72rem;
        }


        /* =========================================
           Task Scroll Area
        ========================================= */

        .task-area {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px 16px 18px;
            -webkit-overflow-scrolling: touch;
        }


        #tasks {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }


        /* =========================================
           Task Card
        ========================================= */

        .task {
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 70px;
            padding: 11px 14px;
            border-radius: 14px;
            background: #1e1e1e;
            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
        }


        .task.fading {
            opacity: 0;
            transform: translateX(30px);
        }


        .task-checkbox {
            flex: 0 0 auto;
            width: 28px;
            height: 28px;
            margin-right: 14px;
            border: 2px solid #888888;
            border-radius: 50%;
            background: transparent;
            position: relative;
            cursor: pointer;
        }


        .task-checkbox.done {
            border-color: #777777;
            background: #777777;
        }


        .task-checkbox.done::after {
            content: "";
            position: absolute;
            left: 7px;
            top: 3px;
            width: 7px;
            height: 13px;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            transform: rotate(45deg);
        }


        .task-content {
            min-width: 0;
            flex: 1;
        }


        .task-title {
            font-size: 1.28rem;
            line-height: 1.35;
            font-weight: 500;
            word-break: break-word;
        }


        .task-date {
            margin-top: 4px;
            font-size: 0.88rem;
            color: #999999;
        }


        .task-date.overdue {
            color: #ff7777;
        }


        .task-date.today {
            color: #ffb74d;
        }


        .task-date.tomorrow {
            color: #81c784;
        }


        .empty {
            padding: 50px 20px;
            text-align: center;
            color: #777777;
            font-size: 1.1rem;
        }


        /* =========================================
           Status
        ========================================= */

        .status {
            padding-top: 8px;
            text-align: center;
            color: #666666;
            font-size: 0.72rem;
            min-height: 22px;
        }


        /* =========================================
           Login Overlay
        ========================================= */

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #121212;
        }


        .login-box {
            width: min(420px, 100%);
            padding: 30px;
            border-radius: 18px;
            background: #1e1e1e;
            text-align: center;
        }


        .login-title {
            margin-bottom: 10px;
            font-size: 1.5rem;
            font-weight: 700;
        }


        .login-description {
            margin-bottom: 24px;
            color: #999999;
            line-height: 1.6;
        }


        .login-button {
            width: 100%;
            min-height: 50px;
            border: 0;
            border-radius: 12px;
            background: #ffffff;
            color: #111111;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }


        /* =========================================
           Desktop
        ========================================= */

        @media (min-width: 700px) {

            .header {
                padding-left: 24px;
                padding-right: 24px;
            }

            .task-area {
                padding-left: 24px;
                padding-right: 24px;
            }

            #tasks {
                max-width: 900px;
                margin: 0 auto;
            }

            .task-title {
                font-size: 1.35rem;
            }
        }

    </style>
</head>


<body>

    <!-- =========================================
         Login
    ========================================= -->

    <div id="loginOverlay" class="overlay">

        <div class="login-box">

            <div class="login-title">
                Tasks Dashboard
            </div>

            <div class="login-description">
                登入 Google 帳戶後<br>
                會自動同步你的 Google Tasks
            </div>

            <button
                id="overlayLoginButton"
                class="login-button">
                使用 Google 登入
            </button>

        </div>

    </div>


    <!-- =========================================
         App
    ========================================= -->

    <div class="app">


        <!-- 固定 Header -->

        <header class="header">

            <div class="header-top">

                <div class="header-left">

                    <div class="title">
                        Tasks
                    </div>

                    <div id="clock" class="clock">
                        --:--
                    </div>

                </div>


                <div class="header-buttons">

                    <button
                        id="syncButton"
                        class="header-button">
                        同步
                    </button>

                    <button
                        id="fullscreenButton"
                        class="header-button">
                        全螢幕
                    </button>

                    <button
                        id="loginButton"
                        class="header-button">
                        登入
                    </button>

                    <button
                        id="logoutButton"
                        class="header-button logout-button">
                        登出
                    </button>

                </div>

            </div>


            <!-- 天氣 -->

            <div class="weather-bar">

                <div class="weather-item">
                    <span>🌡️</span>
                    <span id="temperature" class="weather-value">
                        --°C
                    </span>
                </div>


                <div class="weather-item">
                    <span id="weatherIcon">
                        ☁️
                    </span>

                    <span id="weatherDescription"
                          class="weather-value">
                        載入中
                    </span>
                </div>


                <div class="weather-item">
                    <span>🌧️</span>

                    <span id="rainProbability"
                          class="weather-value">
                        --
                    </span>
                </div>


                <div class="weather-item">
                    <span>🏭</span>

                    <span>
                        AQHI
                    </span>

                    <span id="aqhi"
                          class="aqhi-value">
                        --
                    </span>
                </div>


                <div class="weather-location">
                    北區
                </div>

            </div>


            <div id="weatherStatus"
                 class="weather-status">
                天氣資料載入中
            </div>

        </header>


        <!-- =====================================
             Task 可獨立滑動
        ====================================== -->

        <main class="task-area">

            <div id="tasks"></div>

            <div id="status"
                 class="status">
            </div>

        </main>

    </div>


<script>


    /* =====================================================
       GOOGLE TASKS
    ===================================================== */

    const CLIENT_ID =
        "710651032876-n8m8m7g3rhne9f2r3m0b78vkoqh18lhl.apps.googleusercontent.com";

    const GOOGLE_SCOPE =
        "https://www.googleapis.com/auth/tasks";

    const GOOGLE_API =
        "https://tasks.googleapis.com/tasks/v1";

    const TASK_SYNC_INTERVAL =
        5000;


    /* =====================================================
       WEATHER
    ===================================================== */

    const HKO_API =
        "https://data.weather.gov.hk/weatherAPI/opendata/weather.php";


    const WEATHER_INTERVAL =
        10 * 60 * 1000;


    /* =====================================================
       AQHI
    ===================================================== */

    const AQHI_API =
        "https://dashboard.data.gov.hk/api/aqhi-individual?format=json";


    const AQHI_INTERVAL =
        10 * 60 * 1000;


    /* =====================================================
       STATE
    ===================================================== */

    let googleTokenClient = null;

    let accessToken = null;

    let tokenExpiry = 0;

    let tasksData = [];

    let syncTimer = null;

    let syncing = false;


    /* =====================================================
       DOM
    ===================================================== */

    const tasksElement =
        document.getElementById("tasks");

    const statusElement =
        document.getElementById("status");

    const loginButton =
        document.getElementById("loginButton");

    const logoutButton =
        document.getElementById("logoutButton");

    const syncButton =
        document.getElementById("syncButton");

    const fullscreenButton =
        document.getElementById("fullscreenButton");

    const loginOverlay =
        document.getElementById("loginOverlay");

    const overlayLoginButton =
        document.getElementById("overlayLoginButton");

    const clockElement =
        document.getElementById("clock");


    const temperatureElement =
        document.getElementById("temperature");

    const weatherIconElement =
        document.getElementById("weatherIcon");

    const weatherDescriptionElement =
        document.getElementById("weatherDescription");

    const rainProbabilityElement =
        document.getElementById("rainProbability");

    const aqhiElement =
        document.getElementById("aqhi");

    const weatherStatusElement =
        document.getElementById("weatherStatus");


    /* =====================================================
       CLOCK
    ===================================================== */

    function updateClock() {

        const now = new Date();

        const h =
            String(now.getHours())
                .padStart(2, "0");

        const m =
            String(now.getMinutes())
                .padStart(2, "0");

        clockElement.textContent =
            `${h}:${m}`;
    }


    updateClock();

    setInterval(
        updateClock,
        1000
    );


    /* =====================================================
       GOOGLE LOGIN
    ===================================================== */

    function initGoogle() {

        if (
            typeof google === "undefined" ||
            !google.accounts ||
            !google.accounts.oauth2
        ) {

            statusElement.textContent =
                "Google 登入元件載入失敗";

            return;
        }


        googleTokenClient =
            google.accounts.oauth2.initTokenClient({

                client_id: CLIENT_ID,

                scope: GOOGLE_SCOPE,

                callback: handleGoogleToken

            });
    }


    function login() {

        if (!googleTokenClient) {

            statusElement.textContent =
                "Google 登入尚未準備好";

            return;
        }


        googleTokenClient.requestAccessToken({
            prompt: "consent"
        });
    }


    function handleGoogleToken(response) {

        if (
            !response ||
            !response.access_token
        ) {

            statusElement.textContent =
                "Google 登入失敗";

            return;
        }


        accessToken =
            response.access_token;


        tokenExpiry =
            Date.now() +
            (
                (response.expires_in || 3600)
                * 1000
            );


        loginOverlay.style.display =
            "none";

        loginButton.style.display =
            "none";

        logoutButton.style.display =
            "block";


        statusElement.textContent =
            "已登入";


        startTaskAutoSync();

        syncTasks();
    }


    /* =====================================================
       GOOGLE FETCH
    ===================================================== */

    async function googleFetch(
        url,
        options = {}
    ) {

        if (!accessToken) {

            throw new Error(
                "NO_TOKEN"
            );
        }


        const headers =
            new Headers(
                options.headers || {}
            );


        headers.set(
            "Authorization",
            `Bearer ${accessToken}`
        );


        headers.set(
            "Content-Type",
            "application/json"
        );


        const response =
            await fetch(
                url,
                {
                    ...options,
                    headers
                }
            );


        if (response.status === 401) {

            accessToken = null;

            stopTaskAutoSync();

            loginOverlay.style.display =
                "flex";

            loginButton.style.display =
                "block";

            logoutButton.style.display =
                "none";

            throw new Error(
                "TOKEN_EXPIRED"
            );
        }


        if (!response.ok) {

            const text =
                await response.text();

            throw new Error(
                `HTTP ${response.status}: ${text}`
            );
        }


        return response;
    }


    /* =====================================================
       GET TASKS
    ===================================================== */

    async function getTasks() {

        let allTasks = [];

        let pageToken = "";


        do {

            let url =
                `${GOOGLE_API}/lists/@default/tasks` +
                `?showCompleted=false` +
                `&showDeleted=false` +
                `&maxResults=100`;


            if (pageToken) {

                url +=
                    `&pageToken=${encodeURIComponent(pageToken)}`;
            }


            const response =
                await googleFetch(url);


            const data =
                await response.json();


            if (Array.isArray(data.items)) {

                allTasks =
                    allTasks.concat(
                        data.items
                    );
            }


            pageToken =
                data.nextPageToken || "";


        } while (pageToken);


        return allTasks;
    }


    /* =====================================================
       TASK COMPARISON
    ===================================================== */

    function sameTasks(a, b) {

        if (a.length !== b.length) {
            return false;
        }


        for (
            let i = 0;
            i < a.length;
            i++
        ) {

            const x = a[i];

            const y = b[i];


            if (
                x.id !== y.id ||
                x.title !== y.title ||
                x.notes !== y.notes ||
                x.status !== y.status ||
                x.updated !== y.updated ||
                x.due !== y.due ||
                x.position !== y.position
            ) {

                return false;
            }
        }


        return true;
    }


    /* =====================================================
       SYNC TASKS
    ===================================================== */

    async function syncTasks() {

        if (
            !accessToken ||
            syncing
        ) {
            return;
        }


        if (
            Date.now() >= tokenExpiry
        ) {
            return;
        }


        syncing = true;


        try {

            const newTasks =
                await getTasks();


            if (
                !sameTasks(
                    tasksData,
                    newTasks
                )
            ) {

                tasksData =
                    newTasks;

                renderTasks();
            }


            statusElement.textContent =
                `最後同步 ${formatTime(new Date())}`;


        } catch (error) {

            console.error(error);


            if (
                error.message !==
                "TOKEN_EXPIRED"
            ) {

                statusElement.textContent =
                    "同步失敗";
            }


        } finally {

            syncing = false;
        }
    }


    /* =====================================================
       SORT TASKS
       
       過期
       ↓
       今日
       ↓
       明日
       ↓
       其他日期
       ↓
       無日期
    ===================================================== */

    function sortTasks(tasks) {

        return [...tasks].sort(
            (a, b) => {

                if (
                    !a.due &&
                    !b.due
                ) {
                    return 0;
                }


                if (!a.due) {
                    return 1;
                }


                if (!b.due) {
                    return -1;
                }


                return (
                    new Date(a.due) -
                    new Date(b.due)
                );
            }
        );
    }


    /* =====================================================
       RENDER TASKS
    ===================================================== */

    function renderTasks() {

        tasksElement.innerHTML = "";


        const sortedTasks =
            sortTasks(tasksData);


        if (
            sortedTasks.length === 0
        ) {

            const empty =
                document.createElement(
                    "div"
                );


            empty.className =
                "empty";


            empty.textContent =
                "沒有未完成工作";


            tasksElement.appendChild(
                empty
            );


            return;
        }


        sortedTasks.forEach(
            task => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "task";


                const checkbox =
                    document.createElement(
                        "div"
                    );


                checkbox.className =
                    "task-checkbox";


                const content =
                    document.createElement(
                        "div"
                    );


                content.className =
                    "task-content";


                const title =
                    document.createElement(
                        "div"
                    );


                title.className =
                    "task-title";


                title.textContent =
                    task.title ||
                    "(沒有標題)";


                const date =
                    document.createElement(
                        "div"
                    );


                const dateInfo =
                    getTaskDate(task);


                if (dateInfo) {

                    date.className =
                        `task-date ${dateInfo.type}`;

                    date.textContent =
                        dateInfo.text;

                } else {

                    date.className =
                        "task-date";

                    date.style.display =
                        "none";
                }


                content.appendChild(
                    title
                );

                content.appendChild(
                    date
                );


                card.appendChild(
                    checkbox
                );

                card.appendChild(
                    content
                );


                tasksElement.appendChild(
                    card
                );


                checkbox.addEventListener(
                    "click",
                    () => {

                        completeTask(
                            task,
                            card,
                            checkbox
                        );

                    }
                );
            }
        );
    }


    /* =====================================================
       TASK DATE
    ===================================================== */

    function getTaskDate(task) {

        if (!task.due) {
            return null;
        }


        const due =
            new Date(task.due);


        const now =
            new Date();


        const dueDay =
            new Date(
                due.getFullYear(),
                due.getMonth(),
                due.getDate()
            );


        const today =
            new Date(
                now.getFullYear(),
                now.getMonth(),
                now.getDate()
            );


        const tomorrow =
            new Date(today);


        tomorrow.setDate(
            tomorrow.getDate() + 1
        );


        const diff =
            Math.round(
                (
                    dueDay -
                    today
                ) / 86400000
            );


        const dateText =
            `${due.getMonth() + 1}/${due.getDate()}`;


        if (diff < 0) {

            return {
                text:
                    `已過期 · ${dateText}`,

                type:
                    "overdue"
            };
        }


        if (diff === 0) {

            return {
                text:
                    `今日 · ${dateText}`,

                type:
                    "today"
            };
        }


        if (diff === 1) {

            return {
                text:
                    `明日 · ${dateText}`,

                type:
                    "tomorrow"
            };
        }


        return {
            text:
                dateText,

            type:
                "normal"
        };
    }


    /* =====================================================
       COMPLETE TASK
    ===================================================== */

    async function completeTask(
        task,
        card,
        checkbox
    ) {

        if (
            card.className.includes(
                "fading"
            )
        ) {
            return;
        }


        checkbox.className =
            "task-checkbox done";


        card.className =
            "task fading";


        try {

            const url =
                `${GOOGLE_API}/lists/@default/tasks/${encodeURIComponent(task.id)}`;


            await googleFetch(
                url,
                {
                    method:
                        "PATCH",

                    body:
                        JSON.stringify({
                            status:
                                "completed"
                        })
                }
            );


            tasksData =
                tasksData.filter(
                    item =>
                        item.id !== task.id
                );


            setTimeout(
                () => {
                    renderTasks();
                },
                250
            );


        } catch (error) {

            console.error(error);


            checkbox.className =
                "task-checkbox";


            card.className =
                "task";


            statusElement.textContent =
                "完成 Task 失敗";
        }
    }


    /* =====================================================
       TASK AUTO SYNC
    ===================================================== */

    function startTaskAutoSync() {

        stopTaskAutoSync();


        syncTimer =
            setInterval(
                syncTasks,
                TASK_SYNC_INTERVAL
            );
    }


    function stopTaskAutoSync() {

        if (syncTimer) {

            clearInterval(
                syncTimer
            );

            syncTimer = null;
        }
    }


    /* =====================================================
       HKO WEATHER
    ===================================================== */

    async function loadWeather() {

        try {

            const currentUrl =
                `${HKO_API}?dataType=rhrread&lang=tc`;


            const forecastUrl =
                `${HKO_API}?dataType=fnd&lang=tc`;


            const [
                currentResponse,
                forecastResponse
            ] =
                await Promise.all([
                    fetch(currentUrl),
                    fetch(forecastUrl)
                ]);


            if (
                !currentResponse.ok ||
                !forecastResponse.ok
            ) {

                throw new Error(
                    "HKO API error"
                );
            }


            const current =
                await currentResponse.json();


            const forecast =
                await forecastResponse.json();


            updateCurrentWeather(
                current
            );


            updateRainProbability(
                forecast
            );


            weatherStatusElement.textContent =
                `天文台資料 · ${formatTime(new Date())}`;


        } catch (error) {

            console.error(
                "Weather error:",
                error
            );


            weatherStatusElement.textContent =
                "天氣資料暫時無法取得";
        }
    }


    /* =====================================================
       CURRENT WEATHER
    ===================================================== */

    function updateCurrentWeather(data) {

        if (
            data.temperature &&
            Array.isArray(
                data.temperature.data
            )
        ) {

            const fanling =
                findWeatherStation(
                    data.temperature.data,
                    [
                        "粉嶺",
                        "Fanling"
                    ]
                );


            const selected =
                fanling ||
                data.temperature.data[0];


            if (selected) {

                temperatureElement.textContent =
                    `${selected.value}°C`;
            }
        }


        if (
            data.icon &&
            Array.isArray(data.icon)
        ) {

            const iconNumber =
                Number(
                    data.icon[0]
                );


            weatherIconElement.textContent =
                weatherIcon(
                    iconNumber
                );


            weatherDescriptionElement.textContent =
                weatherDescription(
                    iconNumber
                );
        }
    }


    /* =====================================================
       FIND WEATHER STATION
    ===================================================== */

    function findWeatherStation(
        list,
        names
    ) {

        return list.find(
            item => {

                const place =
                    String(
                        item.place || ""
                    ).toLowerCase();


                return names.some(
                    name =>
                        place.includes(
                            String(name).toLowerCase()
                        )
                );
            }
        );
    }


    /* =====================================================
       RAIN PROBABILITY
       
       HKO PSR:
       High
       Medium High
       Medium
       Medium Low
       Low
    ===================================================== */

    function updateRainProbability(
        data
    ) {

        if (
            !data.weatherForecast ||
            !Array.isArray(
                data.weatherForecast
            )
        ) {

            rainProbabilityElement.textContent =
                "--";

            return;
        }


        const today =
            getTodayYYYYMMDD();


        const todayForecast =
            data.weatherForecast.find(
                item =>
                    String(
                        item.forecastDate
                    ) === today
            );


        if (
            !todayForecast ||
            !todayForecast.PSR
        ) {

            rainProbabilityElement.textContent =
                "--";

            return;
        }


        const psr =
            String(
                todayForecast.PSR
            );


        rainProbabilityElement.textContent =
            rainProbabilityText(
                psr
            );
    }


    function rainProbabilityText(
        psr
    ) {

        const value =
            psr.toLowerCase();


        if (
            value.includes("high") &&
            !value.includes("medium")
        ) {
            return "≥70%";
        }


        if (
            value.includes("medium high")
        ) {
            return "55–69%";
        }


        if (
            value === "medium"
        ) {
            return "45–54%";
        }


        if (
            value.includes("medium low")
        ) {
            return "30–44%";
        }


        if (
            value.includes("low")
        ) {
            return "<30%";
        }


        return psr;
    }


    /* =====================================================
       AQHI
       
       使用北區官方監測站
    ===================================================== */

    async function loadAQHI() {

        try {

            const response =
                await fetch(
                    AQHI_API
                );


            if (!response.ok) {

                throw new Error(
                    "AQHI API error"
                );
            }


            const data =
                await response.json();


            const station =
                findNorthAQHI(
                    data
                );


            if (!station) {

                aqhiElement.textContent =
                    "--";

                return;
            }


            const value =
                station.aqhi ??
                station.AQHI ??
                station.index ??
                station.value;


            if (
                value === undefined ||
                value === null ||
                value === ""
            ) {

                aqhiElement.textContent =
                    "--";

                return;
            }


            displayAQHI(
                String(value)
            );


        } catch (error) {

            console.error(
                "AQHI error:",
                error
            );


            aqhiElement.textContent =
                "--";
        }
    }


    /* =====================================================
       FIND NORTH AQHI
    ===================================================== */

    function findNorthAQHI(data) {

        let list = data;


        if (
            data &&
            Array.isArray(data.data)
        ) {
            list = data.data;
        }


        if (
            data &&
            Array.isArray(data.stations)
        ) {
            list = data.stations;
        }


        if (!Array.isArray(list)) {

            return null;
        }


        return list.find(
            item => {

                const name =
                    String(
                        item.station ||
                        item.stationName ||
                        item.name ||
                        item.englishName ||
                        item.chineseName ||
                        ""
                    ).toLowerCase();


                return (
                    name === "north" ||
                    name.includes("north") ||
                    name.includes("北區") ||
                    name.includes("北")
                );
            }
        );
    }


    /* =====================================================
       DISPLAY AQHI
    ===================================================== */

    function displayAQHI(
        value
    ) {

        aqhiElement.className =
            "aqhi-value";


        const numeric =
            parseFloat(value);


        if (
            Number.isNaN(numeric)
        ) {

            aqhiElement.textContent =
                value;

            return;
        }


        aqhiElement.textContent =
            value;


        if (numeric <= 3) {

            aqhiElement.className =
                "aqhi-value aqhi-low";

        } else if (numeric <= 6) {

            aqhiElement.className =
                "aqhi-value aqhi-moderate";

        } else if (numeric === 7) {

            aqhiElement.className =
                "aqhi-value aqhi-high";

        } else if (numeric <= 10) {

            aqhiElement.className =
                "aqhi-value aqhi-very-high";

        } else {

            aqhiElement.className =
                "aqhi-value aqhi-serious";
        }
    }

    /* =====================================================
       DATE
    ===================================================== */

    function getTodayYYYYMMDD() {

        const now =
            new Date();


        const y =
            now.getFullYear();


        const m =
            String(
                now.getMonth() + 1
            ).padStart(
                2,
                "0"
            );


        const d =
            String(
                now.getDate()
            ).padStart(
                2,
                "0"
            );


        return `${y}${m}${d}`;
    }


    /* =====================================================
       TIME
    ===================================================== */

    function formatTime(
        date
    ) {

        const h =
            String(
                date.getHours()
            ).padStart(
                2,
                "0"
            );


        const m =
            String(
                date.getMinutes()
            ).padStart(
                2,
                "0"
            );


        return `${h}:${m}`;
    }


    /* =====================================================
       LOGIN / LOGOUT
    ===================================================== */

    loginButton.addEventListener(
        "click",

    );


    overlayLoginButton.addEventListener(
        "click",
        login
    );


    logoutButton.addEventListener(
        "click",
        () => {

            accessToken = null;

            tokenExpiry = 0;

            tasksData = [];

            stopTaskAutoSync();


            tasksElement.innerHTML =
                "";


            loginOverlay.style.display =
                "flex";


            loginButton.style.display =
                "block";


            logoutButton.style.display =
                "none";


            statusElement.textContent =
                "已登出";
        }
    );

    ===================================================== */

    syncButton.addEventListener(

        () => {

            if (!accessToken) {

                return;
            }


            syncTasks();

            loadWeather();

            loadAQHI();
        }
    );


    /* =====================================================
       FULLSCREEN
    ===================================================== */

    fullscreenButton.addEventListener(
        "click",
        async () => {

            try {

                if (
                    !document.fullscreenElement
                ) {

                    await document
                        .documentElement
                        .requestFullscreen();

                } else {

                    await document
                        .exitFullscreen();
                }

            } catch (error) {

                console.error(error);
            }
        }
    );


    /* =====================================================
       NETWORK
    ===================================================== */

    window.addEventListener(
        "online",
        () => {

            if (accessToken) {
                syncTasks();
            }

            loadWeather();

            loadAQHI();
        }
    );


    /* =====================================================
       VISIBILITY
    ===================================================== */

    document.addEventListener(
        "visibilitychange",
        () => {

            if (
                document.visibilityState ===
                "visible"
            ) {

                if (accessToken) {
                    syncTasks();
                }

                loadWeather();

                loadAQHI();
            }
        }
    );
