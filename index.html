<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta charset="UTF-8">

<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>WTC Work Dashboard</title>

<style>

/* =========================================================
   GLOBAL & SCHEDULE CUSTOM STYLES
========================================================= */

* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;

  overflow: hidden;

  background: #121212;
  color: #ffffff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    Arial,
    sans-serif;
}

body {
  position: fixed;
  inset: 0;
}

button {
  font-family: inherit;
}

/* 調整 Schedule 標題與排版 */
.schedule-title {
  font-size: 1.05rem !important;
  font-weight: 600 !important;
  display: flex !important;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  line-height: 1.4;
}

/* 節數 (Period) 醒目标籤 */
.period-badge {
  background: #3b82f6;
  color: #ffffff;
  font-size: 0.85rem;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 4px;
}

/* 班別 (Class) 標題 */
.class-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: #f8fafc;
}

/* 倒數時間標籤 */
.countdown-tag {
  font-size: 0.8rem;
  font-weight: 500;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(59, 130, 246, 0.2);
  color: #60a5fa;
  margin-left: auto;
}

.schedule-item.now .countdown-tag {
  background: rgba(239, 68, 68, 0.2);
  color: #f87171;
}

/* =========================================================
   APP LAYOUT
========================================================= */

.app {
  width: 100%;
  height: 100vh;
  height: 100dvh;

  display: flex;
  flex-direction: column;

  overflow: hidden;

  background: #121212;
}

/* =========================================================
   HEADER
========================================================= */

.header {
  flex: 0 0 auto;

  min-height: 78px;

  padding: 8px 14px 7px;

  background: #121212;

  border-bottom: 1px solid #292929;

  overflow: hidden;
}

.header-top {
  height: 34px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;
}

.header-left {
  min-width: 0;

  display: flex;
  align-items: center;

  gap: 14px;
}

.title {
  font-size: 1.25rem;
  font-weight: 700;

  white-space: nowrap;
}

.clock {
  font-size: 1.25rem;
  font-weight: 600;

  color: #bbbbbb;

  font-variant-numeric: tabular-nums;

  white-space: nowrap;
}

.header-buttons {
  display: flex;
  align-items: center;

  gap: 5px;
}

.header-button {
  height: 32px;

  padding: 0 10px;

  border: 0;
  border-radius: 8px;

  background: #292929;
  color: #ffffff;

  font-size: 0.75rem;

  cursor: pointer;

  white-space: nowrap;
}

.header-button:active {
  background: #3a3a3a;
}

/* =========================================================
   WEATHER
========================================================= */

.weather-area {
  margin-top: 5px;

  display: flex;
  align-items: center;

  min-width: 0;

  overflow: hidden;
}

.weather-bar {
  height: 25px;

  display: flex;
  align-items: center;

  gap: 17px;

  min-width: 0;

  overflow: hidden;

  white-space: nowrap;
}

.weather-item {
  display: flex;
  align-items: center;

  gap: 4px;

  color: #999999;

  font-size: 0.77rem;
}

.weather-value {
  color: #ffffff;

  font-weight: 600;
}

/* Weather Warning Bar */
.warning-bar {
  display: none;

  flex: 1;

  min-width: 0;

  margin-left: 18px;

  height: 25px;

  align-items: center;

  overflow: hidden;

  white-space: nowrap;

  color: #ffca5c;

  font-size: 0.72rem;

  font-weight: 600;
}

.warning-bar.active {
  display: flex;
}

.warning-icon {
  flex: 0 0 auto;

  margin-right: 5px;
}

.warning-text {
  min-width: 0;

  overflow: hidden;

  text-overflow: ellipsis;
}

/* =========================================================
   DASHBOARD
========================================================= */

.dashboard {
  flex: 1 1 0;
  min-width: 0;
  min-height: 0;
  width: 100%;
  padding: 10px 12px 12px;

  display: grid;

  /* 將 Tasks 改為 15fr (15%)，Schedule 與 Email 各改為 42.5fr (42.5%) */
  grid-template-columns:
    30fr
    38fr
    34fr;

  gap: 10px;
  overflow: hidden;
}

.panel {
  min-width: 0;
  min-height: 0;

  height: 100%;

  display: flex;
  flex-direction: column;

  background: #181818;

  border: 1px solid #292929;

  border-radius: 12px;

  overflow: hidden;
}

.panel-header {
  flex: 0 0 42px;

  height: 42px;

  padding: 0 12px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background: #1d1d1d;

  border-bottom: 1px solid #292929;

  gap: 10px;
}

.panel-title {
  font-size: 0.95rem;

  font-weight: 700;

  white-space: nowrap;
}

.panel-meta {
  min-width: 0;

  display: flex;
  align-items: center;

  gap: 8px;

  white-space: nowrap;
}

.panel-count {
  color: #777777;

  font-size: 0.67rem;
}

.panel-updated {
  color: #666666;

  font-size: 0.63rem;

  font-variant-numeric: tabular-nums;
}

.panel-body {
  flex: 1 1 auto;

  min-height: 0;

  overflow: hidden;
}

/* =========================================================
   TASKS
========================================================= */

.task-scroll {
  height: 100%;

  padding: 7px;

  overflow-y: auto;
  overflow-x: hidden;

  scrollbar-width: thin;
}

.task-card {
  width: 100%;

  min-height: 53px;

  margin-bottom: 6px;

  padding: 8px 10px;

  display: flex;
  align-items: center;

  gap: 10px;

  background: #202020;

  border: 1px solid #2b2b2b;

  border-radius: 9px;

  transition:
    opacity 0.2s ease,
    transform 0.2s ease;
}

.task-card:last-child {
  margin-bottom: 0;
}

.task-card.fading {
  opacity: 0;
  transform: translateX(20px);
}

.task-checkbox {
  flex: 0 0 27px;

  width: 27px;
  height: 27px;

  padding: 0;

  border: 2px solid #777777;

  border-radius: 7px;

  background: transparent;

  cursor: pointer;
}

.task-checkbox.done {
  background: #777777;
  border-color: #777777;
}

.task-content {
  min-width: 0;

  flex: 1;
}

.task-title {
  font-size: 0.92rem;

  line-height: 1.3;

  word-break: break-word;
}

.task-date {
  margin-top: 3px;

  font-size: 0.67rem;

  color: #777777;
}

.task-date.overdue {
  color: #ff7373;
}

.task-date.today {
  color: #81c784;
}

.task-date.tomorrow {
  color: #ffca5c;
}

.task-empty,
.schedule-empty,
.mail-empty {
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #666666;

  font-size: 0.82rem;

  text-align: center;
}

.task-error {
  padding: 20px;

  color: #ff7373;

  font-size: 0.78rem;

  line-height: 1.5;
}

/* =========================================================
   SCHEDULE
========================================================= */

.schedule-scroll {
  height: 100%;

  padding: 8px 9px;

  overflow-y: auto;
  overflow-x: hidden;

  scrollbar-width: thin;
}

.schedule-day-label {
  margin: 2px 4px 7px;

  color: #888888;

  font-size: 0.69rem;

  font-weight: 600;
}

.schedule-item {
  position: relative;

  min-height: 49px;

  margin-bottom: 5px;

  display: grid;

  grid-template-columns:
    54px
    10px
    1fr;

  align-items: stretch;

  background: #202020;

  border: 1px solid #292929;

  border-radius: 8px;

  overflow: hidden;
}

.schedule-time {
  padding: 10px 5px;

  display: flex;
  align-items: flex-start;
  justify-content: center;

  color: #999999;

  font-size: 0.72rem;

  font-variant-numeric: tabular-nums;
}

.schedule-line {
  position: relative;

  display: flex;

  justify-content: center;
}

.schedule-line::before {
  content: "";

  width: 2px;

  height: 100%;

  background: #3c3c3c;
}

.schedule-dot {
  position: absolute;

  top: 12px;

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #777777;
}

.schedule-info {
  min-width: 0;

  padding: 8px 9px 8px 4px;
}

.schedule-location {
  margin-top: 3px;

  color: #666666;

  font-size: 0.63rem;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.schedule-item.now {
  background: #292929;

  border-color: #666666;

  min-height: 58px;
}

.schedule-item.now .schedule-time {
  color: #ffffff;

  font-weight: 700;

  font-size: 0.76rem;
}

.schedule-item.now .schedule-title {
  font-size: 0.88rem;

  font-weight: 700;
}

.schedule-item.now .schedule-dot {
  background: #ffffff;

  box-shadow:
    0 0 0 3px #444444;
}

.schedule-item.now .schedule-line::before {
  background: #666666;
}

.schedule-item.past {
  opacity: 0.45;
}

.schedule-item.next {
  border-color: #444444;
}

.schedule-all-day {
  color: #aaaaaa;

  font-size: 0.68rem;
}

/* =========================================================
   EMAIL
========================================================= */

.mail-scroll {
  height: 100%;

  padding: 7px;

  overflow-y: auto;
  overflow-x: hidden;

  scrollbar-width: thin;
}

.mail-card {
  width: 100%;

  margin-bottom: 6px;

  padding: 9px 10px;

  background: #202020;

  border: 1px solid #2b2b2b;

  border-radius: 8px;

  cursor: pointer;
}

.mail-card:last-child {
  margin-bottom: 0;
}

.mail-card:active {
  background: #292929;
}

.mail-top {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 7px;
}

.mail-sender {
  min-width: 0;

  flex: 1;

  color: #ffffff;

  font-size: 0.74rem;

  font-weight: 600;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.mail-time {
  flex: 0 0 auto;

  color: #666666;

  font-size: 0.6rem;
}

.mail-subject {
  margin-top: 4px;

  color: #dddddd;

  font-size: 0.76rem;

  font-weight: 600;

  line-height: 1.3;

  word-break: break-word;
}

.mail-snippet {
  margin-top: 4px;

  color: #777777;

  font-size: 0.65rem;

  line-height: 1.3;

  display: -webkit-box;

  -webkit-line-clamp: 2;

  -webkit-box-orient: vertical;

  overflow: hidden;
}

/* =========================================================
   WORK OFF
========================================================= */

.work-off {
  display: none;

  flex: 1 1 auto;

  min-height: 0;

  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 30px;
}

.work-off.active {
  display: flex;
}

.work-off-message {
  color: #dddddd;

  font-size: clamp(
    1.8rem,
    4vw,
    3.2rem
  );

  line-height: 1.5;

  font-weight: 500;

  letter-spacing: 0.04em;
}

.continue-button {
  display: none;
}

.continue-button.active {
  display: block;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 800px) {

  .title {
    font-size: 1rem;
  }

  .clock {
    font-size: 1rem;
  }

  .header-button {
    padding: 0 7px;

    font-size: 0.67rem;
  }

  .dashboard {
    grid-template-columns:
      30fr
      38fr
      32fr;
  }

  .panel-updated {
    font-size: 0.58rem;
  }

}
   /* ⚙️ 浮動設定按鈕 */
.settings-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff;
  font-size: 1.2rem;
  cursor: pointer;
  z-index: 999;
  transition: transform 0.2s, background 0.2s;
}
.settings-btn:hover {
  transform: rotate(45deg) scale(1.1);
  background: rgba(255, 255, 255, 0.3);
}

/* Modal 背景遮罩 */
.modal-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(8px);
  z-index: 100000;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: opacity 0.2s ease;
}
.modal-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

/* Modal 卡片外觀 */
.modal-card {
  background: #1e1e24;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 16px;
  width: 85%;
  max-width: 380px;
  color: #fff;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  overflow: hidden;
}

.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-header h2 { font-size: 1.1rem; margin: 0; }
.close-btn { background: none; border: none; color: #aaa; font-size: 1.5rem; cursor: pointer; }

.modal-body { padding: 20px; }
.setting-label { display: block; margin-bottom: 10px; font-size: 0.9rem; color: #ccc; }

/* 下拉選單樣式 */
.day-select {
  width: 100%;
  padding: 10px 12px;
  background: #2b2b36;
  border: 1px solid #4ea8de;
  color: #fff;
  border-radius: 8px;
  font-size: 0.95rem;
  outline: none;
  cursor: pointer;
}

.modal-footer {
  padding: 12px 20px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}
.btn-save {
  background: #4ea8de; color: #fff; border: none;
  padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold;
}
.btn-cancel {
  background: #333; color: #ccc; border: none;
  padding: 8px 16px; border-radius: 8px; cursor: pointer;
}
</style>
</head>


<body>
   <!-- ⚙️ 設定按鈕 (點擊開啟切換面板) -->
<button id="settings-btn" class="settings-btn" title="切換課堂模式">⚙️</button>

<!-- ⚙️ 課堂模式切換 Modal -->
<div id="settings-modal" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="modal-header">
      <h2>📚 切換顯示課堂</h2>
      <button id="close-modal-x" class="close-btn">&times;</button>
    </div>
    
    <div class="modal-body">
      <div class="setting-section">
        <label for="cfg-schedule-day-mode" class="setting-label">請選擇今日要顯示的課堂：</label>
        <select id="cfg-schedule-day-mode" class="day-select">
          <option value="auto">⚡ 自動（跟隨今日真實星期）</option>
          <option value="1">📌 星期一課堂</option>
          <option value="2">📌 星期二課堂</option>
          <option value="3">📌 星期三課堂</option>
          <option value="4">📌 星期四課堂</option>
          <option value="5">📌 星期五課堂</option>
          <option value="6">📌 星期六課堂</option>
          <option value="0">📌 星期日課堂</option>
        </select>
      </div>
    </div>

    <div class="modal-footer">
      <button id="save-settings-btn" class="btn-save">套用設定</button>
      <button id="cancel-settings-btn" class="btn-cancel">取消</button>
    </div>
  </div>
</div>
<!-- APP MAIN CONTAINER -->

<div class="app">

  <!-- HEADER -->
  <header class="header">

    <div class="header-top">

      <div class="header-left">
        <div class="title">
          WTC Work Dashboard
        </div>

        <div id="clock" class="clock">
          --:--
        </div>
      </div>

      <div class="header-buttons">
        <button id="syncButton" class="header-button" type="button">
          ↻ 同步
        </button>

        <button id="workButton" class="header-button" type="button">
          🌙 收工
        </button>

        <button id="continueButton" class="header-button continue-button" type="button">
          ☀️ 繼續工作
        </button>

        <button id="fullscreenButton" class="header-button" type="button">
          ⛶
        </button>
      </div>

    </div>

    <!-- WEATHER BAR -->
    <div class="weather-area">

      <div class="weather-bar">

        <div class="weather-item">
          <span>🌡</span>
          <span id="weatherTemp" class="weather-value">--</span>
        </div>

        <div class="weather-item">
          <span id="weatherIcon">☁</span>
          <span id="weatherText" class="weather-value">天氣讀取中</span>
        </div>

        <div class="weather-item">
          <span>💧</span>
          <span id="humidity" class="weather-value">--</span>
        </div>

        <div class="weather-item">
          <span>☔</span>
          <span id="rainProbability" class="weather-value">--</span>
        </div>

        <div class="weather-item">
          <span>AQHI</span>
          <span id="aqhi" class="weather-value">--</span>
        </div>

      </div>

      <!-- WEATHER WARNING -->
      <div id="warningBar" class="warning-bar">
        <span id="warningIcon" class="warning-icon">⚠️</span>
        <span id="warningText" class="warning-text">--</span>
      </div>

    </div>

  </header>

  <!-- WORK OFF MESSAGE -->
  <div id="workOffMessage" class="work-off">
    <div class="work-off-message">
      我已經離校了。今天辛苦您了，祝您晚安，早點休息！
    </div>
  </div>

  <!-- DASHBOARD PANELS -->
  <main id="dashboard" class="dashboard">

    <!-- TASKS -->
    <section class="panel">
      <div class="panel-header">
        <div class="panel-title">Tasks</div>
        <div class="panel-meta">
          <div id="taskCount" class="panel-count">--</div>
          <div id="taskUpdated" class="panel-updated">更新 --</div>
        </div>
      </div>

      <div class="panel-body">
        <div id="taskScroll" class="task-scroll">
          <div class="task-empty">資料載入中...</div>
        </div>
      </div>
    </section>

    <!-- SCHEDULE (CALENDAR / CLASS DUAL) -->
    <section class="panel">
      <div class="panel-header">
        <div class="panel-title">今日 Schedule</div>
        <div class="panel-meta">
          <div id="scheduleDate" class="panel-count">--</div>
          <div id="scheduleUpdated" class="panel-updated">更新 --</div>
        </div>
      </div>

      <div class="panel-body">
        <div id="scheduleScroll" class="schedule-scroll">
          <div class="schedule-empty">資料載入中...</div>
        </div>
      </div>
    </section>

    <!-- EMAIL -->
    <section class="panel">
      <div class="panel-header">
        <div class="panel-title">Email</div>
        <div class="panel-meta">
          <div id="mailCount" class="panel-count">未讀</div>
          <div id="mailUpdated" class="panel-updated">更新 --</div>
        </div>
      </div>

      <div class="panel-body">
        <div id="mailScroll" class="mail-scroll">
          <div class="mail-empty">資料載入中...</div>
        </div>
      </div>
    </section>

  </main>

</div>



<script>

/* =========================================================
   CONFIG & ENDPOINTS
========================================================= */

const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyvtFOlq0Tom8Z__WDAbetsH6JR2HnFVEsSXkmaBm_5IhjSPKlt3zHhNSPteY74wUDiwA/exec";
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTsQx-iaBuir-NFhfq75miYTkRHi_HgoTy1bcmQWKL957yJj1VPKQlQN_5A1sONCTmMu2y3cP6WutcL/pub?output=csv";
const HKO_API = "https://data.weather.gov.hk/weatherAPI/opendata/weather.php";
const AQHI_API = "https://dashboard.data.gov.hk/api/aqhi-individual?format=json";

const DATA_SYNC_INTERVAL = 1 * 60 * 1000;      // 每 1 分鐘自動從 GAS 更新
const WEATHER_INTERVAL = 5 * 60 * 1000;       // 每 5 分鐘更新天氣
const SCHEDULE_SWITCH_INTERVAL = 10000;        // 每 10 秒自動切換「日曆 / 課堂」視圖


/* =========================================================
   STATE & DOM
========================================================= */

let workOff = false;
let currentScheduleMode = "calendar"; // 'calendar' 或 'class'
let cachedCalendarData = [];
let cachedClassData = [];

const syncButton = document.getElementById("syncButton");
const workButton = document.getElementById("workButton");
const continueButton = document.getElementById("continueButton");
const fullscreenButton = document.getElementById("fullscreenButton");
const dashboard = document.getElementById("dashboard");
const workOffMessage = document.getElementById("workOffMessage");

/* =========================================================
   HELPERS & UTILITIES
========================================================= */

function escapeHtml(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatTime(date) {
  return (
    String(date.getHours()).padStart(2, "0") +
    ":" +
    String(date.getMinutes()).padStart(2, "0")
  );
}

function updateClock() {
  clock.textContent = formatTime(new Date());
}
setInterval(updateClock, 1000);
updateClock();

function setPanelUpdated(element, prefix = "更新") {
  element.textContent = `${prefix} ${formatTime(new Date())}`;
}

function startOfToday() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

function startOfTomorrow() {
  const d = startOfToday();
  d.setDate(d.getDate() + 1);
  return d;
}
   // ➕ 新增這段：計算後天 00:00 的時間
function startOfDayAfterTomorrow() {
  const d = startOfToday();
  d.setDate(d.getDate() + 2);
  return d;
}

function formatDateMD(date) {
  return `${date.getMonth() + 1}/${date.getDate()}`;
}

function formatScheduleDate(date) {
  const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
  return `${date.getMonth() + 1}/${date.getDate()}（${weekdays[date.getDay()]}）`;
}

function parseCSV(text) {
  const lines = text.split(/\r\n|\n/);
  const result = [];
  for (let line of lines) {
    if (!line.trim()) continue;
    const row = [];
    let insideQuote = false;
    let entry = "";
    for (let char of line) {
      if (char === '"') {
        insideQuote = !insideQuote;
      } else if (char === ',' && !insideQuote) {
        row.push(entry.trim());
        entry = "";
      } else {
        entry += char;
      }
    }
    row.push(entry.trim());
    result.push(row);
  }
  return result;
}

// 萬能 Calendar 事件資料兼容解析器
function parseEventData(evt) {
  const title = evt.title || evt.summary || "(無主題)";
  let startRaw = null;
  let endRaw = null;
  let isAllDay = false;

  if (typeof evt.start === "object" && evt.start !== null) {
    startRaw = evt.start.dateTime || evt.start.date;
    if (!evt.start.dateTime && evt.start.date) isAllDay = true;
  } else if (typeof evt.start === "string") {
    startRaw = evt.start;
  } else if (evt.startTime) {
    startRaw = evt.startTime;
  }

  if (typeof evt.end === "object" && evt.end !== null) {
    endRaw = evt.end.dateTime || evt.end.date;
  } else if (typeof evt.end === "string") {
    endRaw = evt.end;
  } else if (evt.endTime) {
    endRaw = evt.endTime;
  }

  if (evt.isAllDay !== undefined) isAllDay = evt.isAllDay;

  return {
    title: title,
    start: startRaw ? new Date(startRaw) : null,
    end: endRaw ? new Date(endRaw) : null,
    isAllDay: isAllDay,
    location: evt.location || ""
  };
}

    }
  } catch (err) {

}


/* =========================================================
   TASKS RENDER
========================================================= */

function taskDateInfo(due) {
  if (!due) return null;
  const date = new Date(due);
  const today = startOfToday();
  const tomorrow = startOfTomorrow();
  const dateOnly = new Date(date.getFullYear(), date.getMonth(), date.getDate());

  if (dateOnly < today) return { text: "逾期", className: "overdue" };
  if (dateOnly.getTime() === today.getTime()) return { text: "今日", className: "today" };
  if (dateOnly.getTime() === tomorrow.getTime()) return { text: "明日", className: "tomorrow" };

  return { text: formatDateMD(date), className: "" };
}

function renderTasks(tasks) {
  taskScroll.innerHTML = "";
  taskCount.textContent = `${tasks.length} 項`;

  if (!tasks.length) {
    taskScroll.innerHTML = `<div class="task-empty">🎉 沒有未完成 Tasks</div>`;
    return;
  }

  const sorted = [...tasks].sort((a, b) => {
    if (!a.due && !b.due) return 0;
    if (!a.due) return 1;
    if (!b.due) return -1;
    return new Date(a.due) - new Date(b.due);
  });

  sorted.forEach(task => {
    const card = document.createElement("div");
    card.className = "task-card";

    const checkbox = document.createElement("button");
    checkbox.type = "button";
    checkbox.className = "task-checkbox";

    checkbox.addEventListener("click", () => {
      checkbox.className = "task-checkbox done";
      card.className = "task-card fading";

      // 🌐 即時發送請求給 Google Apps Script，標記該 Task 為已完成
      if (task.id) {
        fetch(`${GAS_API_URL}?action=completeTask&taskId=${encodeURIComponent(task.id)}`)
          .then(res => res.json())
          .then(data => console.log("Task 完成狀態同步:", data))
          .catch(err => console.error("Task 同步失敗:", err));
      }

      setTimeout(() => {
        if (card.parentNode) card.parentNode.removeChild(card);
      }, 250);
    });

    const content = document.createElement("div");
    content.className = "task-content";

    const title = document.createElement("div");
    title.className = "task-title";
    title.textContent = task.title || "(無標題)";

    const info = taskDateInfo(task.due);
    content.appendChild(title);

    if (info) {
      const date = document.createElement("div");
      date.className = info.className ? `task-date ${info.className}` : "task-date";
      date.textContent = info.text;
      content.appendChild(date);
    }

    card.appendChild(checkbox);
    card.appendChild(content);
    taskScroll.appendChild(card);
  });
}
// 確保定義了 renderCalendar 函數
function renderCalendar(events) {
  const container = document.getElementById('calendar-container'); // 請確認你的 HTML 容器 ID
  if (!container) return;

  if (!events || events.length === 0) {
    container.innerHTML = '<div class="empty-state">📅 近期沒有日程</div>';
    return;
  }

  // 渲染日程資料
  container.innerHTML = events.map(event => `
    <div class="calendar-item">
      <span class="event-time">${event.startTime || ''}</span>
      <span class="event-title">${escapeHtml(event.title)}</span>
    </div>
  `).join('');
}
function renderScheduleDisplay() {
  const today = new Date();
  // 🌟 讀取手動切換設定
  const overrideMode = localStorage.getItem("schedule_override_day") || "auto";

  if (currentScheduleMode === "calendar") {
    scheduleDate.textContent = `📅 行程 | ${formatScheduleDate(today)}`;
    renderCalendar(cachedCalendarData);
  } else {
    // 如果是調課模式，在標題加個提示標籤
    const isOverride = overrideMode !== "auto";
    const badge = isOverride ? " (調課模式)" : "";
    
    scheduleDate.textContent = `📚 課堂 | ${formatScheduleDate(today)}${badge}`;
    renderClassSchedule(cachedClassData);
  }
  setPanelUpdated(scheduleUpdated, currentScheduleMode === "calendar" ? "日曆" : "課堂");
}

function renderClassSchedule(rows) {
  scheduleScroll.innerHTML = "";

  if (!rows || rows.length === 0) {
    scheduleScroll.innerHTML = `<div class="schedule-empty">📖 無課堂資料</div>`;
    return;
  }

  const now = new Date();
  const currentMinutes = now.getHours() * 60 + now.getMinutes();

  // 🌟 關鍵修改：先讀取 localStorage 設定，若為 auto 才用真實星期
  const overrideMode = localStorage.getItem("schedule_override_day") || "auto";
  const todayIdx = (overrideMode === "auto") ? now.getDay() : parseInt(overrideMode);

  const dayKeywords = [
    ["sun", "sunday", "星期日", "日"],
    ["mon", "monday", "星期一", "一"],
    ["tue", "tuesday", "星期二", "二"],
    ["wed", "wednesday", "星期三", "三"],
    ["thu", "thursday", "星期四", "四"],
    ["fri", "friday", "星期五", "五"],
    ["sat", "saturday", "星期六", "六"]
  ][todayIdx];

  let dayColIdx = 0;
  for (let r = 0; r < Math.min(rows.length, 5); r++) {
    for (let c = 0; c < rows[r].length; c++) {
      const val = (rows[r][c] || "").toLowerCase().trim();
      if (["mon","tue","wed","thu","fri","sat","sun","星期一","星期二","星期三","星期四","星期五","星期六","星期日"].includes(val)) {
        dayColIdx = c;
        break;
      }
    }
  }

  const todayRows = rows.filter(row => {
    const cellVal = (row[dayColIdx] || "").toLowerCase().trim();
    return dayKeywords.some(kw => cellVal === kw || cellVal.includes(kw));
  });

  if (!todayRows.length) {
    scheduleScroll.innerHTML = `<div class="schedule-empty">🎉 今日無課堂安排</div>`;
    return;
  }

  let visibleCount = 0;

  todayRows.forEach(row => {
    const times = [];
    const texts = [];

    row.forEach((cell, idx) => {
      if (idx === dayColIdx) return;
      const clean = (cell || "").trim();
      if (!clean) return;

      if (/^\d{1,2}:\d{2}/.test(clean)) {
        times.push(clean);
      } else {
        texts.push(clean);
      }
    });

    const startTimeStr = times[0] || "";
    const endTimeStr = times[1] || "";

    if (endTimeStr) {
      const [eH, eM] = endTimeStr.split(":").map(Number);
      const endTotalMinutes = eH * 60 + eM;
      if (currentMinutes >= endTotalMinutes) return;
    }

    visibleCount++;

    let countdownText = "";
    let isNow = false;

    if (startTimeStr) {
      const [sH, sM] = startTimeStr.split(":").map(Number);
      const startMin = sH * 60 + sM;
      let endMin = startMin + 45;

      if (endTimeStr) {
        const [eH, eM] = endTimeStr.split(":").map(Number);
        endMin = eH * 60 + eM;
      }

      if (currentMinutes >= startMin && currentMinutes < endMin) {
        isNow = true;
        const remain = endMin - currentMinutes;
        countdownText = `進行中 (${remain}m)`;
      } else if (currentMinutes < startMin) {
        const diff = startMin - currentMinutes;
        const h = Math.floor(diff / 60);
        const m = diff % 60;
        countdownText = h > 0 ? `重有 ${h}h ${m}m` : `重有 ${m}m`;
      }
    }

    const timeDisplay = startTimeStr && endTimeStr ? `${startTimeStr} - ${endTimeStr}` : (startTimeStr || "--:--");
    const periodText = texts[0] || "";
    const classText = texts[1] || "";
    const extraLoc = texts[2] ? `📍 ${texts[2]}` : "";

    const item = document.createElement("div");
    item.className = "schedule-item" + (isNow ? " now" : "");

    const timeDiv = document.createElement("div");
    timeDiv.className = "schedule-time";
    timeDiv.textContent = timeDisplay;

    const lineDiv = document.createElement("div");
    lineDiv.className = "schedule-line";
    const dot = document.createElement("div");
    dot.className = "schedule-dot";
    lineDiv.appendChild(dot);

    const infoDiv = document.createElement("div");
    infoDiv.className = "schedule-info";

    const titleDiv = document.createElement("div");
    titleDiv.className = "schedule-title";

    if (periodText) {
      const pBadge = document.createElement("span");
      pBadge.className = "period-badge";
      pBadge.textContent = isNaN(periodText) ? periodText : `第 ${periodText} 節`;
      titleDiv.appendChild(pBadge);
    }

    if (classText) {
      const cSpan = document.createElement("span");
      cSpan.className = "class-title";
      cSpan.textContent = classText;
      titleDiv.appendChild(cSpan);
    } else if (!periodText) {
      const cSpan = document.createElement("span");
      cSpan.className = "class-title";
      cSpan.textContent = "(課堂資料)";
      titleDiv.appendChild(cSpan);
    }

    if (countdownText) {
      const tag = document.createElement("span");
      tag.className = "countdown-tag";
      tag.textContent = countdownText;
      titleDiv.appendChild(tag);
    }

    infoDiv.appendChild(titleDiv);

    if (extraLoc) {
      const locDiv = document.createElement("div");
      locDiv.className = "schedule-location";
      locDiv.textContent = extraLoc;
      infoDiv.appendChild(locDiv);
    }

    item.appendChild(timeDiv);
    item.appendChild(lineDiv);
    item.appendChild(infoDiv);

    scheduleScroll.appendChild(item);
  });

  if (visibleCount === 0) {
    scheduleScroll.innerHTML = `<div class="schedule-empty">🎉 今日課堂已全部結束</div>`;
  }
}


/* =========================================================
   EMAIL RENDER
========================================================= */

function renderMail(mails) {
  mailScroll.innerHTML = "";

  if (!mails || !mails.length) {
    mailCount.textContent = "0 封";
    mailScroll.innerHTML = `<div class="mail-empty">🎉 沒有未讀 Email</div>`;
    return;
  }

  mailCount.textContent = `${mails.length} 封`;

  mails.forEach(mail => {
    let from = "未知發件人";
    let subject = "(無主旨)";
    let date = new Date();
    let snippet = mail.snippet || "";
    let mailId = mail.id || "";

    if (mail.payload && mail.payload.headers) {
      const headers = mail.payload.headers || [];
      const getHeader = name => {
        const h = headers.find(item => item.name.toLowerCase() === name.toLowerCase());
        return h ? h.value : "";
      };

      const rawFrom = getHeader("From");
      from = rawFrom.replace(/<.*>/, "").replace(/"/g, "").trim() || "未知發件人";
      subject = getHeader("Subject") || "(無主旨)";
      const dateStr = getHeader("Date");
      if (dateStr) date = new Date(dateStr);
    } else {
      if (mail.from) from = mail.from.replace(/<.*>/, "").replace(/"/g, "").trim();
      if (mail.subject) subject = mail.subject;
      if (mail.date) date = new Date(mail.date);
    }

    const card = document.createElement("div");
    card.className = "mail-card";

    card.addEventListener("click", () => {
      const url = mailId ? `https://mail.google.com/mail/u/0/#inbox/${mailId}` : `https://mail.google.com/mail/u/0/#inbox`;
      window.open(url, "_blank");
    });

    const top = document.createElement("div");
    top.className = "mail-top";

    const sender = document.createElement("div");
    sender.className = "mail-sender";
    sender.textContent = from;

    const time = document.createElement("div");
    time.className = "mail-time";
    time.textContent = `${formatDateMD(date)} ${formatTime(date)}`;

    top.appendChild(sender);
    top.appendChild(time);

    const subj = document.createElement("div");
    subj.className = "mail-subject";
    subj.textContent = subject;

    const snip = document.createElement("div");
    snip.className = "mail-snippet";
    snip.textContent = snippet;

    card.appendChild(top);
    card.appendChild(subj);
    card.appendChild(snip);

    mailScroll.appendChild(card);
  });
}


/* =========================================================
   WEATHER & AQHI API
========================================================= */

async function syncWeather() {
  try {
    const res = await fetch(`${HKO_API}?dataType=rhrread&lang=tc`);
    if (!res.ok) throw new Error("天氣資料讀取失敗");
    const data = await res.json();

    if (data.temperature && data.temperature.data) {
      const tempObj = data.temperature.data.find(d => d.place === "香港天文台") || data.temperature.data[0];
      document.getElementById("weatherTemp").textContent = `${tempObj.value}°C`;
    }

    if (data.humidity && data.humidity.data) {
      document.getElementById("humidity").textContent = `${data.humidity.data[0].value}%`;
    }

    if (data.rainfall && data.rainfall.data) {
      const rf = data.rainfall.data.find(d => d.place === "油尖旺") || data.rainfall.data[0];
      document.getElementById("rainProbability").textContent = `${rf.max || 0}mm`;
    }

    if (data.icon && data.icon.length) {
      const iconCode = data.icon[0];
      document.getElementById("weatherIcon").textContent = getWeatherEmoji(iconCode);
      document.getElementById("weatherText").textContent = getWeatherText(iconCode);
    }

    if (data.warningMessage && data.warningMessage.length) {
      warningBar.classList.add("active");
      warningText.textContent = data.warningMessage.join(" | ");
    } else {
      warningBar.classList.remove("active");
    }
  } catch (err) {
    console.error("Weather error:", err);
  }

  try {
    const aqRes = await fetch(AQHI_API);
    if (aqRes.ok) {
      const aqData = await aqRes.json();
      if (Array.isArray(aqData) && aqData.length) {
        const central = aqData.find(item => item.station === "中西區") || aqData[0];
        document.getElementById("aqhi").textContent = central.aqhi || "--";
      }
    }
  } catch (e) {}
}

function getWeatherEmoji(code) {
  if (code >= 50 && code <= 54) return "☀️";
  if (code >= 60 && code <= 65) return "☁️";
  if (code >= 80 && code <= 85) return "🌧️";
  return "🌤️";
}

function getWeatherText(code) {
  const map = {
    50: "陽光充沛", 51: "大致天晴", 52: "天晴", 53: "大致天晴", 54: "短暫陽光",
    60: "多雲", 61: "密雲", 62: "微雨", 63: "雨", 64: "大雨", 65: "狂風暴雨"
  };
  return map[code] || "多雲";
}
